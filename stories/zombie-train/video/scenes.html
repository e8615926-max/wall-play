<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Покадровый рендер ролика «Поезд, который никто не ведёт».
// render(t) рисует кадр на момент t секунд; всё детерминировано и зависит только от t.
const W = 1080, H = 1920;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

let TL = { scenes: {}, cues: [], total: 120 };
function setTimeline(tl) { TL = tl; }
// начало реплики i сцены sc — в локальном времени сцены
function cueT(sc, i) {
  const list = TL.cues.filter(c => c.scene === sc);
  return list[Math.min(i, list.length - 1)].start - TL.scenes[sc].start;
}
function cueE(sc, i) {
  const list = TL.cues.filter(c => c.scene === sc);
  return list[Math.min(i, list.length - 1)].end - TL.scenes[sc].start;
}

// ---------- утилиты ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rgb = (r, g, b, a = 1) => `rgba(${r | 0},${g | 0},${b | 0},${a})`;
const shade = (c, l, a = 1) => rgb(Math.min(255, c[0] * l), Math.min(255, c[1] * l), Math.min(255, c[2] * l), a);
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function poly(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function rrect(x, y, w, h, r) {
  if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glow(x, y, r, color, a) {
  if (a <= 0.001 || r <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('A', a)); g.addColorStop(1, color.replace('A', 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function shake(t, a) {
  return [a * (Math.sin(t * 13.1) + 0.6 * Math.sin(t * 29.3 + 1.3) + 0.3 * Math.sin(t * 51.7)),
          a * (Math.sin(t * 11.7 + 2) + 0.5 * Math.sin(t * 33.1 + 0.4) + 0.3 * Math.sin(t * 47.9))];
}
function camera(t, o) {
  // o: shake, sway (train rocking), zoom, cx, cy, rot, dx, dy
  const [sx, sy] = shake(t, o.shake || 0);
  const sway = o.sway || 0;
  ctx.translate(W / 2 + sx + (o.dx || 0), H / 2 + sy + (o.dy || 0) + Math.sin(t * 2.1) * sway * 6);
  ctx.rotate((o.rot || 0) + Math.sin(t * 1.3) * sway * 0.006);
  const z = o.zoom || 1; ctx.scale(z, z);
  ctx.translate(-(o.cx ?? W / 2), -(o.cy ?? H / 2));
}
function txt(s, x, y, size, color, opt = {}) {
  ctx.font = `${opt.weight || 'bold'} ${size}px ${opt.family || 'DejaVu Sans'}`;
  ctx.fillStyle = color; ctx.textAlign = opt.align || 'center'; ctx.textBaseline = 'middle';
  if (opt.spacing) ctx.letterSpacing = opt.spacing + 'px';
  ctx.fillText(s, x, y);
  ctx.letterSpacing = '0px';
}

// зерно плёнки
const grain = [];
for (let k = 0; k < 6; k++) {
  const g = document.createElement('canvas'); g.width = 540; g.height = 960;
  const gc = g.getContext('2d'); const id = gc.createImageData(540, 960); const r = rng(k + 11);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gc.putImageData(id, 0, 0); grain.push(g);
}

// ---------- лес и деревья ----------
function pine(x, base, h, w, col) {
  ctx.beginPath(); ctx.moveTo(x, base - h);
  const tiers = 6;
  for (let i = 1; i <= tiers; i++) {
    const y = base - h + h * i / tiers * 0.92, ww = w * (0.25 + 0.75 * i / tiers);
    ctx.lineTo(x + ww * 0.5, y); ctx.lineTo(x + ww * 0.18, y - h * 0.03);
  }
  ctx.lineTo(x + w * 0.05, base); ctx.lineTo(x - w * 0.05, base);
  for (let i = tiers; i >= 1; i--) {
    const y = base - h + h * i / tiers * 0.92, ww = w * (0.25 + 0.75 * i / tiers);
    ctx.lineTo(x - ww * 0.18, y - h * 0.03); ctx.lineTo(x - ww * 0.5, y);
  }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function pineRow(x0, x1, base, hMin, hMax, spacing, offset, seed, col, wMul = 0.38) {
  const i0 = Math.floor((x0 + offset) / spacing) - 2, i1 = Math.ceil((x1 + offset) / spacing) + 2;
  for (let i = i0; i <= i1; i++) {
    const x = i * spacing - offset + (hash(i * 1.7 + seed) - 0.5) * spacing * 0.8;
    const h = lerp(hMin, hMax, hash(i * 3.1 + seed * 2));
    pine(x, base + hash(i + seed * 5) * 10, h, h * wMul, col);
  }
}

// ---------- окно купе: что снаружи ----------
// o.travel — пройденный путь (м), o.stopped (0..1) — свет из окон на насыпи, o.moon, o.fig — фигура у леса
function outside(x0, y0, w, h, o) {
  const sky = ctx.createLinearGradient(0, y0, 0, y0 + h);
  sky.addColorStop(0, '#0b1222'); sky.addColorStop(0.55, '#070b14'); sky.addColorStop(1, '#030407');
  ctx.fillStyle = sky; ctx.fillRect(x0, y0, w, h);
  glow(x0 + w * 0.8, y0 + h * 0.12, w * 0.5, 'rgba(120,140,190,A)', 0.10 * (o.moon ?? 1));
  const horizon = y0 + h * 0.62, tr = o.travel || 0;
  // дальний лес
  pineRow(x0 - 50, x0 + w + 50, horizon, h * 0.18, h * 0.3, 34, tr * 6, 1, '#05080d');
  ctx.fillStyle = '#04060a'; ctx.fillRect(x0, horizon, w, h);
  // насыпь, освещённая окнами стоящего поезда
  if ((o.stopped || 0) > 0) {
    const s = o.stopped * (o.trainLight ?? 1);
    const gy = y0 + h * 0.8;
    const g = ctx.createLinearGradient(0, gy, 0, y0 + h);
    g.addColorStop(0, rgb(60, 48, 30, 0)); g.addColorStop(1, rgb(150, 115, 70, 0.55 * s));
    ctx.fillStyle = g; ctx.fillRect(x0, gy, w, y0 + h - gy);
    const r = rng(77);
    for (let i = 0; i < 260; i++) {
      const gx = x0 + r() * w, gyy = gy + Math.pow(r(), 0.6) * (y0 + h - gy);
      ctx.fillStyle = rgb(170, 140, 100, (0.1 + 0.4 * r()) * s * ((gyy - gy) / (y0 + h - gy)));
      ctx.fillRect(gx, gyy, 2 + r() * 4, 1.5 + r() * 2);
    }
    // стволы сосен на краю света
    for (let i = 0; i < 7; i++) {
      const tx = x0 + (i + 0.3 + hash(i) * 0.5) * w / 7, tw = 10 + hash(i + 9) * 16;
      const tg = ctx.createLinearGradient(0, y0 + h * 0.35, 0, y0 + h * 0.85);
      tg.addColorStop(0, rgb(10, 9, 8, 1)); tg.addColorStop(1, rgb(80, 60, 40, 0.9 * s + 0.1));
      ctx.fillStyle = tg; ctx.fillRect(tx, y0 + h * 0.2, tw, h * 0.62);
    }
  }
  // фигура у кромки леса
  if (o.fig > 0) {
    const fx = x0 + w * (0.2 + 0.25 * o.figPos), fy = horizon + h * 0.12;
    ctx.save(); ctx.globalAlpha = o.fig;
    const fh = h * 0.24;
    ctx.fillStyle = 'rgba(85,95,110,0.95)';
    ctx.beginPath(); ctx.ellipse(fx, fy - fh * 0.92, fh * 0.07, fh * 0.09, 0, 0, 7); ctx.fill();
    ctx.fillRect(fx - fh * 0.1, fy - fh * 0.82, fh * 0.2, fh * 0.42);
    ctx.fillRect(fx - fh * 0.08, fy - fh * 0.42, fh * 0.06, fh * 0.42);
    ctx.fillRect(fx + fh * 0.02, fy - fh * 0.42, fh * 0.06, fh * 0.42);
    ctx.restore();
  }
  // ближний лес — с размытием движения
  const speed = o.speed || 0;
  if (speed > 0.05) ctx.filter = `blur(${(speed * 9).toFixed(1)}px)`;
  pineRow(x0 - 200, x0 + w + 200, y0 + h * 0.98, h * 0.75, h * 1.15, 150, tr * 60, 7, '#020305', 0.42);
  ctx.filter = 'none';
  if (speed > 0.5) {
    // пятна света от окон поезда, бегущие по деревьям
    for (let i = 0; i < 4; i++) {
      const px = x0 + ((i * 260 - tr * 45) % (w + 300) + w + 300) % (w + 300) - 150;
      glow(px, y0 + h * 0.85, 110, 'rgba(170,125,70,A)', 0.08);
    }
  }
}

// ---------- купе ----------
// o: L — свет в купе, curtain (0..1 отодвинута), glass {x, y, rot, a}, bag, man (одеяло дёрнулось), em — свет из коридора
function compartment(t, o) {
  const L = o.L;
  const bx0 = 160, bx1 = 920, by0 = 420, by1 = 1340;
  ctx.fillStyle = '#000'; ctx.fillRect(-200, -200, W + 400, H + 400);
  poly([[-200, -200], [W + 200, -200], [bx1, by0], [bx0, by0]], shade([150, 142, 125], L * 0.55));
  poly([[-200, -200], [bx0, by0], [bx0, by1], [-200, H + 200]], shade([128, 98, 70], L * 0.62));
  poly([[W + 200, -200], [bx1, by0], [bx1, by1], [W + 200, H + 200]], shade([128, 98, 70], L * 0.45));
  poly([[bx0, by1], [bx1, by1], [W + 200, H + 200], [-200, H + 200]], shade([95, 28, 32], L * 0.45));
  // задняя стена
  const wg = ctx.createLinearGradient(0, by0, 0, by1);
  wg.addColorStop(0, shade([150, 118, 86], L * 0.75)); wg.addColorStop(1, shade([150, 118, 86], L * 0.95));
  ctx.fillStyle = wg; ctx.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
  // окно
  const wx = 290, wy = 560, ww = 500, wh = 470;
  ctx.save(); rrect(wx, wy, ww, wh, 36); ctx.clip();
  outside(wx, wy, ww, wh, o);
  // отражение лампы и купе в стекле
  glow(wx + ww * 0.3, wy + wh * 0.2, 150, 'rgba(255,220,170,A)', 0.10 * L);
  ctx.fillStyle = rgb(255, 230, 200, 0.03 * L); ctx.fillRect(wx, wy, ww, wh);
  ctx.restore();
  ctx.lineWidth = 16; ctx.strokeStyle = shade([150, 150, 155], L * 0.6 + 0.04);
  rrect(wx, wy, ww, wh, 36); ctx.stroke();
  // штора
  const cOpen = o.curtain ?? 0.3;
  const curtain = (x, w, flip) => {
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, shade([215, 210, 200], L * (i % 2 ? 0.55 : 0.85) + 0.02));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x, wy - 30);
    ctx.lineTo(x + w, wy - 30);
    ctx.quadraticCurveTo(x + w + (flip ? -1 : 1) * 12 * Math.sin(t * 2 + x), wy + wh * 0.5, x + w, wy + wh + 30);
    ctx.lineTo(x, wy + wh + 30); ctx.closePath(); ctx.fill();
  };
  curtain(wx - 70, 70 + 120 * (1 - cOpen), false);
  curtain(wx + ww - 50 - 60 * (1 - cOpen), 120 + 60 * (1 - cOpen), true);
  // ламбрекен
  ctx.fillStyle = shade([200, 190, 175], L * 0.7 + 0.02); ctx.fillRect(wx - 90, wy - 70, ww + 180, 70);
  for (let i = 0; i < 12; i++) { ctx.fillStyle = shade([150, 140, 125], L * 0.6); ctx.fillRect(wx - 90 + i * 57, wy - 70, 6, 70); }
  // столик
  poly([[300, 1110], [780, 1110], [870, 1225], [210, 1225]], shade([190, 172, 146], L * 0.85));
  poly([[210, 1225], [870, 1225], [870, 1252], [210, 1252]], shade([90, 76, 60], L * 0.8));
  // салфетка
  poly([[360, 1120], [560, 1120], [580, 1210], [330, 1210]], shade([230, 228, 220], L * 0.8));
  // нижняя полка справа и одеяло соседа сверху
  poly([[bx1, 1150], [W + 200, 1330], [W + 200, 1720], [bx1, 1330]], shade([42, 52, 86], L * 0.6));
  poly([[bx1, 1130], [W + 200, 1290], [W + 200, 1335], [bx1, 1152]], shade([70, 60, 50], L * 0.6));
  poly([[bx1, 700], [W + 200, 560], [W + 200, 610], [bx1, 722]], shade([90, 80, 70], L * 0.6));
  const jerk = o.man || 0;
  ctx.fillStyle = shade([100, 100, 106], L * 0.7);
  ctx.beginPath(); ctx.moveTo(bx1 + 5, 700);
  ctx.bezierCurveTo(bx1 + 60, 600 - jerk * 30, W - 60, 520 - jerk * 40, W + 200, 470 - jerk * 20);
  ctx.lineTo(W + 200, 565); ctx.lineTo(bx1 + 5, 702); ctx.closePath(); ctx.fill();
  // наша полка — передний план слева снизу
  poly([[-200, 1500], [330, 1560], [380, H + 200], [-200, H + 200]], shade([38, 48, 80], L * 0.5));
  poly([[-200, 1470], [330, 1530], [330, 1565], [-200, 1505]], shade([60, 50, 42], L * 0.5));
  // плафон
  glow(540, 250, 420, 'rgba(255,215,160,A)', 0.35 * L);
  ctx.fillStyle = shade([255, 235, 200], 0.15 + L * 0.85); ctx.beginPath(); ctx.ellipse(540, 250, 120, 26, 0, 0, 7); ctx.fill();
  // свет аварийки из-под двери (слева)
  if (o.em > 0) {
    const g = ctx.createLinearGradient(0, 0, 260, 0);
    g.addColorStop(0, rgb(60, 170, 150, 0.25 * o.em)); g.addColorStop(1, rgb(60, 170, 150, 0));
    ctx.fillStyle = g; ctx.fillRect(-200, by0, 460, H);
  }
  // стакан в подстаканнике
  if (o.glass && o.glass.a > 0) teaGlass(o.glass.x, o.glass.y, o.glass.rot || 0, L, o.glass.a, t, o.glass.rattle || 0);
  if (o.shards) shards(o.shards, L);
  if (o.bag) {
    ctx.save(); ctx.translate(o.bag.x, o.bag.y); ctx.rotate(o.bag.rot);
    ctx.fillStyle = shade([40, 40, 46], L * 0.7 + 0.03); rrect(-150, -90, 300, 180, 24); ctx.fill();
    ctx.fillStyle = shade([20, 20, 24], 1); ctx.fillRect(-150, -12, 300, 10);
    ctx.restore();
  }
}
function teaGlass(x, y, rot, L, a, t, rattle) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y + Math.sin(t * 40) * rattle); ctx.rotate(rot);
  // стекло
  ctx.fillStyle = rgb(200, 220, 230, 0.18); ctx.fillRect(-36, -150, 72, 150);
  // чай
  ctx.fillStyle = shade([150, 70, 20], L * 0.9 + 0.05, 0.85); ctx.fillRect(-34, -128, 68, 128);
  // ложка
  ctx.strokeStyle = shade([200, 200, 205], L + 0.1); ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(10, -60); ctx.lineTo(22 + Math.sin(t * 40) * rattle * 0.6, -190); ctx.stroke();
  // подстаканник
  const g = ctx.createLinearGradient(-44, 0, 44, 0);
  g.addColorStop(0, shade([90, 90, 95], L)); g.addColorStop(0.35, shade([230, 230, 235], L));
  g.addColorStop(0.6, shade([150, 150, 155], L)); g.addColorStop(1, shade([70, 70, 75], L));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-42, -105); ctx.lineTo(42, -105); ctx.lineTo(38, 0); ctx.lineTo(-38, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade([60, 60, 64], L, 0.8);
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-21 + i * 14, -55, 5, 22, 0, 0, 7); ctx.fill(); }
  ctx.strokeStyle = g; ctx.lineWidth = 9; ctx.beginPath(); ctx.arc(46, -55, 26, -1.3, 1.3); ctx.stroke();
  ctx.restore();
}
function shards(s, L) {
  const r = rng(5);
  for (let i = 0; i < 26; i++) {
    const ang = -Math.PI * (0.1 + 0.8 * r()), sp = 200 + 500 * r(), k = s.k;
    const x = s.x + Math.cos(ang) * sp * k * 0.7, y = s.y + Math.sin(ang) * sp * k + 900 * k * k;
    const yy = Math.min(y, s.floor - r() * 40);
    ctx.save(); ctx.translate(x, yy); ctx.rotate(r() * 6 + k * 8);
    ctx.fillStyle = rgb(220, 235, 245, 0.6 * L + 0.2);
    ctx.beginPath(); ctx.moveTo(0, -8 - r() * 10); ctx.lineTo(6 + r() * 6, 4); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = rgb(90, 40, 10, 0.5 * clamp(s.k * 2));
  ctx.beginPath(); ctx.ellipse(s.x + 40, s.floor, 180 * clamp(s.k * 1.5), 30 * clamp(s.k * 1.5), 0, 0, 7); ctx.fill();
}

// ---------- коридор купейного вагона ----------
const COR = { L: -0.66, R: 0.66, FL: -1.5, CE: 0.75 };
function corridor(t, o) {
  const f = o.f || 760, vx = W / 2 + (o.vpx || 0), vy = H * 0.43 + (o.vpy || 0);
  const { L, R, FL, CE } = COR;
  const camZ = o.camZ || 0, endZ = o.endZ || 20, near = 0.3;
  const P = (x, y, zw) => { const z = Math.max(zw - camZ, near); return [vx + f * (x - (o.camX || 0)) / z, vy - f * (y - (o.camY || 0)) / z]; };
  const lampZ = k => 1.3 + 2.6 * k;
  const nL = Math.ceil(endZ / 2.6) + 1;
  const li = []; for (let k = 0; k < nL; k++) li.push(o.lampI ? o.lampI(k) : 0.8);
  const amb = o.amb ?? 0.03, em = o.em || 0;
  const pal = o.pal || {};
  const light = zw => {
    let s = amb + em * 0.08;
    for (let k = 0; k < nL; k++) { const d = zw - lampZ(k); s += li[k] * Math.exp(-d * d / 5); }
    if (o.extraLight) s += o.extraLight(zw);
    return s * Math.exp(-Math.max(zw - camZ, near) / (o.fog || 13));
  };
  ctx.fillStyle = '#000'; ctx.fillRect(-300, -300, W + 600, H + 600);
  const step = 0.35;
  for (let zw = Math.max(camZ + near, 0); zw < endZ; zw += step) {
    const za = zw, zb = Math.min(zw + step + 0.03, endZ), zm = zw + step / 2, l = light(zm);
    poly([P(L, FL, za), P(R, FL, za), P(R, FL, zb), P(L, FL, zb)], shade(pal.floor || [55, 46, 42], l));
    if (!pal.noCarpet) {
      const stripe = (Math.floor(zm / 0.7) % 2) ? 1 : 0.85;
      poly([P(-0.42, FL, za), P(0.42, FL, za), P(0.42, FL, zb), P(-0.42, FL, zb)], shade([125, 26, 34], l * stripe));
    }
    poly([P(L, CE, za), P(R, CE, za), P(R, CE, zb), P(L, CE, zb)], shade(pal.ceil || [150, 146, 132], l * 0.75));
    poly([P(L, FL, za), P(L, CE, za), P(L, CE, zb), P(L, FL, zb)], shade(pal.left || [118, 104, 90], l * 0.85));
    poly([P(R, FL, za), P(R, CE, za), P(R, CE, zb), P(R, FL, zb)], shade(pal.right || [146, 106, 70], l * 0.95));
  }
  const vis = zw => zw - camZ > near && zw < endZ;
  // окна слева
  if (!pal.noWindows) for (let k = 0; k < 14; k++) {
    const z0 = 0.6 + k * 1.75, z1 = z0 + 1.1; if (!vis(z0) || z1 > endZ) continue;
    const l = light((z0 + z1) / 2);
    poly([P(L, -0.25, z0), P(L, 0.5, z0), P(L, 0.5, z1), P(L, -0.25, z1)], o.windowCol ? o.windowCol(k, l) : shade([14, 20, 34], 0.6 + l * 0.6));
    poly([P(L, -0.25, z0), P(L, 0.5, z0), P(L, 0.5, z0 + 0.18), P(L, -0.25, z0 + 0.18)], shade([210, 205, 195], l * 0.8));
    poly([P(L, -0.25, z1 - 0.18), P(L, 0.5, z1 - 0.18), P(L, 0.5, z1), P(L, -0.25, z1)], shade([210, 205, 195], l * 0.8));
  }
  // поручень
  if (!pal.noWindows) for (let zw = Math.max(camZ + near, 0); zw < endZ; zw += step) {
    const l = light(zw); const zb = Math.min(zw + step + 0.03, endZ);
    poly([P(L + 0.01, -0.36, zw), P(L + 0.01, -0.32, zw), P(L + 0.01, -0.32, zb), P(L + 0.01, -0.36, zb)], shade([200, 200, 205], l));
  }

    const fingers = [[-46, -40, -0.25, 92], [-17, -58, -0.08, 112], [14, -60, 0.05, 116], [42, -46, 0.2, 98]];
    for (const [fx, fy, fr, fl] of fingers) { ctx.save(); ctx.translate(fx, fy); ctx.rotate(fr); rrect(-13, -fl, 26, fl + 10, 13); ctx.fill(); ctx.restore(); }
    ctx.save(); ctx.translate(58, 10); ctx.rotate(0.9); rrect(-14, -70, 28, 80, 14); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#121826'; ctx.fillRect(-56, 60, 112, 200);
    ctx.restore();
    if (flat) glow(px, py, 200, 'rgba(200,220,255,A)', 0.12);
  }
}
SC[17] = (lt, d, t) => {
  ctx.fillStyle = '#000'; ctx.fillRect(-300, -300, W + 600, H + 600);
  const f = lt > d - 2.15 && lt < d - 1.95;
  if (f) { glow(540, 1500, 220, 'rgba(255,30,20,A)', 0.8); ctx.fillStyle = 'rgb(255,60,40)'; ctx.beginPath(); ctx.arc(540, 1500, 18, 0, 7); ctx.fill(); }
};

// ---------- главный рендер ----------
const GRADE = { 1: 'w', 2: 'w', 3: 'w', 4: 'w', 5: 'w', 6: 'c', 7: 'c', 8: 'c', 9: 'c', 10: 'c', 11: 'c', 12: 'c', 13: 'c', 14: 'r', 15: 'r', 16: 'c', 17: 'k' };
function render(t) {
  const ids = Object.keys(TL.scenes).map(Number).sort((a, b) => a - b);
  let sc = ids[0];
  for (const id of ids) if (t >= TL.scenes[id].start) sc = id;
  const s = TL.scenes[sc], lt = t - s.start, d = s.end - s.start;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.save();
  SC[sc](lt, d, t);
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  // цветокоррекция по сценам
  const gr = GRADE[sc];
  if (gr !== 'k') {
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = gr === 'w' ? 'rgba(255,170,90,0.2)' : gr === 'r' ? 'rgba(255,60,40,0.25)' : 'rgba(40,90,140,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  // виньетка
  const g = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.22, W / 2, H * 0.45, H * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // зерно
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.13;
  ctx.drawImage(grain[Math.floor(t * 24) % grain.length], 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // открытие из темноты
  if (t < 0.8) { ctx.fillStyle = rgb(0, 0, 0, 1 - t / 0.8); ctx.fillRect(0, 0, W, H); }
}
window.render = render; window.setTimeline = setTimeline;
