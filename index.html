function glyph(ch) { if (GLYPH_ALIAS[ch]) ch = GLYPH_ALIAS[ch]; return GLYPHS[ch] || GLYPHS['?']; }
const textCache = new Map();
function textCanvas(s, k, color, outline) {
  const key = s + '|' + k + '|' + color + '|' + outline;
  let c = textCache.get(key);
  if (c) return c;
  if (textCache.size > 400) textCache.clear();
  const o = outline ? k : 0;
  c = document.createElement('canvas');
  c.width = Math.max(1, s.length * 6 * k - k + o * 2);
  c.height = 7 * k + o * 3;
  const g = c.getContext('2d');
  const pass = (col, grow) => {
    g.fillStyle = col;
    for (let i = 0; i < s.length; i++) {
      const gl = glyph(s[i]);
      for (let r = 0; r < 7; r++) for (let q = 0; q < 5; q++) if (gl[r][q] === '#') {
        const x = o + (i * 6 + q) * k, y = o + r * k;
        if (grow) g.fillRect(x - k, y - k, k * 3, k * 4); else g.fillRect(x, y, k, k);
      }
    }
  };
  if (outline) pass(outline, true);
  pass(color, false);
  textCache.set(key, c);
  return c;
}
function text(s, x, y, k, color = '#fff', align = 'center', outline = OL) {
  const c = textCanvas(String(s).toUpperCase(), k, color, outline);
  const dx = align === 'center' ? x - c.width / 2 : align === 'right' ? x - c.width : x;
  ctx.drawImage(c, Math.round(dx), Math.round(y - c.height));
  return c.width;
}

// ---------- Звук и музыка ----------
let ac = null, master = null, musicGain = null, noiseBuf = null;
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.gain.value = 0.55; musicGain.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function note(f0, f1, t, dur, type, vol, dest) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || master);
  o.start(t); o.stop(t + dur + 0.02);
}
function tone(f0, f1, dur, type = 'square', vol = 0.08, delay = 0) {
  if (!audio()) return;
  note(f0, f1, ac.currentTime + delay, dur, type, vol);
}
function noiseAt(t, dur, vol, dest, hp) {
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = noiseBuf;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = s;
  if (hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; s.connect(f); node = f; }
  node.connect(g); g.connect(dest || master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}

// Весёлая чиптюн-песенка; в каждой зоне своя тональность
const MEL = [
  72, 0, 76, 79, 76, 0, 72, 74,  76, 76, 74, 72, 74, 0, 67, 0,
  72, 0, 76, 79, 81, 79, 76, 79,  77, 76, 74, 72, 72, 0, 0, 0,
  69, 0, 72, 76, 77, 0, 76, 74,  72, 72, 71, 69, 71, 0, 67, 0,
  69, 72, 76, 77, 79, 77, 76, 74,  76, 74, 72, 71, 72, 0, 79, 0,
];
const BASS = [48, 43, 41, 43, 45, 40, 41, 43];
const STEP = 0.18;
let mStep = 0, mTime = 0, musicOn = false;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function scheduleStep(s, t) {
  const tr = ZONES[zoneIdx || 0].tr;
  const n = MEL[s];
  if (n) { note(midi(n + tr), midi(n + tr), t, STEP * 0.95, 'square', 0.045, musicGain); note(midi(n + tr + 12), midi(n + tr + 12), t, STEP * 0.5, 'triangle', 0.015, musicGain); }
  if (s % 2 === 0) {
    const bn = BASS[Math.floor(s / 8)] + [0, 12, 7, 12][(s % 8) / 2] + tr;
    note(midi(bn), midi(bn), t, STEP * 1.7, 'triangle', 0.11, musicGain);
  }
  if (s % 4 === 0) note(140, 45, t, 0.12, 'sine', 0.2, musicGain);
  if (s % 2 === 1) noiseAt(t, 0.04, 0.025, musicGain, 6000);
  if (s % 8 === 4) noiseAt(t, 0.1, 0.05, musicGain, 1500);
}
setInterval(() => {
  if (!ac || !musicOn || ac.state !== 'running') return;
  if (mTime < ac.currentTime) mTime = ac.currentTime + 0.05;
  while (mTime < ac.currentTime + 0.25) { scheduleStep(mStep, mTime); mTime += STEP; mStep = (mStep + 1) % 64; }
}, 40);
function startMusic() { if (audio()) musicOn = true; }
function toggleMute() {
  muted = !muted; store.set('muted', muted);
  if (master) master.gain.value = muted ? 0 : 1;
}

// ---------- Утилиты ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const even = v => Math.round(v / 2) * 2;
function hash(n) { n = (n << 13) ^ n; return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff; }
const hash2 = (a, b) => hash((a * 73856093) ^ (b * 19349663));
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
}
const zoneIdxAt = m => { let i = 0; for (let k = 0; k < ZONES.length; k++) if (m >= ZONES[k].m) i = k; return i; };
const diffAt = m => clamp(m / 1500, 0, 1);
function pick(opts) {
  let sum = 0; for (const k in opts) sum += opts[k];
  let r = Math.random() * sum;
  for (const k in opts) { if ((r -= opts[k]) <= 0) return k; }
  return Object.keys(opts)[0];
}

// Пиксельные примитивы: «пиксель» = 2×2 точки
function prect(c, x, y, w, h, col) {
  const x0 = even(x), y0 = even(y), x1 = even(x + w), y1 = even(y + h);
  if (x1 > x0 && y1 > y0) { c.fillStyle = col; c.fillRect(x0, y0, x1 - x0, y1 - y0); }
}
function pell(c, cx, cy, rx, ry, col) {
  c.fillStyle = col;
  const g0 = Math.floor((cy - ry) / 2), g1 = Math.ceil((cy + ry) / 2);
  for (let g = g0; g < g1; g++) {
    const dy = (g * 2 + 1 - cy) / ry;
    if (dy < -1 || dy > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy);
    const x0 = even(cx - hw), x1 = even(cx + hw);
    if (x1 > x0) c.fillRect(x0, g * 2, x1 - x0, 2);
  }
}
// эллипс и треугольник в 1-пиксельной сетке (для спрайта героя)
function sell(c, cx, cy, rx, ry, col) {
  c.fillStyle = col;
  for (let y = Math.floor(cy - ry); y < Math.ceil(cy + ry); y++) {
    const dy = (y + 0.5 - cy) / ry;
    if (dy < -1 || dy > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy);
    const x0 = Math.round(cx - hw), x1 = Math.round(cx + hw);
    if (x1 > x0) c.fillRect(x0, y, x1 - x0, 1);
  }
}
function stri(c, cx, top, h, col, grow = 0) {
  c.fillStyle = col;
  for (let r = -grow; r < h + grow; r++) {
    const hw = Math.max(0.5, (r + 1) * 0.6) + grow;
    c.fillRect(Math.round(cx - hw), Math.round(top + r), Math.max(1, Math.round(hw * 2)), 1);
  }
}

// ---------- Спрайт героя ----------
const hcv = document.createElement('canvas'); hcv.width = 32; hcv.height = 32;
const hctx = hcv.getContext('2d');
function heroSprite(sk, pose, t, blink) {
  const c = hctx;
  c.clearRect(0, 0, 32, 32);
  const B = { x: 16, y: 20.5, rx: 5.5, ry: 5 };
  const Hd = { x: 16, y: 12, rx: 7.5, ry: 6.5 };
  let F1 = { x: 13, y: 25.5 }, F2 = { x: 19.5, y: 25.5 }, A1 = { x: 21, y: 20 }, A2 = null;
  // дыхание: грудь раздувается, голова и лапки приподнимаются
  const br = Math.sin(t * 2.4);
  const inh = br > 0.25 ? 1 : 0, deep = br > 0.8 ? 1 : 0;
  if (pose === 'idle') {
    B.ry += inh + deep * 0.5; B.rx += inh * 0.6; B.y -= inh * 0.5 + deep * 0.5;
    Hd.y -= inh + deep; A1.y -= inh + deep; A1.x += inh * 0.5;
  } else if (pose === 'cling') {
    B.x = 17; B.y = 20; Hd.x = 17.5; Hd.y = 11.5;
    F1 = { x: 11.5, y: 24.5 }; F2 = { x: 15.5, y: 26 };
    A1 = { x: 22, y: 19 }; A2 = { x: 10, y: 14.5 };
    B.ry += inh * 0.8; Hd.y -= inh; A1.y -= inh;
  } else if (pose === 'jump') {
    B.ry = 5.8; B.y = 20; Hd.y = 11; Hd.x = 16.5;
    F1 = { x: 12.5, y: 26.5 }; F2 = { x: 16, y: 27 };
    A1 = { x: 22, y: 13 }; A2 = { x: 10.5, y: 14 };
  } else if (pose === 'fall') {
    F1 = { x: 12.5, y: 25 }; F2 = { x: 20, y: 25 };
    A1 = { x: 22.5, y: 11 }; A2 = { x: 9.5, y: 11 };
  } else if (pose === 'tuck') {
    B.rx = 6; B.y = 19; Hd.y = 12.5;
    F1 = { x: 13.5, y: 23.5 }; F2 = { x: 18.5, y: 24 };
    A1 = { x: 20.5, y: 18 };
  }
  const ears = sk.ears || 'round', ol = sk.ol;
  const long = ears === 'long';
  const E1 = { x: Hd.x - 4.5, y: Hd.y - (long ? 9 : 6.5), rx: 2.5, ry: long ? 4.5 : 2.5 };
  const E2 = { x: Hd.x + 3.5, y: Hd.y - (long ? 9.5 : 7), rx: 2.5, ry: long ? 4.5 : 2.5 };
  // контур
  if (ears === 'round' || long) for (const e of [E1, E2]) sell(c, e.x, e.y, e.rx + 1, e.ry + 1, ol);
  if (ears === 'cat') { stri(c, Hd.x - 4, Hd.y - 11, 5, ol, 1); stri(c, Hd.x + 4, Hd.y - 11.5, 5, ol, 1); }
  sell(c, Hd.x, Hd.y, Hd.rx + 1, Hd.ry + 1, ol);
  sell(c, B.x, B.y, B.rx + 1, B.ry + 1, ol);
  if (!sk.ghost) for (const f of [F1, F2]) sell(c, f.x, f.y, 3.6, 2.6, ol);
  else for (let i = -1; i <= 1; i++) sell(c, B.x + i * 4, B.y + B.ry, 2.6, 2.6, ol);
  for (const a of [A1, A2]) if (a) sell(c, a.x, a.y, 2.8, 3, ol);
  if (sk.horn) stri(c, Hd.x + 3, Hd.y - 12, 5, ol, 1);
  // заливка
  if (A2) sell(c, A2.x, A2.y, 1.8, 2, sk.dark);
  if (ears === 'round' || long) for (const e of [E1, E2]) { sell(c, e.x, e.y, e.rx, e.ry, sk.earC || sk.body); sell(c, e.x, e.y + 0.5, 1.2, e.ry - 1.2, sk.ear); }
  if (ears === 'cat') { stri(c, Hd.x - 4, Hd.y - 11, 5, sk.body); stri(c, Hd.x + 4, Hd.y - 11.5, 5, sk.body); stri(c, Hd.x - 4, Hd.y - 9, 3, sk.ear); stri(c, Hd.x + 4, Hd.y - 9.5, 3, sk.ear); }
  sell(c, B.x, B.y, B.rx, B.ry, sk.body);
  if (sk.ghost) for (let i = -1; i <= 1; i++) sell(c, B.x + i * 4, B.y + B.ry, 1.6, 1.6, sk.body);
  sell(c, B.x + 1, B.y + 1, B.rx - 2, B.ry - 1.5, sk.light);
  if (sk.stripes) { c.fillStyle = sk.stripes; c.fillRect(Math.round(B.x - 4), Math.round(B.y - 1), 3, 1); c.fillRect(Math.round(B.x - 4), Math.round(B.y + 2), 3, 1); }
  if (!sk.ghost) for (const f of [F1, F2]) sell(c, f.x, f.y, 2.6, 1.6, sk.dark);
  sell(c, Hd.x, Hd.y, Hd.rx, Hd.ry, sk.body);
  if (sk.stripes) { c.fillStyle = sk.stripes; for (const dx of [-3, 0, 3]) c.fillRect(Math.round(Hd.x + dx), Math.round(Hd.y - 6), 1, 2); }
  sell(c, Hd.x + 3.2, Hd.y + 2.5, 3.6, 2.6, sk.light);
  const ex1 = Math.round(Hd.x + 1), ex2 = Math.round(Hd.x + 5), ey = Math.round(Hd.y - 3);
  if (sk.mask) { c.fillStyle = sk.mask; c.fillRect(Math.round(Hd.x - 6), ey - 1, 14, 4); }
  if (sk.patch) { c.fillStyle = sk.patch; c.fillRect(ex1 - 1, ey - 1, 4, 5); c.fillRect(ex2 - 1, ey - 1, 4, 5); }
  const dark = sk.patch || sk.mask;
  if (blink) {
    c.fillStyle = dark ? '#ffffff' : '#1a1010'; c.fillRect(ex1, ey + 2, 2, 1); c.fillRect(ex2, ey + 2, 2, 1);
  } else {
    c.fillStyle = '#1a1010'; c.fillRect(ex1, ey, 2, 3); c.fillRect(ex2, ey, 2, 3);
    c.fillStyle = '#ffffff'; c.fillRect(ex1, ey, 1, 1); c.fillRect(ex2, ey, 1, 1);
  }
  if (sk.beak) { c.fillStyle = '#ff9a2a'; c.fillRect(Math.round(Hd.x + 6), Math.round(Hd.y), 3, 2); }
  else { c.fillStyle = '#ff5a8a'; c.fillRect(Math.round(Hd.x + 6), Math.round(Hd.y), 2, 1); }
  c.fillStyle = '#ff9ab8'; c.fillRect(Math.round(Hd.x - 2), Math.round(Hd.y + 2), 2, 1);
  if (pose === 'tuck' || pose === 'jump') { c.fillStyle = '#1a1010'; c.fillRect(Math.round(Hd.x + 4), Math.round(Hd.y + 3), 2, 1); }
  if (sk.horn) { stri(c, Hd.x + 3, Hd.y - 12, 5, sk.horn); c.fillStyle = '#ffffff'; c.fillRect(Math.round(Hd.x + 3), Math.round(Hd.y - 10), 1, 1); }
  if (sk.horns) {
    c.fillStyle = ol; c.fillRect(Math.round(Hd.x - 4), Math.round(Hd.y - 9), 3, 4); c.fillRect(Math.round(Hd.x + 2), Math.round(Hd.y - 9), 3, 4);
    c.fillStyle = sk.horns; c.fillRect(Math.round(Hd.x - 3), Math.round(Hd.y - 8), 1, 2); c.fillRect(Math.round(Hd.x + 3), Math.round(Hd.y - 8), 1, 2);
  }
  if (sk.antenna) {
    c.fillStyle = ol; c.fillRect(Math.round(Hd.x + 1), Math.round(Hd.y - 11), 1, 5);
    c.fillStyle = sk.antenna; c.fillRect(Math.round(Hd.x), Math.round(Hd.y - 13 + (Math.sin(t * 8) > 0 ? 1 : 0)), 3, 2);
  }
  sell(c, A1.x, A1.y, 1.8, 2, sk.body);
  // шарф
  const sy = Math.round(B.y - B.ry + 0.5), sx = Math.round(B.x - 5.5);
  c.fillStyle = sk.scarf; c.fillRect(sx, sy, 11, 2);
  c.fillStyle = sk.scarfD; c.fillRect(sx, sy + 2, 11, 1);
  for (let i = 0; i < 6; i++) {
    const yy = Math.round(sy + Math.sin(t * 14 - i * 0.9) * 1.3 + i * 0.35);
    c.fillStyle = i % 2 ? sk.scarfD : sk.scarf;
    c.fillRect(sx - 1 - i, yy, 1, 2);
  }
}

let state = 'menu';   // menu | shop | ach | play | dead | over
let p, poles, path, birds, ents, parts, leaves, camY, camR, minY, coinsRun, shake, deadT, zoneIdx = 0, banner, kicks, flips, combo, comboT, time = 0, paused, held = false, blinkT = 0, tutStep, toasts = [], zonesSeen;
const GROUND = { x0: -400, x1: W + 400, y0: 0, y1: 2000 };

function makePole(cx, y0, y1, kind, face, zone) {
  return { cx, x0: cx - 7, x1: cx + 7, y0, y1, kind, face, zone, thorn: 0, timer: 0, flipA: -1, flipped: false,
           crT: -1, amp: 0, spd: 0, baseX: cx, t: rand(0, 6), seed: Math.floor(Math.random() * 1e5) };
}

function reset() {

const heightM = () => Math.max(0, Math.floor((-PH / 2 - minY) / PX_PER_M));

// ---------- Генерация: столбы вразброс ----------
function kindFor(m, d, mode, prev, zi) {
  const z = ZONES[zi];
  const o = { log: 3 };
  const calm = prev.kind !== 'log';
  if (m > 20) o.thorn = (0.7 + d) * (calm ? 0.4 : 1);
  if (m > 40) o.crumble = (0.6 + d * 0.5) * (calm ? 0.4 : 1);
  if (m > 55) o.ice = 0.5 * (z.ice || 1);
  if (m > 80) o.rotor = (0.7 + d) * (calm ? 0.4 : 1);
  if (m > 120 && mode === 'cross') o.move = 0.6 + d * 0.5;
  return pick(o);
}

function overlapsPole(x, y0, y1, minDx) {
  return poles.some(q => Math.abs(q.cx - x) < minDx && q.y0 < y1 + 30 && q.y1 > y0 - 30);
}

function addPathPole() {
  const cur = path;
  const m = -cur.y0 / PX_PER_M, d = diffAt(m), zi = zoneIdxAt(m);
  const len = even(Math.max(84, rand(120, 260) * (1 - 0.35 * d)));
  const dir = cur.face;   // игрок висит на грани face и прыгает в эту же сторону
  let mode = Math.random() < 0.22 ? 'stack' : 'cross';
  let x, y1, face;
  if (mode === 'cross') {
    let lo, hi;
    if (dir > 0) { lo = Math.max(cur.cx + 84, 114); hi = Math.min(cur.cx + 204, W - 30); }
    else { lo = Math.max(cur.cx - 204, 30); hi = Math.min(cur.cx - 84, W - 114); }
    if (hi < lo) mode = 'stack';
    else { x = even(rand(lo, hi)); y1 = even(cur.y0 + (cur.y1 - cur.y0) * rand(0.25, 0.6)); face = -dir; }
  }
  if (mode === 'stack') { x = cur.cx; y1 = even(cur.y0 - rand(30, 64)); face = cur.face; }
  const kind = kindFor(m, d, mode, cur, zi);
  const pl = makePole(x, y1 - len, y1, kind, face, zi);
  if (kind === 'thorn') pl.thorn = -face;
  if (kind === 'rotor') { pl.thorn = -face; pl.timer = rand(2, ROTOR_PERIOD); }
  if (kind === 'move') {
    pl.amp = rand(22, 38); pl.spd = rand(1, 1.7);
    pl.baseX = clamp(x, 24 + pl.amp, W - 24 - pl.amp);
  }
  poles.push(pl);
  path = pl;
  populate(cur, pl, mode, m, d, zi);
  // лишние столбы вразброс — бонусные, с монетками
  if (m > 3 && Math.random() < 0.35) {
    const ex = even(dir > 0 ? rand(24, cur.cx - 84) : rand(cur.cx + 84, W - 24));
    const ey1 = even(pl.y1 + rand(-80, 20)), elen = even(rand(80, 160));
    if (ex > 20 && ex < W - 20 && !overlapsPole(ex, ey1 - elen, ey1, 50)) {
      const kp = makePole(ex, ey1 - elen, ey1, Math.random() < 0.7 ? 'log' : 'crumble', 0, zi);
      poles.push(kp);
      for (let i = 0; i < 3; i++) ents.push({ type: 'coin', x: ex + (ex < W / 2 ? 26 : -26), y: kp.y0 + 20 + i * 22, r: 8, t: i * 0.3 });
    }
  }
  if (kind === 'log' && Math.random() < 0.3) birds.push({ x: pl.cx, y: pl.y0, t: rand(0, 5), st: 'perch', vx: 0, vy: 0, dir: Math.random() < 0.5 ? -1 : 1 });
}

function populate(cur, pl, mode, m, d, zi) {
  // монеты по траектории прыжка
  if (m > 1 && Math.random() < 0.7) {
    if (mode === 'cross') {
      const xa = cur.cx + cur.face * 30, xb = pl.cx - cur.face * 30;
      const yb = clamp(cur.y0 + 30, pl.y0 + 20, pl.y1 - 10);
      for (let i = 0; i < 4; i++) {
        const t = (i + 0.5) / 4;
        ents.push({ type: 'coin', x: lerp(xa, xb, t), y: lerp(cur.y0 + 40, yb, t) - Math.sin(t * Math.PI) * 40, r: 8, t: i * 0.3 });
      }
    } else {
      for (let i = 0; i < 3; i++) ents.push({ type: 'coin', x: cur.cx + cur.face * 44, y: cur.y0 - 10 - i * 24, r: 8, t: i * 0.3 });
    }
  }
  // враги, свои в каждой зоне
  if (m > 14 && Math.random() < 0.28 + 0.45 * d) {
    const z = ZONES[zi], o = {};
    for (const k in z.en) {
      const need = { bee: 14, snail: 25, cone: 50, spiky: 70, hawk: 90, bat: 0, ghost: 0 }[k];
      if (m >= need) o[k] = z.en[k];
    }
    if (Object.keys(o).length) spawnEnemy(pick(o), cur, pl, d);
  }
  if (m > 40 && Math.random() < 0.05) ents.push({ type: 'shield', x: (cur.cx + pl.cx) / 2, y: pl.y0 - 30, r: 11, t: 0 });
  else if (m > 30 && Math.random() < 0.05) ents.push({ type: 'magnet', x: (cur.cx + pl.cx) / 2, y: pl.y0 - 30, r: 11, t: 0 });
}

function spawnEnemy(type, cur, pl, d) {
  const y = even(lerp(cur.y0, pl.y0, rand(0.3, 0.8)));
  if (type === 'bee') ents.push({ type, x: rand(40, W - 40), y, baseY: y, r: 9, vx: (Math.random() < 0.5 ? -1 : 1) * (55 + 85 * d), minX: 24, maxX: W - 24, t: rand(0, 6) });

function generate() {
  while (path.y0 > camY - 700) addPathPole();

// ---------- Фон ----------
const farTiles = {};

  const c = document.createElement('canvas'); c.width = W; c.height = th;
  const g = c.getContext('2d');
  for (let k = 0; k < 5; k++) {
    const left = k % 2 === 0;
    const x = even(left ? hash(k * 31 + zi) * 70 : W - hash(k * 31 + zi) * 70), y = even(hash(k * 17 + 5) * th);
    for (const dy of [-th, 0, th]) {
      for (let s = 0; s < 70; s += 4) prect(g, x + Math.sin((y + s) * 0.08) * 6 - 4, y + dy + 10 + s, 8, 4, z.farD);
      for (let j = 0; j < 6; j++) {
        const r = 12 + hash(k * 7 + j) * 12;
        pell(g, x + (hash(k + j * 3) - 0.5) * 60, y + dy + (hash(k * 3 + j) - 0.5) * 30, r + 2, r * 0.7 + 2, z.farD);
      }
      for (let j = 0; j < 6; j++) {
        const r = 12 + hash(k * 7 + j) * 12;
        pell(g, x + (hash(k + j * 3) - 0.5) * 56, y + dy - 2 + (hash(k * 3 + j) - 0.5) * 28, r, r * 0.7, z.far);
      }
    }
  }

  return c;
}

function zoneBlend() {
  const m = state === 'menu' || state === 'shop' || state === 'ach' ? 0 : heightM();
  const i = zoneIdxAt(m), n = ZONES[i + 1];
  const t = n ? clamp((m - (n.m - 30)) / 30, 0, 1) : 0;
  return { i, t, z: ZONES[i], n: n || ZONES[i] };
}
const zc = (b, key) => b.t > 0 ? mix(b.z[key], b.n[key], b.t) : b.z[key];

// Большая крона-дерево позади столбов, как на картинке
function colAt(wy) {
  return { c: W / 2 + Math.sin(wy * 0.004) * 40 + Math.sin(wy * 0.011) * 18, hw: 92 + Math.sin(wy * 0.007) * 28 + Math.sin(wy * 0.019) * 10 };
}
function drawBushColumn(b, skyCol) {
  const bush = zc(b, 'bush'), bushD = zc(b, 'bushD'), bushL = zc(b, 'bushL');
  const off = even(camR * 0.85);
  const step = 14, first = Math.floor((off - 40) / step), lastK = Math.ceil((off + H + 40) / step);
  for (let k = first; k <= lastK; k++) {
    const wy = k * step, { c, hw } = colAt(wy), sy = wy - off;
    for (const s of [-1, 1]) { const r = 9 + hash2(k, s + 3) * 7; pell(ctx, c + s * (hw + hash2(k, s) * 6) + s * 2, sy + 3, r + 2, r + 2, bushD); }
  }
  ctx.fillStyle = bush; ctx.beginPath();
  for (let sy = -8; sy <= H + 8; sy += 8) { const { c, hw } = colAt(sy + off); ctx.lineTo(even(c - hw), sy); }
  for (let sy = H + 8; sy >= -8; sy -= 8) { const { c, hw } = colAt(sy + off); ctx.lineTo(even(c + hw), sy); }
  ctx.fill();
  for (let k = first; k <= lastK; k++) {
    const wy = k * step, { c, hw } = colAt(wy), sy = wy - off;
    for (const s of [-1, 1]) {
      const r = 9 + hash2(k, s + 3) * 7, ex = c + s * (hw + hash2(k, s) * 6);
      pell(ctx, ex, sy, r, r, bush);
      if (hash2(k, s + 21) < 0.45) pell(ctx, ex + s * 2, sy - 4, r * 0.5, r * 0.35, bushL);
    }
    if (hash2(k, 11) < 0.25) pell(ctx, c + (hash2(k, 12) - 0.5) * hw * 1.3, sy, 8, 6, bushL);
    if (hash2(k, 13) < 0.07) { const hx = c + (hash2(k, 14) - 0.5) * hw; pell(ctx, hx, sy, 11, 9, bushD); pell(ctx, hx, sy, 8, 6, skyCol); }
  }
}

function drawBackground() {
  const b = zoneBlend();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const top = b.t > 0 ? mix(b.z.sky[0], b.n.sky[0], b.t) : b.z.sky[0];
  const bot = b.t > 0 ? mix(b.z.sky[1], b.n.sky[1], b.t) : b.z.sky[1];
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (b.z.stars || b.n.stars) {
    ctx.globalAlpha = b.z.stars && b.n.stars ? 1 : b.z.stars ? 1 - b.t : b.t;
    for (let k = 0; k < 40; k++) {
      const x = hash(k * 13) * W, y = ((hash(k * 7) * H * 2 - camY * 0.05) % H + H) % H;
      const tw = Math.sin(time * 3 + k) > 0.6 ? 4 : 2;
      prect(ctx, x, y, tw, tw, '#ffffff');
    }
    ctx.globalAlpha = 1;
  }
  const cloud = zc(b, 'cloud'), cloudS = zc(b, 'cloudS');
  for (let k = 0; k < 5; k++) {

    pell(ctx, x + 2, y + 6, 46, 12, cloudS);
    pell(ctx, x, y, 44, 11, cloud); pell(ctx, x - 18, y - 7, 20, 13, cloud); pell(ctx, x + 14, y - 10, 22, 15, cloud);
  }
  const th = 640, off = ((-camR * 0.3) % th + th) % th;
  const drawTile = (zi, a) => {
    ctx.globalAlpha = a;
    const tile = farTile(zi);
    for (let y = even(off) - th; y < H; y += th) ctx.drawImage(tile, 0, y);

  drawTile(b.i, 1);

}

function burst(x, y, n, color, spd = 150, life = 0.5, size = 4, grav = 600) {

function dust(x, y, dir) {

// ---------- Достижения ----------
function unlock(id) {

  achieved.push(id); store.set('ach', achieved);

}

// ---------- Управление ----------
function press() {
  audio(); startMusic();
  held = true;
  if (state === 'menu') { state = 'play'; doJump(); return; }

  if (state !== 'play' || paused) return;
  doJump();
}
function release() { held = false; }

function doJump() {
  if (p.state === 'wall' || p.state === 'ground') {
    const dir = p.state === 'wall' ? -p.side : p.face;
    if (p.state === 'wall' && p.pole && p.pole.kind === 'crumble' && p.pole.crT > 0) unlock('crumble');
    p.vx = dir * JVX * (p.state === 'ground' ? 0.8 : 1);
    p.vy = JVY; p.state = 'air'; p.dj = true; p.face = dir; p.holdT = HOLD_MAX;
    p.squash = 1; p.pole = null; p.stand = null;
    dust(p.x - dir * PW / 2, p.y, dir);

  } else if (p.state === 'air' && p.dj) {
    p.dj = false;
    p.vy = DJVY;
    p.vx = p.vx === 0 ? p.face * JVX : -Math.sign(p.vx) * JVX;  // сальто разворачивает героя
    p.face = Math.sign(p.vx);
    p.spin = 1; p.holdT = HOLD_MAX * 0.6;
    flips++;
    unlock('flip');
    if (flips >= 10) unlock('flips10');
    burst(p.x, p.y + 10, 10, '#ffffff', 110, 0.35, 4, 0);
    sfx.flip();
    if (tutStep === 1) { tutStep = 2; tutDone = true; store.set('tut', true); }
  }
}

function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();

});
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('blur', release);

// ---------- Кнопки и экраны ----------
const BTN = {
  mute:  { x: W - 46, y: 12, w: 34, h: 34 },
  pause: { x: W - 46, y: 12, w: 34, h: 34 },
  shop:  { x: W / 2 - 75, y: 290, w: 150, h: 40 },
  ach:   { x: W / 2 - 75, y: 346, w: 150, h: 40 },

const inRect = (pt, r) => pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
function uiClick(pt) {
  if (state === 'shop') { shopClick(pt); return true; }
  if (state === 'ach') { state = 'menu'; sfx.click(); return true; }
  if (state !== 'play' && state !== 'dead' && inRect(pt, BTN.mute)) { audio(); toggleMute(); sfx.click(); return true; }
  if (state === 'play' && inRect(pt, BTN.pause)) { paused = !paused; return true; }
  if (state === 'play' && paused) { paused = false; return true; }
  if (state === 'menu' && inRect(pt, BTN.shop)) { audio(); startMusic(); state = 'shop'; sfx.click(); return true; }
  if (state === 'menu' && inRect(pt, BTN.ach)) { audio(); startMusic(); state = 'ach'; sfx.click(); return true; }
  return false;
}
const shopRect = i => ({ x: 16 + (i % 3) * 112, y: 132 + Math.floor(i / 3) * 96, w: 104, h: 88 });
function shopClick(pt) {
  for (let i = 0; i < SKINS.length; i++) {
    if (!inRect(pt, shopRect(i))) continue;
    if (owned.includes(i)) { skinIdx = i; store.set('skin', i); sfx.click(); }
    else if (bank >= SKINS[i].cost) {
      bank -= SKINS[i].cost; owned.push(i); skinIdx = i;
      store.set('coins', bank); store.set('owned', owned); store.set('skin', i); sfx.coin();
    } else tone(200, 120, 0.15, 'square', 0.06);

  }
  state = 'menu'; sfx.click();
}

// ---------- Физика ----------
function solidsNear(y0, y1) {
  const out = [GROUND];
  for (const q of poles) if (q.y1 > y0 && q.y0 < y1) out.push(q);
  return out;
}
const ovl = s => p.x + PW / 2 > s.x0 + 0.001 && p.x - PW / 2 < s.x1 - 0.001 && p.y + PH / 2 > s.y0 + 0.001 && p.y - PH / 2 < s.y1 - 0.001;
function moveX(S, dx) {
  if (!dx) return null;
  p.x += dx; let hit = null;
  for (const s of S) if (ovl(s)) {
    if (dx > 0) { p.x = s.x0 - PW / 2; hit = { s, dir: 1 }; } else { p.x = s.x1 + PW / 2; hit = { s, dir: -1 }; }
  }
  if (!hit && (p.x < PW / 2 || p.x > W - PW / 2)) { p.x = clamp(p.x, PW / 2, W - PW / 2); hit = { edge: true }; }
  return hit;
}
function moveY(S, dy) {
  if (!dy) return null;
  p.y += dy; let hit = null;
  for (const s of S) if (ovl(s)) {
    if (dy > 0) { p.y = s.y0 - PH / 2; hit = { s, dir: 1 }; } else { p.y = s.y1 + PH / 2; hit = { s, dir: -1 }; }
  }
  return hit;
}
function faceAt(S, side) {
  for (const s of S) {
    const touch = side < 0 ? Math.abs(s.x1 - (p.x - PW / 2)) < 1 : Math.abs(s.x0 - (p.x + PW / 2)) < 1;
    if (touch && s.y0 < p.y && s.y1 > p.y) return s;
  }
  return null;
}
function onGround(S) {
  for (const s of S) if (Math.abs(s.y0 - (p.y + PH / 2)) < 1 && s.x0 < p.x + PW / 2 - 1 && s.x1 > p.x - PW / 2 + 1) return s;
  return null;
}
// шипы смотрят на сторону pole.thorn (-1 влево, +1 вправо); игрок с p.side касается грани -p.side
const thornHits = (pl, side) => pl && pl.thorn && pl.thorn === -side;

function grab(s, side) {
  if (thornHits(s, side)) { die('thorn'); return; }
  p.state = 'wall'; p.side = side; p.face = -side; p.vx = 0; p.vy = 0; p.pole = s;
  p.stick = s.kind === 'ice' ? 0.05 : STICK; p.dj = true; p.spin = 0; p.rot = 0; p.squash = -0.8; p.holdT = 0;
  kicks++; p.kicksAir++;
  if (p.kicksAir >= 5) unlock('jump5');
  if (s.kind === 'crumble' && s.crT < 0) { s.crT = 0.75; sfx.crack(); }
  dust(p.x + side * PW / 2, p.y, -side);
  sfx.grab();
}
function land(s) {
  p.state = 'ground'; p.stand = s; p.pole = null;
  if (p.vx) p.face = Math.sign(p.vx);
  p.vx = 0; p.vy = 0; p.dj = true; p.spin = 0; p.rot = 0; p.squash = 1; p.holdT = 0;
  if (s === GROUND) p.kicksAir = 0;
  if (s.kind === 'crumble' && s.crT < 0) { s.crT = 0.75; sfx.crack(); }
  for (let i = 0; i < 6; i++) parts.push({ x: p.x + rand(-10, 10), y: p.y + PH / 2, vx: rand(-80, 80), vy: rand(-60, -10), life: 0.3, max: 0.3, color: '#ffffff', size: 4, grav: 300 });
  sfx.land();
}

function die(reason) {
  if (state !== 'play') return;
  if (p.shield > 0 && reason !== 'fall') {
    p.shield = 0; p.inv = 1.0;
    unlock('shield');
    burst(p.x, p.y, 20, '#6fd3ff', 220, 0.6, 4, 0);
    shake = 0.3; sfx.bonk();
    if (p.state === 'wall') p.vx = -p.side * JVX * 0.6;
    p.state = 'air'; p.vy = -520; p.dj = true; p.pole = null;
    if (!p.vx) p.vx = p.face * JVX * 0.6;
    return;
  }
  state = 'dead'; deadT = 0;
  p.state = 'dead';
  p.vx = (p.x < W / 2 ? 1 : -1) * 100; p.vy = -560;
  shake = 0.45;
  burst(p.x, p.y, 22, '#ffffff', 260, 0.7, 4);
  burst(p.x, p.y, 14, SKINS[skinIdx].body, 200, 0.8, 6);
  sfx.die();
  const m = heightM();
  p.newBest = m > best;
  if (m > best) { best = m; store.set('best', best); }
  bank += coinsRun; store.set('coins', bank);
}

function onScreen(pl) { return pl.y1 > camY && pl.y0 < camY + H; }
function updatePoles(dt) {
  for (let i = poles.length - 1; i >= 0; i--) {
    const pl = poles[i];
    pl.t += dt;
    if (pl.kind === 'move') {
      const nx = pl.baseX + Math.sin(pl.t * pl.spd) * pl.amp, dx = nx - pl.cx;
      pl.cx = nx; pl.x0 = nx - 7; pl.x1 = nx + 7;
      if ((p.state === 'wall' && p.pole === pl) || (p.state === 'ground' && p.stand === pl)) p.x += dx;
    }
    if (pl.kind === 'rotor') {
      if (pl.flipA < 0) {
        const before = Math.ceil(pl.timer);
        pl.timer -= dt;
        if (Math.ceil(pl.timer) !== before && pl.timer > 0 && pl.timer < 3 && onScreen(pl) && state === 'play') sfx.tick();
        if (pl.timer <= 0) { pl.flipA = 0; pl.flipped = false; if (onScreen(pl) && state === 'play') sfx.rotor(); }
      } else {
        pl.flipA += dt / 0.4;
        if (pl.flipA >= 0.5 && !pl.flipped) {
          pl.flipped = true;
          pl.thorn = -pl.thorn;
          // игрок на столбе — его переносит на другую сторону вместе с поворотом
          if (p.state === 'wall' && p.pole === pl && thornHits(pl, p.side)) {
            p.x = 2 * pl.cx - p.x; p.side = -p.side; p.face = -p.face;
            dust(p.x + p.side * PW / 2, p.y, -p.side);
            unlock('rotor');
          }
        }
        if (pl.flipA >= 1) { pl.flipA = -1; pl.timer = ROTOR_PERIOD; }
      }
    }
    if (pl.kind === 'crumble' && pl.crT >= 0) {
      pl.crT -= dt;
      if (pl.crT <= 0) {
        for (let y = pl.y0; y < pl.y1; y += 12) burst(pl.cx, y, 2, '#d0a070', 120, 0.9, 6, 900);
        sfx.crack();
        poles.splice(i, 1);
        if (p.pole === pl) { p.pole = null; if (p.state === 'wall') { p.state = 'air'; p.vx = 0; p.vy = 0; } }
        if (p.stand === pl) { p.stand = null; if (p.state === 'ground') { p.state = 'air'; p.vy = 0; } }
        for (const b of birds) if (b.st === 'perch' && Math.abs(b.x - pl.cx) < 10 && Math.abs(b.y - pl.y0) < 4) { b.st = 'fly'; b.vx = 120; b.vy = -100; }
      }
    }
  }
}

function updatePlayer(dt) {
  if (p.inv > 0) p.inv -= dt;
  if (p.magnet > 0) p.magnet -= dt;
  p.squash *= Math.pow(0.0005, dt);
  const S = solidsNear(p.y - 200, p.y + 200);
  if (p.state === 'wall') {
    const ice = p.pole && p.pole.kind === 'ice';
    if (p.stick > 0) { p.stick -= dt; p.vy = 0; }
    else p.vy += ((ice ? ICE_SLIDE : SLIDE) - p.vy) * Math.min(1, dt * (ice ? 2 : 5));
    const hy = moveY(S, p.vy * dt);
    if (hy && hy.dir > 0) p.vy = 0;
    if (thornHits(p.pole, p.side)) { die('thorn'); return; }
    const f = faceAt(S, p.side);
    if (!f || f === GROUND) { p.state = 'air'; p.vx = 0; p.vy = Math.max(0, p.vy); p.pole = null; }
    else {
      p.pole = f;
      if (p.vy > 10 && Math.random() < dt * (ice ? 30 : 10))
        parts.push({ x: p.x + p.side * PW / 2, y: p.y + PH / 2 - 4, vx: -p.side * rand(5, 30), vy: rand(-20, 0), life: 0.3, max: 0.3, color: ice ? '#dff4ff' : '#ffffff', size: 2, grav: 0 });
    }
  } else if (p.state === 'ground') {
    if (!onGround(S)) { p.state = 'air'; p.vx = 0; p.vy = 0; p.stand = null; }
  }

    if (p.holdT > 0) {

      else p.holdT = 0;
    }
    p.vy = Math.min(MAX_FALL, p.vy + g * dt);
    if (p.spin > 0) {
      p.spin -= dt * 2.2;
      p.rot = (1 - Math.max(0, p.spin)) * Math.PI * 2 * p.face;
      if (p.spin <= 0) { p.spin = 0; p.rot = 0; }
    }
    const hx = moveX(S, p.vx * dt);

      if (hx.edge) { p.vx = 0; p.face = p.x < W / 2 ? 1 : -1; }
      else if (hx.s === GROUND) p.vx = 0;
      else grab(hx.s, hx.dir);
    }
    if (p.state === 'air') {
      const hy = moveY(S, p.vy * dt);
      if (hy) {
        if (hy.dir > 0) land(hy.s);
        else { p.vy = 30; p.holdT = 0; sfx.bonk(); }
      }
      if (p.state === 'air' && p.vx === 0) {
        let f = faceAt(S, -1);
        if (f && f !== GROUND) grab(f, -1);
        else { f = faceAt(S, 1); if (f && f !== GROUND) grab(f, 1); }
      }
    }
  }
  if (state !== 'play') return;
  p.trail.unshift({ x: p.x, y: p.y, rot: p.rot }); if (p.trail.length > 10) p.trail.length = 10;
  if (p.y < minY) minY = p.y;
  if (p.y - PH / 2 > camY + H) die('fall');
}

function updateEnts(dt) {
  const hb = { x0: p.x - PW / 2 + 3, x1: p.x + PW / 2 - 3, y0: p.y - PH / 2 + 4, y1: p.y + PH / 2 - 2 };
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];
    e.t += dt;
    if (e.type === 'bee') {
      e.x += e.vx * dt;
      if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
      if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); }
      e.y = e.baseY + Math.sin(e.t * 4) * 10;
    } else if (e.type === 'spiky') {
      e.x = e.cx + Math.sin(e.t * e.spd) * e.amp;
    } else if (e.type === 'bat') {
      e.x = e.cx + Math.sin(e.t * 1.7) * e.amp; e.y = e.baseY + Math.sin(e.t * 3.4) * 28;
    } else if (e.type === 'snail') {
      if (!poles.includes(e.pole)) { ents.splice(i, 1); continue; }
      e.y += e.vy * dt;
      if (e.y < e.pole.y0 + 10) { e.y = e.pole.y0 + 10; e.vy = Math.abs(e.vy); }
      if (e.y > e.pole.y1 - 10) { e.y = e.pole.y1 - 10; e.vy = -Math.abs(e.vy); }
      e.x = e.side < 0 ? e.pole.x0 - 7 : e.pole.x1 + 7;
    } else if (e.type === 'cone') {
      if (e.st === 'idle' && state === 'play' && p.y < e.triggerY + H * 0.4) { e.st = 'warn'; e.warn = 0.9; sfx.warn(); }
      else if (e.st === 'warn') { e.warn -= dt; if (e.warn <= 0) { e.st = 'fall'; e.y = camY - 30; e.vy = 240; } }
      else if (e.st === 'fall') { e.vy += 700 * dt; e.y += e.vy * dt; }
    } else if (e.type === 'hawk') {
      if (e.st === 'idle' && state === 'play' && p.y < e.triggerY + 80) { e.st = 'warn'; e.warn = 1.0; sfx.warn(); }
      else if (e.st === 'warn') { e.y = p.y; e.warn -= dt; if (e.warn <= 0) { e.st = 'fly'; e.x = e.from < 0 ? -30 : W + 30; e.vx = -e.from * 290; } }
      else if (e.st === 'fly') { e.x += e.vx * dt; if (e.x < -60 || e.x > W + 60) { ents.splice(i, 1); continue; } }
    } else if (e.type === 'ghost') {
      if (e.st === 'idle' && state === 'play' && p.y < e.triggerY + H * 0.5) { e.st = 'chase'; e.y = camY - 20; }
      else if (e.st === 'chase') {
        const dx = p.x - e.x, dy = p.y - e.y, dd = Math.hypot(dx, dy) || 1;
        e.x += (dx / dd * 48 + Math.sin(e.t * 3) * 20) * dt; e.y += (dy / dd * 48) * dt;
        e.life -= dt;
        if (e.life <= 0) { burst(e.x, e.y, 8, '#ffffff', 80, 0.5, 4, 0); ents.splice(i, 1); continue; }
      }
    } else if (e.type === 'coin' && p.magnet > 0) {
      const dx = p.x - e.x, dy = p.y - e.y, dd = Math.hypot(dx, dy) || 1;
      if (dd < 150) { e.x += dx / dd * 420 * dt; e.y += dy / dd * 420 * dt; }
    }
    if (e.y > camY + H + 300 && e.st !== 'warn') { ents.splice(i, 1); continue; }
    if (state !== 'play') continue;
    if ((e.type === 'cone' && e.st !== 'fall') || (e.type === 'hawk' && e.st !== 'fly') || (e.type === 'ghost' && (e.st !== 'chase' || e.life < 0.6))) continue;
    const cx = clamp(e.x, hb.x0, hb.x1), cy = clamp(e.y, hb.y0, hb.y1);
    if ((e.x - cx) ** 2 + (e.y - cy) ** 2 >= e.r * e.r) continue;
    if (e.type === 'coin') {
      combo++; comboT = 1.2; coinsRun++;
      if (coinsRun >= 30) unlock('coins30');
      burst(e.x, e.y, 6, '#ffe24a', 120, 0.4, 4, 0);
      sfx.coin(); ents.splice(i, 1);
    } else if (e.type === 'shield' || e.type === 'magnet') {
      if (e.type === 'shield') p.shield = 1; else p.magnet = 8;
      burst(e.x, e.y, 12, e.type === 'shield' ? '#6fd3ff' : '#ff5a5a', 140, 0.5, 4, 0);
      sfx.power(); ents.splice(i, 1);
    } else if (!(p.inv > 0)) {
      if (e.type === 'bee' || e.type === 'bat' || e.type === 'ghost') { burst(e.x, e.y, 10, '#ffffff', 150, 0.5, 4); ents.splice(i, 1); }
      die(e.type);
    }
  }
}

function updateBirds(dt) {
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.t += dt;
    if (b.st === 'perch') {
      if (Math.random() < dt * 0.5) b.dir = -b.dir;
      if (p && (state === 'play' || state === 'dead') && Math.abs(p.x - b.x) < 80 && Math.abs(p.y - b.y) < 90) {
        b.st = 'fly'; b.vx = (b.x < p.x ? -1 : 1) * rand(90, 150); b.vy = -rand(60, 120); b.dir = Math.sign(b.vx);
        sfx.bird();
      }
      if (b.y > camY + H + 200) birds.splice(i, 1);
    } else {
      b.vy -= 260 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < camY - 60 || b.x < -30 || b.x > W + 30) birds.splice(i, 1);
    }
  }
}

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }
  const zi = zoneIdxAt(state === 'menu' || state === 'shop' || state === 'ach' ? 0 : heightM());
  if (Math.random() < dt * 3) {
    const cols = ZONES[zi].leaf;
    leaves.push({ x: rand(0, W), y: camY - 10, vx: rand(-15, 15), vy: rand(30, 60), t: rand(0, 6), col: cols[Math.floor(Math.random() * cols.length)] });
  }
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.t += dt; l.x += (l.vx + Math.sin(l.t * 2) * 25) * dt; l.y += l.vy * dt;
    if (l.y > camY + H + 20) leaves.splice(i, 1);
  }
  if (toasts.length) { toasts[0].t += dt; if (toasts[0].t > 2.8) toasts.shift(); }
}

function update(dt) {
  time += dt;
  blinkT -= dt; if (blinkT < -0.12) blinkT = rand(2, 4);
  if (paused && state === 'play') return;
  updateParts(dt);
  updateBirds(dt);
  updatePoles(dt);
  if (state === 'menu' || state === 'shop' || state === 'ach') return;
  if (state === 'play') updatePlayer(dt);
  else {
    deadT += dt;
    p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 10;
    if (deadT > 0.9 && state === 'dead') state = 'over';
  }
  if (state === 'play') {
    const target = p.y - H * 0.58;
    if (target < camY) camY += (target - camY) * Math.min(1, dt * 6);
  }
  camR = even(camY);
  const m = heightM();
  const zi = zoneIdxAt(m);
  if (zi !== zoneIdx) {
    zoneIdx = zi; banner = { text: ZONES[zi].name, t: 2.6 }; sfx.zone();
    zonesSeen++; if (zonesSeen >= 5) unlock('zone5');
  }
  if (m >= 100) unlock('m100');
  if (m >= 250) unlock('m250');
  if (m >= 500) unlock('m500');
  if (m >= 1000) unlock('m1000');
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  updateEnts(dt);
  generate();
  if (shake > 0) shake -= dt;
}

// ---------- Отрисовка мира ----------
function poleColors(pl) {
  const z = ZONES[pl.zone];
  if (pl.kind === 'ice') return ['#bfe8ff', '#5aa0d8', '#ffffff'];
  if (pl.kind === 'crumble') return ['#d0a070', '#7a4a24', '#f0c890'];
  return [z.log, z.logD, z.logL];
}
function drawThorns(face, y0, y1, dir) {
  prect(ctx, face - 2, y0, 4, y1 - y0, '#7a1a4a');
  const lens = [2, 6, 10, 6, 2];
  for (let y = y0 + 4; y + 10 <= y1 - 4; y += 10) {
    for (let i = 0; i < 5; i++) prect(ctx, dir > 0 ? face : face - lens[i], y + i * 2, lens[i], 2, i === 2 ? '#ff4a7a' : '#b02a6a');
    prect(ctx, dir > 0 ? face + 8 : face - 10, y + 4, 2, 2, '#ffffff');
  }
}
function drawPole(pl) {
  const [base, dk, lt] = poleColors(pl);
  const h = pl.y1 - pl.y0, cx = pl.cx;
  ctx.save();
  if (pl.flipA >= 0) { const sc = Math.max(0.12, Math.abs(Math.cos(pl.flipA * Math.PI))); ctx.translate(cx, 0); ctx.scale(sc, 1); ctx.translate(-cx, 0); }
  if (pl.crT > 0) ctx.translate(even(Math.sin(time * 70) * 2), 0);
  if (pl.kind === 'move') { ctx.fillStyle = 'rgba(255,255,255,0.35)'; for (let x = pl.baseX - pl.amp; x < pl.baseX + pl.amp; x += 8) ctx.fillRect(x, pl.y0 + h / 2, 4, 2); }
  const x0 = pl.x0;
  prect(ctx, x0 - 2, pl.y0, 18, h, OL);
  prect(ctx, x0, pl.y0, 14, h, base);
  prect(ctx, x0 + 10, pl.y0, 4, h, dk);
  prect(ctx, x0 + 2, pl.y0, 2, h, lt);
  for (let y = pl.y0 + 8; y < pl.y1 - 8; y += 14) {
    const hv = hash2(y + pl.seed, 3);
    if (hv < 0.55) prect(ctx, x0 + 4 + (hv > 0.3 ? 2 : 0), y, 2, 6, dk);
    if (hv > 0.9 && pl.kind !== 'ice' && !pl.thorn) { // сучок
      const s = hash2(y, pl.seed) > 0.5 ? 1 : -1, tx = s > 0 ? pl.x1 : x0 - 6;
      prect(ctx, tx, y, 6, 2, dk); prect(ctx, tx + (s > 0 ? 4 : 0), y - 2, 2, 2, dk);
    }
  }
  if (pl.kind === 'crumble') for (let y = pl.y0 + 14; y < pl.y1 - 10; y += 26) {
    prect(ctx, x0 + 2, y, 4, 2, OL); prect(ctx, x0 + 6, y + 2, 4, 2, OL); prect(ctx, x0 + 10, y, 4, 2, OL);
  }
  if (pl.kind === 'ice') {
    for (let y = pl.y0 + 10; y < pl.y1 - 10; y += 30) prect(ctx, x0 + 4, y, 2, 12, '#ffffff');
    for (let k = 0; k < 3; k++) prect(ctx, x0 + 1 + k * 5, pl.y1, 4, 4 + k % 2 * 4, '#dff4ff');
  }
  if (pl.kind === 'rotor') for (let y = pl.y0 + 20; y < pl.y1 - 10; y += 40) { prect(ctx, x0 - 2, y, 18, 4, '#5a6078'); prect(ctx, x0, y, 14, 2, '#c8d0e0'); }
  pell(ctx, cx, pl.y0, 9, 4, OL); pell(ctx, cx, pl.y0, 7, 3, lt); pell(ctx, cx, pl.y0, 3, 1.5, base);
  pell(ctx, cx, pl.y1, 9, 4, OL); pell(ctx, cx, pl.y1, 7, 2.5, dk);
  if (pl.thorn) drawThorns(pl.thorn < 0 ? pl.x0 - 2 : pl.x1 + 2, pl.y0 + 4, pl.y1 - 4, pl.thorn);
  ctx.restore();
  if (pl.kind === 'rotor') {
    const tY = pl.y0 - 18, warn = pl.flipA < 0 && pl.timer < 1;
    pell(ctx, cx, tY, 12, 12, OL);
    pell(ctx, cx, tY, 10, 10, warn && Math.sin(time * 30) > 0 ? '#ff3d3d' : '#ffffff');
    const n = pl.flipA >= 0 ? 0 : Math.ceil(pl.timer);
    const c = textCanvas(String(n), 2, warn ? '#ffffff' : OL, null);
    ctx.drawImage(c, even(cx - c.width / 2), even(tY - 7));
  }
}

function drawGround() {
  if (-camR > H + 20) return;
  const z = ZONES[0];
  prect(ctx, 0, 12, W, H, '#b8552e');
  for (let gy = 0; gy < 8; gy++) for (let gx = -1; gx < 11; gx++) {
    const x = gx * 36 + (gy & 1) * 18 + hash2(gx, gy) * 6, y = 24 + gy * 22;
    pell(ctx, x + 2, y + 3, 15, 9, '#8a3a1e');
    pell(ctx, x, y, 14, 8, '#d66a3a');
    pell(ctx, x - 4, y - 3, 6, 3, '#f08a54');
  }
  prect(ctx, 0, -2, W, 16, OL);
  prect(ctx, 0, 0, W, 14, z.grass);
  prect(ctx, 0, 0, W, 2, z.grassL);
  for (let x = 0; x < W; x += 4) {
    const hv = hash2(x, 99);
    prect(ctx, x, -2 - (hv > 0.5 ? 2 : 0), 2, 4, hv > 0.7 ? z.grassL : z.grass);
    prect(ctx, x, 14, 2, 2 + Math.floor(hv * 4) * 2, z.grassD);
  }
}

function drawHeightMarks() {
  const step = 10 * PX_PER_M;
  const first = Math.floor((-(camY + H)) / step);
  for (let k = Math.max(1, first); k < first + 5; k++) {
    const y = even(-PH / 2 - k * step);
    if (y < camY + 90 || y > camY + H + 10) continue;
    ctx.fillStyle = 'rgba(42,20,8,0.45)';
    for (let x = 0; x < W; x += 12) ctx.fillRect(x, y, 8, 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let x = 0; x < W; x += 12) ctx.fillRect(x, y - 2, 8, 2);
    text(String(k * 10), 8, y - 6, 2, '#ffe24a', 'left');
  }
  if (best > 0) {
    const y = even(-PH / 2 - best * PX_PER_M);
    if (y > camY - 10 && y < camY + H + 10) {
      ctx.fillStyle = '#ff3d7f';
      for (let x = 0; x < W; x += 10) ctx.fillRect(x, y, 6, 4);
      text('РЕКОРД', W - 8, y - 6, 2, '#ff3d7f', 'right');
    }
  }
}

function drawEnts() {
  for (const e of ents) {
    if ((e.type === 'cone' && e.st !== 'fall') || (e.type === 'hawk' && e.st !== 'fly') || (e.type === 'ghost' && e.st !== 'chase')) continue;
    if (e.y < camY - 40 || e.y > camY + H + 40) continue;
    const x = e.x, y = e.y;
    if (e.type === 'coin') {
      const sx = Math.abs(Math.cos(e.t * 4));
      pell(ctx, x, y, 8 * sx + 2, 8, '#a8620a');
      pell(ctx, x, y, 6 * sx + 1, 6, '#ffd23a');
      if (sx > 0.4) prect(ctx, x - 2 * sx, y - 4, 2, 6, '#fff6a0');
    } else if (e.type === 'bee') {
      const d = Math.sign(e.vx) || 1, flap = Math.sin(e.t * 40) > 0 ? 2 : -2;
      pell(ctx, x - d * 2, y - 10 + flap, 5, 4, 'rgba(255,255,255,0.9)');
      pell(ctx, x, y, 11, 9, '#3a2010');
      pell(ctx, x, y, 9, 7, '#ffd23a');
      prect(ctx, x - 4, y - 6, 2, 12, '#3a2010'); prect(ctx, x + 1, y - 6, 2, 12, '#3a2010');
      prect(ctx, x + d * 5, y - 4, 2, 2, '#ffffff'); prect(ctx, x + d * 6 + (d > 0 ? 0 : -2), y - 3, 2, 2, '#1a1010');
      prect(ctx, x - d * 11, y, 4, 2, '#3a2010');
      pell(ctx, x + d, y - 11 - flap, 4, 3, 'rgba(220,245,255,0.95)');
    } else if (e.type === 'spiky') {
      const pulse = Math.sin(e.t * 10) > 0 ? 2 : 0;
      for (let k = 0; k < 8; k++) {
        const a = k / 8 * Math.PI * 2 + e.t * 2;
        prect(ctx, x + Math.cos(a) * (12 + pulse) - 2, y + Math.sin(a) * (12 + pulse) - 2, 4, 4, '#ffffff');
      }
      pell(ctx, x, y, 13, 13, '#3a1050');
      pell(ctx, x, y, 11, 11, '#b04ae8');
      pell(ctx, x - 3, y - 4, 4, 3, '#e0a0ff');
      prect(ctx, x - 6, y - 2, 4, 4, '#ffffff'); prect(ctx, x + 2, y - 2, 4, 4, '#ffffff');
      prect(ctx, x - 4, y, 2, 2, '#1a1010'); prect(ctx, x + 2, y, 2, 2, '#1a1010');
      prect(ctx, x - 6, y - 4, 4, 2, '#3a1050'); prect(ctx, x + 2, y - 4, 4, 2, '#3a1050');
    } else if (e.type === 'cone') {
      pell(ctx, x, y, 9, 12, '#4a2410');
      pell(ctx, x, y, 7, 10, '#a8602a');
      for (let k = -1; k <= 1; k++) prect(ctx, x - 6, y + k * 6, 12, 2, '#6a3418');
      prect(ctx, x - 2, y - 14, 4, 4, '#3a8a2a');
    } else if (e.type === 'bat') {
      const f = Math.sin(e.t * 22) > 0 ? -6 : 2;
      for (const s of [-1, 1]) { prect(ctx, x + s * 6 - (s < 0 ? 10 : 0), y - 2 + f, 10, 4, '#2a1040'); prect(ctx, x + s * 14 - (s < 0 ? 4 : 0), y + f + (f < 0 ? 2 : -2), 4, 4, '#2a1040'); }
      pell(ctx, x, y, 8, 7, '#2a1040'); pell(ctx, x, y, 6, 5, '#7a4ab8');
      prect(ctx, x - 6, y - 8, 2, 4, '#2a1040'); prect(ctx, x + 4, y - 8, 2, 4, '#2a1040');
      prect(ctx, x - 4, y - 2, 2, 2, '#ffe24a'); prect(ctx, x + 2, y - 2, 2, 2, '#ffe24a');
    } else if (e.type === 'snail') {
      const d = Math.sign(e.vy) || 1, s = e.side;
      pell(ctx, x, y, 7, 11, '#1a3a10'); pell(ctx, x, y, 5, 9, '#b8e04a');
      prect(ctx, x + s * 2 - 1, y + d * 9, 2, 6, '#1a3a10'); prect(ctx, x - s * 2 - 1, y + d * 9, 2, 6, '#1a3a10');
      pell(ctx, x + s * 4, y - d * 2, 9, 9, OL); pell(ctx, x + s * 4, y - d * 2, 7, 7, '#ff6ab0');
      pell(ctx, x + s * 4, y - d * 2, 4, 4, '#ffb0d8'); prect(ctx, x + s * 4, y - d * 2, 2, 2, '#c02f80');
    } else if (e.type === 'hawk') {
      const d = Math.sign(e.vx) || 1, f = Math.sin(e.t * 24) > 0 ? -8 : 4;
      prect(ctx, x - 12, y - 2 + f, 18, 4, '#5a2a10'); prect(ctx, x - 8, y - 2 + f * 0.5, 10, 4, '#8a4a20');
      pell(ctx, x, y, 13, 8, OL); pell(ctx, x, y, 11, 6, '#c86a2a'); pell(ctx, x - d, y + 2, 6, 3, '#ffe0b0');
      pell(ctx, x + d * 10, y - 3, 6, 6, OL); pell(ctx, x + d * 10, y - 3, 5, 5, '#c86a2a');
      prect(ctx, x + d * 11 - (d < 0 ? 2 : 0), y - 6, 2, 2, '#1a1010');
      prect(ctx, x + d * 15 - (d < 0 ? 4 : 0), y - 3, 4, 4, '#ffd23a');
      prect(ctx, x - d * 14 - (d > 0 ? 6 : 0), y - 2, 6, 4, '#5a2a10');
    } else if (e.type === 'ghost') {
      ctx.globalAlpha = e.life < 1 ? Math.max(0, e.life) : 0.6 + Math.sin(e.t * 6) * 0.25;
      pell(ctx, x, y, 12, 12, '#4a4a7a'); pell(ctx, x, y, 10, 10, '#ffffff');
      prect(ctx, x - 10, y, 20, 10, '#ffffff');
      for (let k = 0; k < 3; k++) prect(ctx, x - 10 + k * 8, y + 10 + (Math.sin(e.t * 8 + k) > 0 ? 2 : 0), 4, 2, '#ffffff');
      prect(ctx, x - 6, y - 4, 4, 4, '#1a1a3a'); prect(ctx, x + 2, y - 4, 4, 4, '#1a1a3a'); prect(ctx, x - 2, y + 2, 4, 4, '#1a1a3a');
      ctx.globalAlpha = 1;
    } else if (e.type === 'shield' || e.type === 'magnet') {
      const b = Math.sin(e.t * 4) * 3;
      pell(ctx, x, y + b, 13, 13, e.type === 'shield' ? '#2a8ad0' : '#a01a1a');
      pell(ctx, x, y + b, 11, 11, e.type === 'shield' ? '#8ae0ff' : '#ff8a8a');
      if (e.type === 'shield') { pell(ctx, x, y + b, 6, 7, '#ffffff'); prect(ctx, x - 6, y + b - 8, 4, 4, '#ffffff'); }
      else {
        prect(ctx, x - 6, y + b - 6, 4, 10, '#ff3a3a'); prect(ctx, x + 2, y + b - 6, 4, 10, '#ff3a3a'); prect(ctx, x - 6, y + b + 2, 12, 4, '#ff3a3a');
        prect(ctx, x - 6, y + b - 6, 4, 4, '#ffffff'); prect(ctx, x + 2, y + b - 6, 4, 4, '#ffffff');
      }
    }
  }
}

function drawBird(b) {
  const x = b.x, y = b.y, d = b.dir;
  const hop = b.st === 'perch' && Math.sin(b.t * 6) > 0.85 ? 2 : 0;
  const by = y - 8 - hop;
  pell(ctx, x, by, 7, 6, '#1a3a7a');
  pell(ctx, x, by, 5, 4, '#3ab0ff');
  pell(ctx, x + d, by + 1, 3, 2, '#c8ecff');
  pell(ctx, x + d * 4, by - 4, 4, 4, '#1a3a7a');
  pell(ctx, x + d * 4, by - 4, 3, 3, '#3ab0ff');
  prect(ctx, x + d * 5 - (d < 0 ? 2 : 0), by - 6, 2, 2, '#1a1010');
  prect(ctx, x + d * 7 - (d < 0 ? 4 : 0), by - 4, 4, 2, '#ffa020');
  if (b.st === 'fly') {
    const f = Math.sin(b.t * 30) > 0 ? -6 : 2;
    prect(ctx, x - 6, by + f, 10, 2, '#1a3a7a');
  } else {
    prect(ctx, x - d * 6 - (d > 0 ? 2 : 0), by, 4, 2, '#1a3a7a');
    prect(ctx, x - 2, y - 2, 2, 2, '#ffa020'); prect(ctx, x + 2, y - 2, 2, 2, '#ffa020');
  }
}

function heroPose() {
  if (state === 'dead' || state === 'over') return 'fall';
  if (state !== 'play') return 'cling';
  if (p.state === 'wall') return 'cling';
  if (p.state === 'ground') return 'idle';
  if (p.spin > 0) return 'tuck';
  return p.vy < 0 ? 'jump' : 'fall';
}
function drawHero() {
  heroSprite(SKINS[skinIdx], heroPose(), time, blinkT < 0);
  const put = (x, y, rot, a) => {
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(rot ? x : even(x), rot ? y : even(y));
    if (rot) ctx.rotate(rot);
    const sq = p.squash;
    ctx.scale(p.face * (1 + sq * 0.12), 1 - sq * 0.12);
    ctx.drawImage(hcv, -32, -36, 64, 64);
    ctx.restore();
  };
  if (p.spin > 0 && p.trail.length > 6) { put(p.trail[3].x, p.trail[3].y, p.trail[3].rot, 0.35); put(p.trail[6].x, p.trail[6].y, p.trail[6].rot, 0.18); }
  if (p.inv > 0 && Math.floor(p.inv * 20) % 2) return;
  put(p.x, p.y + 1, p.rot, 1);
  if (p.shield > 0) {
    ctx.strokeStyle = `rgba(111,211,255,${0.6 + Math.sin(time * 8) * 0.25})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y - 4, 26, 0, Math.PI * 2); ctx.stroke();
  }
  if (p.magnet > 0 && Math.sin(time * 10) > 0) { ctx.strokeStyle = 'rgba(255,90,90,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y - 4, 34, 0, Math.PI * 2); ctx.stroke(); }
}

function drawWorld() {
  for (const l of leaves) {
    const v = Math.sin(l.t * 3) > 0;
    prect(ctx, l.x, l.y, v ? 4 : 2, v ? 2 : 4, l.col);
  }
  drawHeightMarks();
  drawGround();
  for (const q of poles) if (q.y1 > camY - 40 && q.y0 < camY + H + 30) drawPole(q);
  for (const b of birds) drawBird(b);
  drawEnts();
  drawHero();
  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max * 1.5, 0, 1);
    prect(ctx, q.x - q.size / 2, q.y - q.size / 2, q.size, q.size, q.color);
  }
  ctx.globalAlpha = 1;
}

// ---------- Интерфейс ----------
function coinIcon(x, y, r = 8) { pell(ctx, x, y, r + 2, r + 2, OL); pell(ctx, x, y, r, r, '#c8820a'); pell(ctx, x, y, r - 3, r - 3, '#ffd23a'); prect(ctx, x - 2, y - r + 4, 2, r - 2, '#fff6a0'); }
function trophyIcon(x, y) {
  prect(ctx, x - 10, y - 10, 20, 14, OL); prect(ctx, x - 6, y + 2, 12, 10, OL);
  prect(ctx, x - 8, y - 8, 16, 10, '#ffd23a'); prect(ctx, x - 12, y - 8, 4, 6, '#ffd23a'); prect(ctx, x + 8, y - 8, 4, 6, '#ffd23a');
  prect(ctx, x - 2, y + 2, 4, 4, '#c8820a'); prect(ctx, x - 6, y + 6, 12, 4, '#c8820a'); prect(ctx, x - 6, y - 8, 2, 6, '#fff6a0');
}
function button(r, label, col, dark) {
  ctx.fillStyle = OL; ctx.fillRect(r.x - 3, r.y - 3, r.w + 6, r.h + 9);
  ctx.fillStyle = dark; ctx.fillRect(r.x, r.y + 4, r.w, r.h);
  ctx.fillStyle = col; ctx.fillRect(r.x, r.y, r.w, r.h - 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(r.x + 4, r.y + 3, r.w - 8, 4);
  text(label, r.x + r.w / 2, r.y + r.h / 2 + 10, 2, '#ffffff');
}
function roundBtn(b) {
  pell(ctx, b.x + b.w / 2, b.y + b.h / 2 + 2, b.w / 2 + 2, b.h / 2 + 2, OL);
  pell(ctx, b.x + b.w / 2, b.y + b.h / 2, b.w / 2, b.h / 2, '#ffffff');
}
function drawMuteBtn() {
  const b = BTN.mute; roundBtn(b);
  ctx.fillStyle = OL;
  ctx.fillRect(b.x + 7, b.y + 13, 6, 8);
  ctx.beginPath(); ctx.moveTo(b.x + 13, b.y + 13); ctx.lineTo(b.x + 19, b.y + 7); ctx.lineTo(b.x + 19, b.y + 27); ctx.lineTo(b.x + 13, b.y + 21); ctx.fill();
  if (muted) { ctx.strokeStyle = '#ff3d3d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(b.x + 6, b.y + 6); ctx.lineTo(b.x + 28, b.y + 28); ctx.stroke(); }
  else { ctx.fillRect(b.x + 22, b.y + 12, 2, 10); ctx.fillRect(b.x + 26, b.y + 9, 2, 16); }
}
function drawHand(x, y) {
  const tap = Math.sin(time * 6) > 0 ? 8 : 0;
  y += tap;
  prect(ctx, x - 2, y - 2, 16, 40, OL); prect(ctx, x - 14, y + 26, 52, 46, OL);
  prect(ctx, x, y, 12, 40, '#ffffff');
  prect(ctx, x - 12, y + 28, 48, 40, '#ffffff');
  prect(ctx, x + 14, y + 22, 8, 10, '#ffffff'); prect(ctx, x + 24, y + 24, 8, 8, '#ffffff');
  prect(ctx, x + 12, y + 30, 2, 12, OL); prect(ctx, x + 22, y + 30, 2, 12, OL);
  prect(ctx, x - 12, y + 60, 48, 8, '#d8d8e8');
  if (tap) for (let k = 0; k < 3; k++) prect(ctx, x - 14 + k * 14, y - 18 - (k === 1 ? 6 : 0), 4, 8, '#ffffff');
}
function drawToast() {
  if (!toasts.length) return;
  const tt = toasts[0], a = tt.a;
  const slide = clamp(Math.min(tt.t, 2.8 - tt.t) * 4, 0, 1);
  const y = -60 + slide * 116, x = 40, w = W - 80;
  pell(ctx, x + 22, y + 22, 24, 24, OL);
  ctx.fillStyle = OL; ctx.fillRect(x + 22, y - 2, w - 22, 48);
  pell(ctx, x + w, y + 22, 24, 24, OL);
  ctx.fillStyle = '#3a2a2a'; ctx.fillRect(x + 22, y + 2, w - 22, 40);
  pell(ctx, x + w, y + 22, 20, 20, '#3a2a2a');
  pell(ctx, x + 22, y + 22, 20, 20, '#ff5a2a');
  trophyIcon(x + 22, y + 22);
  text(a.name, x + 50, y + 22, 2, '#ffffff', 'left', null);
  coinIcon(x + 56, y + 32, 6);
  text('+' + a.reward, x + 68, y + 40, 2, '#ffd23a', 'left', null);
}

function drawHUD() {
  if (state === 'play' || state === 'dead') {
    coinIcon(22, 26);
    text(String(coinsRun), 36, 36, 2, '#ffffff', 'left');
    trophyIcon(22, 56);
    text(String(best), 36, 66, 2, '#ffffff', 'left');
    text(String(heightM()), W / 2, 50, 4, '#ffffff');
    const b = BTN.pause; roundBtn(b);
    ctx.fillStyle = OL; ctx.fillRect(b.x + 10, b.y + 9, 5, 16); ctx.fillRect(b.x + 19, b.y + 9, 5, 16);
    if (combo >= 3 && comboT > 0) text('X' + combo, W / 2, 74, 2, '#ffd23a');
    if (state === 'play' && heightM() < 40) {
      if (tutStep === 0) text('ДЕРЖИ — ДЛИННЫЙ ПРЫЖОК', W / 2, H - 40, 2, '#ffffff');
      if (tutStep === 1) { text('ЖМИ В ВОЗДУХЕ —', W / 2, H - 62, 2, '#ffffff'); text('САЛЬТО И РАЗВОРОТ!', W / 2, H - 38, 2, '#ffd23a'); }
    }
    if (p.magnet > 0) text('МАГНИТ ' + Math.ceil(p.magnet), W / 2, 96, 1, '#ff8a8a');
  }
  for (const e of ents) {
    if (e.type === 'cone' && e.st === 'warn') {
      const blink = Math.floor(e.warn * 10) % 2 === 0;
      prect(ctx, e.x - 12, 80, 24, 28, OL);
      prect(ctx, e.x - 10, 82, 20, 24, blink ? '#ff3d3d' : '#ffd23a');
      text('!', e.x + 1, 102, 2, '#ffffff', 'center', null);
    }
    if (e.type === 'hawk' && e.st === 'warn') {
      const sy = even(e.y - camY), ex = e.from < 0 ? 6 : W - 30, blink = Math.floor(e.warn * 10) % 2 === 0;
      prect(ctx, ex - 2, sy - 14, 28, 28, OL);
      prect(ctx, ex, sy - 12, 24, 24, blink ? '#ff3d3d' : '#ffd23a');
      text('!', ex + 13, sy + 9, 2, '#ffffff', 'center', null);
    }
  }
  if (banner) {
    const a = clamp(Math.min(banner.t, 2.6 - banner.t) * 3, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = OL; ctx.fillRect(0, 150, W, 56);
    ctx.fillStyle = '#ff3d7f'; ctx.fillRect(0, 154, W, 48);
    text(banner.text, W / 2, 190, 2, '#ffffff');
    ctx.globalAlpha = 1;
  }
  drawToast();
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(42,20,8,0.6)'; ctx.fillRect(0, 0, W, H);
    text('ПАУЗА', W / 2, H / 2 - 6, 5, '#ffd23a');
    text('НАЖМИ, ЧТОБЫ ИГРАТЬ', W / 2, H / 2 + 34, 2);
  }
}

function drawLogo(y) {
  const rows = [['WALL', ['#ffd23a', '#ff4a3a', '#3ce06a', '#3ab0ff']], ['PLAY', ['#ff8a1e', '#c04aff', '#ff5ab0', '#5ae0ff']]];
  rows.forEach(([word, cols], r) => {
    const yy = y + r * 64;
    for (let i = 0; i < word.length; i++) {
      const x = W / 2 + (i - 1.5) * 56;
      const wob = Math.sin(time * 3 + i * 0.8 + r) * 3;
      const sh = textCanvas(word[i], 7, OL, null), c = textCanvas(word[i], 7, cols[i], OL);
      ctx.save();
      ctx.translate(x, yy + wob);
      ctx.rotate(Math.sin(time * 2 + i + r * 2) * 0.08 + (r ? 0.05 : -0.05));
      ctx.drawImage(sh, -sh.width / 2 + 5, -sh.height / 2 + 9);
      ctx.drawImage(c, -c.width / 2, -c.height / 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-c.width / 2 + 8, -c.height / 2 + 8, 7, 7);
      ctx.restore();
    }
  });
}

function drawMenu() {
  drawLogo(92);
  coinIcon(W / 2 - 64, 250);
  text(String(bank), W / 2 - 50, 260, 2, '#ffffff', 'left');
  trophyIcon(W / 2 + 26, 250);
  text(best + 'М', W / 2 + 40, 260, 2, '#ffffff', 'left');
  button(BTN.shop, 'ГЕРОИ', '#ff3d7f', '#c01f5a');
  button(BTN.ach, 'НАГРАДЫ', '#3ab0ff', '#1a70c0');
  drawMuteBtn();
  text('НАЖМИ —', W / 2 + 40, 440, 2, '#ffffff');
  text('ПРЫЖОК ОТ СТЕНЫ', W / 2 + 20, 464, 2, '#ffffff');
  drawHand(W / 2 - 6, 528);
}

function drawShop() {
  ctx.fillStyle = 'rgba(42,20,8,0.78)'; ctx.fillRect(0, 0, W, H);
  text('ГЕРОИ', W / 2, 70, 4, '#ffd23a');
  coinIcon(W / 2 - 30, 104);
  text(String(bank), W / 2 - 16, 114, 2, '#ffffff', 'left');
  for (let i = 0; i < SKINS.length; i++) {
    const r = shopRect(i), s = SKINS[i];
    const sel = i === skinIdx, own = owned.includes(i);
    ctx.fillStyle = OL; ctx.fillRect(r.x - 3, r.y - 3, r.w + 6, r.h + 6);
    ctx.fillStyle = sel ? '#ffd23a' : own ? '#ffffff' : '#b8a898'; ctx.fillRect(r.x, r.y, r.w, r.h);
    heroSprite(s, 'idle', time + i * 0.7, false);
    ctx.drawImage(hcv, r.x + r.w / 2 - 32, r.y - 10, 64, 64);
    text(s.name, r.x + r.w / 2, r.y + 68, 1, OL, 'center', null);
    if (own) text(sel ? 'ВЫБРАН' : 'ВЗЯТЬ', r.x + r.w / 2, r.y + 82, 1, sel ? '#c01f5a' : '#1a70c0', 'center', null);
    else { coinIcon(r.x + r.w / 2 - 16, r.y + 77, 4); text(String(s.cost), r.x + r.w / 2 - 8, r.y + 82, 1, bank >= s.cost ? OL : '#6a5a4a', 'left', null); }
  }
  text('НАЖМИ МИМО — НАЗАД', W / 2, H - 12, 1, '#ffffff', 'center', null);
}

function drawAch() {
  ctx.fillStyle = 'rgba(42,20,8,0.82)'; ctx.fillRect(0, 0, W, H);
  text('НАГРАДЫ', W / 2, 70, 4, '#ffd23a');
  text(achieved.length + ' / ' + ACH.length, W / 2, 98, 2, '#ffffff');
  ACH.forEach((a, i) => {
    const y = 120 + i * 40, got = achieved.includes(a.id);
    ctx.fillStyle = OL; ctx.fillRect(24, y - 2, W - 48, 36);
    ctx.fillStyle = got ? '#ffd23a' : '#6a5a4a'; ctx.fillRect(26, y, W - 52, 32);
    if (got) trophyIcon(46, y + 16); else { prect(ctx, 38, y + 8, 16, 16, OL); prect(ctx, 40, y + 10, 12, 12, '#8a7a6a'); }
    text(a.name, 66, y + 23, 1, got ? OL : '#e0d0c0', 'left', null);
    coinIcon(W - 80, y + 16, 5);
    text('+' + a.reward, W - 70, y + 23, 1, got ? OL : '#e0d0c0', 'left', null);
  });
  text('НАЖМИ — НАЗАД', W / 2, H - 12, 1, '#ffffff', 'center', null);
}

function drawOver() {
  const a = clamp((deadT - 0.9) * 4, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(42,20,8,0.45)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = OL; ctx.fillRect(28, 130, W - 56, 280);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(34, 136, W - 68, 268);
  ctx.fillStyle = '#ff3d7f'; ctx.fillRect(34, 136, W - 68, 50);
  text('ОЙ-ОЙ!', W / 2, 176, 3, '#ffffff');
  const m = heightM();
  text(m + 'М', W / 2, 262, 6, '#ffd23a');
  if (p.newBest) text('НОВЫЙ РЕКОРД!', W / 2, 296, 2, '#ff3d7f', 'center', null);
  else text('РЕКОРД ' + best + 'М', W / 2, 296, 2, OL, 'center', null);
  coinIcon(W / 2 - 34, 326);
  text('+' + coinsRun, W / 2 - 20, 336, 2, OL, 'left', null);
  text('ОТСКОКОВ ' + kicks + '  САЛЬТО ' + flips, W / 2, 378, 1, '#6a5a4a', 'center', null);
  if (deadT > 1.3) {
    ctx.globalAlpha = a * (0.55 + Math.sin(time * 5) * 0.45);
    text('НАЖМИ, ЧТОБЫ ЕЩЁ', W / 2, H - 150, 2, '#ffffff');
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(even(rand(-1, 1) * shake * 14), even(rand(-1, 1) * shake * 14));
  drawBackground();
  ctx.save();
  ctx.translate(0, -camR);
  drawWorld();
  ctx.restore();
  ctx.restore();
  drawHUD();
  if (state === 'menu') drawMenu();
  if (state === 'shop') drawShop();
  if (state === 'ach') drawAch();
  if (state === 'over') drawOver();
}

// ---------- Цикл ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  const steps = Math.ceil(dt / (1 / 120));
  for (let i = 0; i < steps; i++) update(dt / steps);
  draw();
  requestAnimationFrame(frame);
}
reset();
window.__game = { get state() { return state; }, get p() { return p; }, get poles() { return poles; }, press, release, heightM };
requestAnimationFrame(frame);

// Офлайн: кэшируем игру, если она открыта с сайта
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
</body>
