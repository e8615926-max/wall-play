<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b14">
<title>Wall Play</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; color-scheme: dark;
    background: #0d0b14; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  body { padding: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

// ---------- Константы ----------
const W = 360, H = 640;
const WALL = 46;                 // толщина стены
const LX = WALL, RX = W - WALL;  // внутренние края стен
const PW = 18, PH = 24;          // хитбокс героя
const MIN_X = LX + PW / 2, MAX_X = RX - PW / 2;
const G = 1900;                  // гравитация
const JVX = 430, JVY = -780;     // прыжок от стены
const DJVY = -640;               // двойной прыжок
const SLIDE = 70, ICE_SLIDE = 330, MAX_FALL = 950;
const START_Y = -60;
const PX_PER_M = 20;

const ZONES = [
  { m: 0,    name: 'КАМЕННАЯ ШАХТА', bg: ['#1b1626', '#0d0b14'], wall: '#5a4e6b', wallD: '#3b3248', wallL: '#7a6c8c' },
  { m: 250,  name: 'МШИСТЫЕ ГЛУБИНЫ', bg: ['#10231c', '#07110d'], wall: '#4d6650', wallD: '#2f4232', wallL: '#6f8f6c' },
  { m: 600,  name: 'ЛЕДЯНОЙ КОЛОДЕЦ', bg: ['#132338', '#080f1c'], wall: '#557090', wallD: '#344a66', wallL: '#86a4c6' },
  { m: 1000, name: 'ЛАВОВЫЕ ТОННЕЛИ', bg: ['#2e1410', '#140806'], wall: '#73463a', wallD: '#4a2a22', wallL: '#a26a52' },
  { m: 1500, name: 'ХРАМ ТЕНЕЙ',     bg: ['#25122e', '#0e0614'], wall: '#5e3c6e', wallD: '#3a2346', wallL: '#8a63a0' },
  { m: 2200, name: 'НЕБЕСНАЯ БАШНЯ',  bg: ['#2a3f63', '#101a2e'], wall: '#8a8fa8', wallD: '#5c6078', wallL: '#c0c4d8' },
];

const SKINS = [
  { name: 'Ниндзя',  cost: 0,   body: '#2b2b3a', band: '#e8413c', skin: '#f2c9a0' },
  { name: 'Лис',     cost: 50,  body: '#e07b2c', band: '#fff3d6', skin: '#f6d2a8' },
  { name: 'Лягуш',   cost: 120, body: '#3fae49', band: '#f2e14a', skin: '#a8e07a' },
  { name: 'Рыцарь',  cost: 250, body: '#9aa3b5', band: '#3c7be8', skin: '#d8dde8' },
  { name: 'Призрак', cost: 500, body: '#e9e4f5', band: '#9d5cff', skin: '#ffffff' },
];

// ---------- Хранилище ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('wallplay_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wallplay_' + k, JSON.stringify(v)); } catch (e) {} },
};
let best = store.get('best', 0);
let bank = store.get('coins', 0);
let owned = store.get('owned', [0]);
let skinIdx = store.get('skin', 0);
let muted = store.get('muted', false);

// ---------- Канвас ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const ww = document.body.clientWidth || window.innerWidth, wh = document.body.clientHeight || window.innerHeight;
  scale = Math.min(ww / W, wh / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  cv.width = Math.floor(W * scale * dpr);
  cv.height = Math.floor(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

// ---------- Звук ----------
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f0, f1, dur, type = 'square', vol = 0.08, delay = 0) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.15) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(a.destination); s.start();
}
const sfx = {
  jump()   { tone(300, 620, 0.12, 'square', 0.06); },
  dbl()    { tone(500, 1100, 0.14, 'square', 0.06); },
  grab()   { tone(140, 90, 0.05, 'triangle', 0.10); },
  coin()   { tone(988, 988, 0.06, 'square', 0.05); tone(1319, 1319, 0.12, 'square', 0.05, 0.06); },
  crack()  { noise(0.18, 0.12); },
  die()    { noise(0.4, 0.25); tone(400, 60, 0.5, 'sawtooth', 0.08); },
  zone()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.07, i * 0.09)); },
  click()  { tone(700, 700, 0.04, 'square', 0.04); },
};

// ---------- Утилиты ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
}
// детерминированный шум для текстур стен
function hash(n) { n = (n << 13) ^ n; return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff; }

// ---------- Состояние игры ----------
let state = 'menu';   // menu | play | dead | over | shop
let p, segs, ents, parts, camY, minY, coinsRun, nextObY, nextCoinY, sideTop, shake, deadT, zoneIdx, banner, kicks, combo, comboT, time, paused;

function reset() {
  p = {
    x: MIN_X, y: START_Y, vx: 0, vy: 0, state: 'wall', side: 'L', dj: true,
    face: 1, spin: 0, rot: 0, trail: [], squash: 0, shield: 0,
  };
  segs = { L: [], R: [] };
  sideTop = { L: 40, R: 40 };
  ents = []; parts = [];
  camY = START_Y - H * 0.7;
  minY = START_Y;
  coinsRun = 0; kicks = 0; combo = 0; comboT = 0;
  nextObY = START_Y - 700;
  nextCoinY = START_Y - 300;
  shake = 0; deadT = 0; zoneIdx = 0; banner = null; time = 0; paused = false;
  generate();
}

function heightM() { return Math.max(0, Math.floor((START_Y - minY) / PX_PER_M)); }
function difficulty() { return clamp((START_Y - minY) / 40000, 0, 1); }

// ---------- Генерация стен ----------
function segAt(side, y) {
  const arr = segs[side];
  for (let i = arr.length - 1; i >= 0; i--) { const s = arr[i]; if (y >= s.y0 && y < s.y1) return s; }
  return null;
}
function segsIn(side, y0, y1) { return segs[side].filter(s => s.y1 > y0 && s.y0 < y1); }
function isDeadly(s) { return s.type === 'spike'; }
function isHole(s) { return s.type === 'gap' || s.broken; }

function pickType(side, y0, y1) {
  const h = START_Y - y1;
  if (h < 500) return 'stone';
  const d = difficulty();
  const other = segsIn(side === 'L' ? 'R' : 'L', y0 - 60, y1 + 60);
  const otherBad = other.some(s => s.type === 'spike' || s.type === 'gap');
  const table = [
    ['stone', 1.0],
    ['spike', otherBad ? 0 : 0.22 + 0.45 * d],
    ['ice', h > 2500 ? 0.12 + 0.2 * d : 0],
    ['crumble', h > 1500 ? 0.12 + 0.2 * d : 0],
    ['gap', otherBad || h < 3500 ? 0 : 0.08 + 0.15 * d],
  ];
  // не ставим опасность подряд на одной стороне
  const prev = segs[side][segs[side].length - 1];
  if (prev && prev.type !== 'stone') { table[1][1] *= 0.3; table[4][1] = 0; }
  let sum = table.reduce((a, t) => a + t[1], 0), r = Math.random() * sum;
  for (const [t, w] of table) { if ((r -= w) <= 0) return t; }
  return 'stone';
}

function generate() {
  const limit = camY - 900;
  while (sideTop.L > limit || sideTop.R > limit) {
    const side = sideTop.L >= sideTop.R ? 'L' : 'R';
    const y1 = sideTop[side];
    let len = rand(90, 230);
    let y0 = y1 - len;
    let type = pickType(side, y0, y1);
    if (type === 'spike') { len = rand(50, 110 + 60 * difficulty()); y0 = y1 - len; }
    if (type === 'gap') { len = rand(60, 120); y0 = y1 - len; }
    if (type === 'crumble') { len = rand(60, 110); y0 = y1 - len; }
    segs[side].push({ side, y0, y1, type, timer: 0, touched: false, broken: false, seed: Math.floor(Math.random() * 1e6) });
    sideTop[side] = y0;
  }
  // объекты
  while (nextObY > limit) {
    spawnObstacle(nextObY);
    const d = difficulty();
    nextObY -= rand(260, 480) * (1 - 0.45 * d);
  }
  while (nextCoinY > limit) {
    spawnCoins(nextCoinY);
    nextCoinY -= rand(380, 700);
  }
  // чистим то, что далеко внизу
  const cut = camY + H + 400;
  for (const side of ['L', 'R']) segs[side] = segs[side].filter(s => s.y0 < cut);
}

function spawnObstacle(y) {
  const h = START_Y - y, d = difficulty();
  const opts = [];
  if (h > 1200) opts.push(['bat', 1]);
  if (h > 2600) opts.push(['saw', 0.8 + d]);
  if (h > 4500) opts.push(['rock', 0.6 + d]);
  if (h > 1800) opts.push(['shield', 0.12]);
  if (!opts.length) return;
  let sum = opts.reduce((a, o) => a + o[1], 0), r = Math.random() * sum, type = opts[0][0];
  for (const [t, w] of opts) { if ((r -= w) <= 0) { type = t; break; } }
  if (type === 'bat') {
    const dir = Math.random() < 0.5 ? -1 : 1;
    ents.push({ type, x: rand(LX + 30, RX - 30), y, baseY: y, r: 9, vx: dir * (60 + 90 * d + rand(0, 30)), t: rand(0, 6) });
  } else if (type === 'saw') {
    const moving = Math.random() < 0.4 + 0.5 * d;
    ents.push({ type, x: W / 2, y, r: 15, cx: W / 2, amp: moving ? rand(50, 100) : 0, spd: rand(1.2, 2.2), t: rand(0, 6), rot: 0 });
  } else if (type === 'rock') {
    ents.push({ type, x: rand(LX + 25, RX - 25), y, triggerY: y, r: 12, state: 'idle', warn: 0, vy: 0, rot: 0 });
  } else if (type === 'shield') {
    ents.push({ type, x: rand(LX + 40, RX - 40), y, r: 10, t: 0 });
  }
}

function spawnCoins(y) {
  const n = 5;
  const kind = Math.random();
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    let x, yy;
    if (kind < 0.5) { // дуга
      const dir = Math.random() < 0.5 ? 1 : -1;
      x = W / 2 + (t - 0.5) * 170 * dir; yy = y - Math.sin(t * Math.PI) * 60 - t * 40;
    } else { // столбик
      x = W / 2 + Math.sin(i) * 6; yy = y - i * 26;
    }
    ents.push({ type: 'coin', x, y: yy, r: 7, t: i * 0.3 });
  }
}

// ---------- Частицы ----------
function burst(x, y, n, color, spd = 150, life = 0.5, size = 3, grav = 600) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size, grav });
  }
}
function dust(x, y, dir) {
  for (let i = 0; i < 6; i++) {
    parts.push({ x, y: y + rand(-8, 8), vx: dir * rand(20, 120), vy: rand(-80, 40), life: 0.35, max: 0.35, color: '#d8cfe6', size: rand(2, 4), grav: 200 });
  }
}

// ---------- Управление ----------
function tap() {
  audio();
  if (state === 'menu') { state = 'play'; doJump(); return; }
  if (state === 'over') { if (deadT > 0.6) { reset(); state = 'menu'; } return; }
  if (state !== 'play' || paused) return;
  doJump();
}

function doJump() {
  if (p.state === 'wall') {
    const dir = p.side === 'L' ? 1 : -1;
    p.vx = dir * JVX; p.vy = JVY; p.state = 'air'; p.dj = true; p.face = dir;
    p.squash = 1;
    dust(p.side === 'L' ? LX : RX, p.y, dir);
    sfx.jump();
  } else if (p.state === 'air' && p.dj) {
    p.dj = false;
    p.vy = DJVY;
    if (p.vx === 0) p.vx = (p.x < W / 2 ? 1 : -1) * JVX;
    else p.vx = -p.vx;            // двойной прыжок разворачивает героя
    p.face = Math.sign(p.vx);
    p.spin = 1;
    burst(p.x, p.y + 8, 8, '#ffffff', 90, 0.3, 2, 0);
    sfx.dbl();
  }
}

function pressStart(e) {
  if (e.button !== undefined && e.button !== 0) return;
  const pt = toGame(e);
  if (uiClick(pt)) return;
  tap();
}
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); pressStart(e); });
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) { e.preventDefault(); if (state === 'shop') { state = 'menu'; return; } tap(); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
  if (e.code === 'KeyM') toggleMute();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

function toggleMute() { muted = !muted; store.set('muted', muted); }

// ---------- UI кнопки ----------
const BTN = {
  mute:  { x: W - 40, y: 12, w: 28, h: 28 },
  pause: { x: 12, y: 12, w: 28, h: 28 },
  shop:  { x: W / 2 - 60, y: H - 120, w: 120, h: 36 },
};
function inRect(pt, r) { return pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h; }
function uiClick(pt) {
  if (state === 'shop') { shopClick(pt); return true; }
  if (inRect(pt, BTN.mute) && state !== 'play') { toggleMute(); sfx.click(); return true; }
  if (state === 'play' && inRect(pt, BTN.pause)) { paused = !paused; return true; }
  if (state === 'play' && paused) { paused = false; return true; }
  if (state === 'menu' && inRect(pt, BTN.shop)) { state = 'shop'; sfx.click(); return true; }
  return false;
}
function shopRect(i) { return { x: 40, y: 150 + i * 72, w: W - 80, h: 60 }; }
function shopClick(pt) {
  for (let i = 0; i < SKINS.length; i++) {
    if (inRect(pt, shopRect(i))) {
      if (owned.includes(i)) { skinIdx = i; store.set('skin', i); sfx.click(); }
      else if (bank >= SKINS[i].cost) {
        bank -= SKINS[i].cost; owned.push(i); skinIdx = i;
        store.set('coins', bank); store.set('owned', owned); store.set('skin', i); sfx.coin();
      } else tone(200, 120, 0.15, 'square', 0.06);
      return;
    }
  }
  state = 'menu'; sfx.click();
}

// ---------- Логика ----------
function die(reason) {
  if (state !== 'play') return;
  if (p.shield > 0 && reason !== 'fall') {
    p.shield = 0; p.inv = 1.0;
    burst(p.x, p.y, 20, '#6fd3ff', 220, 0.6, 3, 0);
    shake = 0.3; sfx.crack();
    if (p.state === 'wall') { p.state = 'air'; p.vx = (p.side === 'L' ? 1 : -1) * JVX * 0.6; p.vy = -500; p.dj = true; }
    else { p.vy = -500; }
    return;
  }
  state = 'dead'; deadT = 0;
  p.state = 'dead';
  p.vx = (p.x < W / 2 ? 1 : -1) * 120; p.vy = -520;
  shake = 0.45;
  burst(p.x, p.y, 26, '#ff5a4f', 260, 0.8, 3);
  burst(p.x, p.y, 14, SKINS[skinIdx].body, 200, 0.8, 4);
  sfx.die();
  const m = heightM();
  if (m > best) { best = m; store.set('best', best); }
  bank += coinsRun; store.set('coins', bank);
}

function tryGrab(side) {
  const top = p.y - PH / 2 + 3, bot = p.y + PH / 2 - 3;
  const touching = segsIn(side, top, bot);
  if (touching.some(isDeadly)) { die('spike'); return; }
  const s = segAt(side, p.y);
  if (!s || isHole(s)) { p.vx = 0; return; }   // дыра — скользим вниз без опоры
  p.state = 'wall'; p.side = side; p.face = side === 'L' ? 1 : -1;
  p.vx = 0; p.vy = p.vy < 0 ? p.vy * 0.25 : p.vy * 0.2;
  p.dj = true; p.spin = 0; p.rot = 0; p.squash = -1;
  kicks++;
  dust(side === 'L' ? LX : RX, p.y, side === 'L' ? 1 : -1);
  sfx.grab();
  if (s.type === 'crumble' && !s.touched) { s.touched = true; s.timer = 0.5; sfx.crack(); }
}

function update(dt) {
  time += dt;
  if (state === 'menu' || state === 'shop') {
    // герой висит на стене и ждёт
    p.trail.unshift({ x: p.x, y: p.y + Math.sin(time * 3) * 2 }); p.trail.length = Math.min(p.trail.length, 10);
    updateParts(dt);
    return;
  }
  if (paused) return;

  if (state === 'play') updatePlayer(dt);
  else if (state === 'dead' || state === 'over') {
    deadT += dt;
    p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 10;
    if (deadT > 0.8) state = 'over';
  }

  // камера только вверх
  if (state === 'play') {
    const target = p.y - H * 0.58;
    if (target < camY) camY += (target - camY) * Math.min(1, dt * 6);
  }

  // зоны
  const m = heightM();
  const zi = ZONES.reduce((acc, z, i) => m >= z.m ? i : acc, 0);
  if (zi !== zoneIdx) { zoneIdx = zi; banner = { text: ZONES[zi].name, t: 2.5 }; sfx.zone(); }
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

  // крошащиеся блоки
  for (const side of ['L', 'R']) for (const s of segs[side]) {
    if (s.touched && !s.broken) {
      s.timer -= dt;
      if (s.timer <= 0) {
        s.broken = true;
        const x = side === 'L' ? LX - 12 : RX + 12;
        for (let yy = s.y0; yy < s.y1; yy += 14) burst(x, yy, 3, ZONES[zoneIdx].wall, 120, 0.8, 5, 900);
        sfx.crack();
      }
    }
  }

  updateEnts(dt);
  updateParts(dt);
  generate();
  if (shake > 0) shake -= dt;
}

function updatePlayer(dt) {
  if (p.inv > 0) p.inv -= dt;
  p.squash *= Math.pow(0.001, dt);
  if (p.state === 'wall') {
    const s = segAt(p.side, p.y);
    const top = p.y - PH / 2 + 3, bot = p.y + PH / 2 - 3;
    if (segsIn(p.side, top, bot).some(isDeadly)) { die('spike'); return; }
    if (!s || isHole(s)) {
      p.state = 'air'; p.vx = 0; p.vy = Math.max(p.vy, 0);
    } else {
      const ice = s.type === 'ice';
      const target = ice ? ICE_SLIDE : SLIDE;
      p.vy += (target - p.vy) * Math.min(1, dt * (ice ? 1.6 : 7));
      p.y += p.vy * dt;
      if (ice && Math.random() < dt * 30) parts.push({ x: p.side === 'L' ? LX + 2 : RX - 2, y: p.y + 10, vx: 0, vy: rand(-20, 20), life: 0.3, max: 0.3, color: '#dff4ff', size: 2, grav: 0 });
    }
  }
  if (p.state === 'air') {
    p.vy = Math.min(MAX_FALL, p.vy + G * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.spin > 0) { p.spin -= dt * 2.4; p.rot = (1 - Math.max(0, p.spin)) * Math.PI * 2 * p.face; if (p.spin <= 0) { p.spin = 0; p.rot = 0; } }
    if (p.x <= MIN_X) { p.x = MIN_X; if (p.vx <= 0) tryGrab('L'); }
    else if (p.x >= MAX_X) { p.x = MAX_X; if (p.vx >= 0) tryGrab('R'); }
    if (state !== 'play') return;
  }
  p.trail.unshift({ x: p.x, y: p.y }); if (p.trail.length > 10) p.trail.length = 10;
  if (p.y < minY) minY = p.y;
  if (p.y - camY > H + 30) die('fall');
}

function updateEnts(dt) {
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];
    if (e.t !== undefined) e.t += dt;
    if (e.type === 'bat') {
      e.x += e.vx * dt;
      if (e.x < LX + e.r + 4) { e.x = LX + e.r + 4; e.vx = Math.abs(e.vx); }
      if (e.x > RX - e.r - 4) { e.x = RX - e.r - 4; e.vx = -Math.abs(e.vx); }
      e.y = e.baseY + Math.sin(e.t * 4) * 10;
    } else if (e.type === 'saw') {
      e.x = e.cx + Math.sin(e.t * e.spd) * e.amp;
      e.rot += dt * 12;
    } else if (e.type === 'rock') {
      if (e.state === 'idle' && state === 'play' && p.y < e.triggerY + H * 0.45) { e.state = 'warn'; e.warn = 0.9; tone(880, 880, 0.08, 'square', 0.05); }
      else if (e.state === 'warn') { e.warn -= dt; if (e.warn <= 0) { e.state = 'fall'; e.y = camY - 30; e.vy = 260; } }
      else if (e.state === 'fall') { e.vy += 700 * dt; e.y += e.vy * dt; e.rot += dt * 6; }
    }
    if (e.y > camY + H + 300) { ents.splice(i, 1); continue; }
    if (state !== 'play') continue;
    if (e.type === 'rock' && e.state !== 'fall') continue;
    // столкновение круг-прямоугольник
    const cx = clamp(e.x, p.x - PW / 2, p.x + PW / 2), cy = clamp(e.y, p.y - PH / 2, p.y + PH / 2);
    const hit = (e.x - cx) ** 2 + (e.y - cy) ** 2 < e.r * e.r;
    if (!hit) continue;
    if (e.type === 'coin') {
      combo++; comboT = 1.2;
      coinsRun++;
      burst(e.x, e.y, 6, '#ffd84a', 120, 0.4, 2, 0);
      sfx.coin();
      ents.splice(i, 1);
    } else if (e.type === 'shield') {
      p.shield = 1;
      burst(e.x, e.y, 12, '#6fd3ff', 140, 0.5, 2, 0);
      tone(600, 1200, 0.2, 'triangle', 0.08);
      ents.splice(i, 1);
    } else if (!(p.inv > 0)) {
      if (e.type === 'bat') { burst(e.x, e.y, 10, '#7b5ea8', 150, 0.5, 3); ents.splice(i, 1); }
      die(e.type);
    }
  }
}

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }
}

// ---------- Отрисовка ----------
function zoneColors() {
  const m = state === 'menu' || state === 'shop' ? 0 : heightM();
  let i = 0;
  for (let k = 0; k < ZONES.length; k++) if (m >= ZONES[k].m) i = k;
  const z = ZONES[i], n = ZONES[i + 1];
  if (!n) return z;
  const t = clamp((m - (n.m - 40)) / 40, 0, 1);
  if (t <= 0) return z;
  return {
    bg: [mix(z.bg[0], n.bg[0], t), mix(z.bg[1], n.bg[1], t)],
    wall: mix(z.wall, n.wall, t), wallD: mix(z.wallD, n.wallD, t), wallL: mix(z.wallL, n.wallL, t),
  };
}

function drawBackground(z) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, z.bg[0]); g.addColorStop(1, z.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // параллакс кирпичей
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  const py = camY * 0.4, bh = 22, bw = 44;
  const r0 = Math.floor(py / bh) - 1;
  for (let r = r0; r < r0 + H / bh + 3; r++) {
    const y = r * bh - py;
    const off = (r & 1) * bw / 2;
    for (let c = -1; c < W / bw + 1; c++) {
      if (hash(r * 131 + c * 7) < 0.55) ctx.fillRect(c * bw + off + 2, y + 2, bw - 4, bh - 4);
    }
  }
  // далёкие цепи / лианы
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
  const py2 = camY * 0.7;
  for (let k = 0; k < 3; k++) {
    const x = 90 + k * 90;
    const ph = Math.floor((py2 + k * 300) / 600);
    ctx.beginPath();
    for (let y = -20; y < H + 20; y += 8) {
      const wy = y + py2 + k * 300;
      ctx.lineTo(x + Math.sin(wy * 0.02 + ph) * 3, y);
    }
    ctx.stroke();
  }
}

function drawWalls(z) {
  for (const side of ['L', 'R']) {
    const x0 = side === 'L' ? 0 : RX;
    const edge = side === 'L' ? LX : RX;
    const dir = side === 'L' ? 1 : -1;
    for (const s of segs[side]) {
      const y0 = s.y0 - camY, y1 = s.y1 - camY;
      if (y1 < -10 || y0 > H + 10) continue;
      const hgt = y1 - y0;
      if (isHole(s)) {
        // тёмный провал
        ctx.fillStyle = '#05030a'; ctx.fillRect(x0, y0, WALL, hgt);
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(side === 'L' ? WALL - 4 : RX, y0, 4, hgt);
        continue;
      }
      let base = z.wall, dark = z.wallD, light = z.wallL;
      if (s.type === 'ice') { base = '#8fd0f0'; dark = '#5aa0c8'; light = '#e6f8ff'; }
      if (s.type === 'crumble') { base = '#8a6a48'; dark = '#5e4630'; light = '#b08a60'; }
      let shakeX = 0;
      if (s.touched && !s.broken) shakeX = Math.sin(time * 80) * 1.5;
      ctx.save(); ctx.translate(shakeX, 0);
      ctx.beginPath(); ctx.rect(x0, y0, WALL, hgt); ctx.clip();
      ctx.fillStyle = dark; ctx.fillRect(x0, y0, WALL, hgt);
      // кирпичи привязаны к миру
      const bh = 16, bw = 24;
      const r0 = Math.floor(s.y0 / bh);
      for (let r = r0; r * bh < s.y1; r++) {
        const yy = r * bh - camY;
        const off = (r & 1) ? bw / 2 : 0;
        for (let c = -1; c * bw < WALL + bw; c++) {
          const bx = x0 + c * bw + off;
          const hv = hash(r * 97 + c * 13 + (side === 'L' ? 0 : 5000));
          ctx.fillStyle = hv < 0.15 ? light : base;
          ctx.fillRect(bx + 1, yy + 1, bw - 2, bh - 2);
          ctx.fillStyle = 'rgba(255,255,255,0.12)';
          ctx.fillRect(bx + 1, yy + 1, bw - 2, 2);
          if (s.type === 'crumble' && hv > 0.5) {
            ctx.strokeStyle = dark; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(bx + 4, yy + 3); ctx.lineTo(bx + 10, yy + 9); ctx.lineTo(bx + 8, yy + 14); ctx.stroke();
          }
        }
      }
      if (s.type === 'ice') {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        for (let yy = y0 - ((s.y0 * 0.5) % 40); yy < y1; yy += 40) {
          ctx.beginPath(); ctx.moveTo(x0, yy + 30); ctx.lineTo(x0 + WALL, yy); ctx.lineTo(x0 + WALL, yy + 6); ctx.lineTo(x0, yy + 36); ctx.fill();
        }
      }
      ctx.restore();
      // внутренняя кромка
      ctx.fillStyle = s.type === 'ice' ? '#ffffff' : light;
      ctx.fillRect(side === 'L' ? edge - 3 : edge, y0, 3, hgt);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(side === 'L' ? edge : edge - 3, y0, 3, hgt);
      if (s.type === 'ice') {
        // сосульки снизу
        ctx.fillStyle = '#dff4ff';
        for (let k = 0; k < 3; k++) {
          const ix = side === 'L' ? edge - 8 - k * 12 : edge + 8 + k * 12;
          ctx.beginPath(); ctx.moveTo(ix - 4, y1); ctx.lineTo(ix + 4, y1); ctx.lineTo(ix, y1 + 8 + k * 2); ctx.fill();
        }
      }
      if (s.type === 'spike') drawSpikes(edge, dir, y0, y1);
    }
  }
}

function drawSpikes(edge, dir, y0, y1) {
  const sz = 12, len = 13;
  // металлическая планка
  ctx.fillStyle = '#3a3a46';
  ctx.fillRect(dir > 0 ? edge - 4 : edge, y0, 4, y1 - y0);
  for (let y = y0; y + sz <= y1 + 0.5; y += sz) {
    ctx.fillStyle = '#c9ced8';
    ctx.beginPath(); ctx.moveTo(edge, y); ctx.lineTo(edge + dir * len, y + sz / 2); ctx.lineTo(edge, y + sz); ctx.fill();
    ctx.fillStyle = '#8a909e';
    ctx.beginPath(); ctx.moveTo(edge, y + sz / 2); ctx.lineTo(edge + dir * len, y + sz / 2); ctx.lineTo(edge, y + sz); ctx.fill();
    ctx.fillStyle = '#ff6b5e';
    ctx.fillRect(edge + dir * (len - 2) - 1, y + sz / 2 - 1, 2, 2);
  }
}

function drawGround() {
  const gy = 40 - camY;
  if (gy > H + 10) return;
  ctx.fillStyle = '#2a2236'; ctx.fillRect(0, gy, W, H);
  ctx.fillStyle = '#3d3350'; ctx.fillRect(0, gy, W, 6);
  // факелы у старта
  for (const tx of [LX + 14, RX - 14]) {
    const ty = gy - 70;
    ctx.fillStyle = '#5b4632'; ctx.fillRect(tx - 2, ty, 4, 14);
    const f = Math.sin(time * 20 + tx) * 2;
    ctx.fillStyle = '#ff9a2e'; ctx.beginPath(); ctx.ellipse(tx, ty - 4, 5, 8 + f, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe36b'; ctx.beginPath(); ctx.ellipse(tx, ty - 2, 2.5, 4 + f / 2, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
  ctx.fillText('0 м', W / 2, gy + 24);
}

function drawHeightMarks() {
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  const step = 50 * PX_PER_M;
  const first = Math.floor((START_Y - (camY + H)) / step);
  for (let k = Math.max(1, first); k < first + 3; k++) {
    const y = START_Y - k * step - camY;
    if (y < -10 || y > H + 10) continue;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let x = LX + 6; x < RX - 6; x += 10) ctx.fillRect(x, y, 5, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillText(k * 50 + ' м', W / 2, y - 4);
  }
  // отметка рекорда
  if (best > 0) {
    const y = START_Y - best * PX_PER_M - camY;
    if (y > -10 && y < H + 10) {
      ctx.fillStyle = 'rgba(255,216,74,0.6)';
      for (let x = LX + 4; x < RX - 4; x += 8) ctx.fillRect(x, y, 4, 2);
      ctx.fillStyle = '#ffd84a'; ctx.fillText('РЕКОРД', W / 2, y - 5);
    }
  }
}

function drawEnts() {
  for (const e of ents) {
    const x = e.x, y = e.y - camY;
    if (e.type === 'rock' && e.state === 'warn') {
      const blink = Math.floor(e.warn * 10) % 2 === 0;
      ctx.fillStyle = blink ? '#ff4a3d' : '#ffd84a';
      ctx.beginPath(); ctx.moveTo(x, 50); ctx.lineTo(x + 11, 70); ctx.lineTo(x - 11, 70); ctx.fill();
      ctx.fillStyle = '#1a1020'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.fillText('!', x, 68);
      continue;
    }
    if (y < -40 || y > H + 40) continue;
    if (e.type === 'coin') {
      const sx = Math.abs(Math.cos(e.t * 4));
      ctx.fillStyle = '#b8860b';
      ctx.beginPath(); ctx.ellipse(x, y, 7 * sx + 1, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd84a';
      ctx.beginPath(); ctx.ellipse(x, y, 5.5 * sx + 0.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff6c0'; ctx.fillRect(x - 1 * sx, y - 3, 2 * sx, 3);
    } else if (e.type === 'bat') {
      const flap = Math.sin(e.t * 18);
      const d = Math.sign(e.vx);
      ctx.fillStyle = '#4b3570';
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x - 16, y - 6 - flap * 7); ctx.lineTo(x - 11, y + 2); ctx.lineTo(x - 6, y + 1);
      ctx.moveTo(x, y); ctx.lineTo(x + 16, y - 6 - flap * 7); ctx.lineTo(x + 11, y + 2); ctx.lineTo(x + 6, y + 1);
      ctx.fill();
      ctx.fillStyle = '#6a4d99'; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6a4d99'; ctx.fillRect(x - 6, y - 10, 3, 5); ctx.fillRect(x + 3, y - 10, 3, 5);
      ctx.fillStyle = '#ff4a3d'; ctx.fillRect(x - 3 + d, y - 2, 2, 2); ctx.fillRect(x + 1 + d, y - 2, 2, 2);
    } else if (e.type === 'saw') {
      if (e.amp > 0) { ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(e.cx - e.amp, y - 2, e.amp * 2, 4); }
      ctx.save(); ctx.translate(x, y); ctx.rotate(e.rot);
      ctx.fillStyle = '#c9ced8';
      ctx.beginPath();
      const n = 10;
      for (let k = 0; k < n * 2; k++) { const a = k / (n * 2) * Math.PI * 2, rr = k % 2 ? e.r - 4 : e.r + 3; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.fill();
      ctx.fillStyle = '#8a909e'; ctx.beginPath(); ctx.arc(0, 0, e.r - 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a3a46'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (e.type === 'rock' && e.state === 'fall') {
      ctx.save(); ctx.translate(x, y); ctx.rotate(e.rot);
      ctx.fillStyle = '#6b5a4a';
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2, rr = e.r + (hash(k + 3) - 0.5) * 6; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.fill();
      ctx.fillStyle = '#8c7862'; ctx.fillRect(-5, -6, 5, 4);
      ctx.restore();
    } else if (e.type === 'shield') {
      const b = Math.sin(e.t * 4) * 3;
      ctx.strokeStyle = '#6fd3ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y + b, 11, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(111,211,255,0.35)'; ctx.fill();
      ctx.fillStyle = '#e6f8ff';
      ctx.beginPath(); ctx.moveTo(x, y + b - 6); ctx.lineTo(x + 5, y + b - 3); ctx.lineTo(x + 4, y + b + 3); ctx.lineTo(x, y + b + 6); ctx.lineTo(x - 4, y + b + 3); ctx.lineTo(x - 5, y + b - 3); ctx.fill();
    }
  }
}

function drawHero() {
  const sk = SKINS[skinIdx];
  const x = p.x, y = p.y - camY;
  // шарф/повязка, развевающаяся сзади
  if (p.trail.length > 2) {
    ctx.strokeStyle = sk.band; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - p.face * 4, y - 7);
    for (let i = 2; i < p.trail.length; i += 2) {
      const t = p.trail[i];
      ctx.lineTo(t.x - p.face * (4 + i * 0.8), t.y - camY - 7 + Math.sin(time * 15 + i) * 1.5);
    }
    ctx.stroke();
  }
  if (p.inv > 0 && Math.floor(p.inv * 20) % 2) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(p.rot);
  const sq = p.squash;
  ctx.scale(p.face * (1 + sq * 0.15), 1 - sq * 0.15);
  // тело
  ctx.fillStyle = sk.body;
  ctx.fillRect(-7, -4, 14, 12);
  // ноги
  if (p.state === 'wall') {
    ctx.fillRect(-7, 8, 5, 5); ctx.fillRect(1, 6, 5, 5);
  } else {
    ctx.fillRect(-6, 8, 4, 5); ctx.fillRect(2, 8, 4, 5);
  }
  // руки
  if (p.state === 'wall') { ctx.fillRect(-11, -6, 4, 4); }
  else { ctx.fillRect(7, -2, 4, 4); ctx.fillRect(-11, 0, 4, 4); }
  // голова
  ctx.fillStyle = sk.body; ctx.fillRect(-8, -16, 16, 13);
  ctx.fillStyle = sk.skin; ctx.fillRect(-4, -12, 11, 5);
  ctx.fillStyle = '#111'; ctx.fillRect(2, -11, 2, 3); ctx.fillRect(5, -11, 2, 3);
  // повязка
  ctx.fillStyle = sk.band; ctx.fillRect(-8, -15, 16, 3);
  // пояс
  ctx.fillRect(-7, 3, 14, 2);
  ctx.restore();
  if (p.shield > 0) {
    ctx.strokeStyle = `rgba(111,211,255,${0.6 + Math.sin(time * 8) * 0.25})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 19, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawParts() {
  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - camY - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
}

function text(s, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Verdana, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (outline) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = '#140e1e'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function coinIcon(x, y, r = 7) {
  ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(x, y, r - 1.5, 0, Math.PI * 2); ctx.fill();
}

function drawMuteBtn() {
  const b = BTN.mute;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(b.x + 6, b.y + 10, 5, 8);
  ctx.beginPath(); ctx.moveTo(b.x + 11, b.y + 10); ctx.lineTo(b.x + 17, b.y + 5); ctx.lineTo(b.x + 17, b.y + 23); ctx.lineTo(b.x + 11, b.y + 18); ctx.fill();
  if (muted) { ctx.strokeStyle = '#ff5a4f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(b.x + 4, b.y + 4); ctx.lineTo(b.x + 24, b.y + 24); ctx.stroke(); }
  else { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(b.x + 17, b.y + 14, 6, -0.8, 0.8); ctx.stroke(); }
}

function drawHUD() {
  if (state === 'play' || state === 'dead') {
    text(heightM() + ' м', W / 2, 44, 30);
    coinIcon(W - 58, 26);
    text(String(coinsRun), W - 46, 32, 16, '#ffd84a', 'left');
    const b = BTN.pause;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#fff'; ctx.fillRect(b.x + 8, b.y + 7, 4, 14); ctx.fillRect(b.x + 16, b.y + 7, 4, 14);
    if (p.state === 'air' && p.dj && state === 'play') {
      // индикатор доступного двойного прыжка
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(p.x, p.y - camY - 22, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    if (combo >= 3 && comboT > 0) text('x' + combo, W / 2, 70, 14, '#ffd84a');
  }
  if (banner) {
    const a = clamp(Math.min(banner.t, 2.5 - banner.t) * 3, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 150, W, 50);
    text(banner.text, W / 2, 183, 20, '#ffd84a');
    ctx.globalAlpha = 1;
  }
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    text('ПАУЗА', W / 2, H / 2 - 10, 36);
    text('нажми, чтобы продолжить', W / 2, H / 2 + 24, 14, '#cfc6e0', 'center', false);
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(10,6,18,0.45)'; ctx.fillRect(0, 0, W, H);
  const bob = Math.sin(time * 2) * 4;
  text('WALL', W / 2, 130 + bob, 58, '#ffd84a');
  text('PLAY', W / 2, 186 + bob, 58, '#ff6b5e');
  text('прыгай от стены к стене', W / 2, 220, 14, '#cfc6e0', 'center', false);
  if (best > 0) text('РЕКОРД: ' + best + ' м', W / 2, 270, 18);
  coinIcon(W / 2 - 30, 296);
  text(String(bank), W / 2 - 18, 302, 16, '#ffd84a', 'left');
  const a = 0.55 + Math.sin(time * 5) * 0.45;
  ctx.globalAlpha = a;
  text('НАЖМИ, ЧТОБЫ ИГРАТЬ', W / 2, H - 170, 20);
  ctx.globalAlpha = 1;
  const b = BTN.shop;
  ctx.fillStyle = '#ff6b5e'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = '#c4443a'; ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4);
  text('ГЕРОИ', W / 2, b.y + 25, 16);
  text('Тап — прыжок · Тап в воздухе — разворот', W / 2, H - 50, 11, '#9d93b2', 'center', false);
  text('Пробел / ↑ · P — пауза · M — звук', W / 2, H - 34, 11, '#9d93b2', 'center', false);
  drawMuteBtn();
}

function drawShop() {
  ctx.fillStyle = 'rgba(10,6,18,0.88)'; ctx.fillRect(0, 0, W, H);
  text('ГЕРОИ', W / 2, 80, 36, '#ffd84a');
  coinIcon(W / 2 - 30, 112);
  text(String(bank), W / 2 - 18, 118, 16, '#ffd84a', 'left');
  for (let i = 0; i < SKINS.length; i++) {
    const r = shopRect(i), s = SKINS[i];
    const sel = i === skinIdx, own = owned.includes(i);
    ctx.fillStyle = sel ? '#3d2f57' : '#231a33'; ctx.fillRect(r.x, r.y, r.w, r.h);
    if (sel) { ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 2; ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2); }
    // превью героя
    const px = r.x + 32, py = r.y + 32;
    ctx.fillStyle = s.body; ctx.fillRect(px - 8, py - 14, 16, 13); ctx.fillRect(px - 7, py - 2, 14, 12);
    ctx.fillStyle = s.skin; ctx.fillRect(px - 4, py - 10, 11, 5);
    ctx.fillStyle = '#111'; ctx.fillRect(px + 2, py - 9, 2, 3); ctx.fillRect(px + 5, py - 9, 2, 3);
    ctx.fillStyle = s.band; ctx.fillRect(px - 8, py - 13, 16, 3); ctx.fillRect(px - 14, py - 12, 6, 2);
    text(s.name, r.x + 62, r.y + 36, 17, '#fff', 'left');
    if (own) text(sel ? 'ВЫБРАН' : 'ВЫБРАТЬ', r.x + r.w - 12, r.y + 36, 13, sel ? '#ffd84a' : '#cfc6e0', 'right', false);
    else { coinIcon(r.x + r.w - 60, r.y + 31, 6); text(String(s.cost), r.x + r.w - 50, r.y + 36, 14, bank >= s.cost ? '#ffd84a' : '#7d728f', 'left', false); }
  }
  text('нажми за пределами, чтобы выйти', W / 2, H - 40, 12, '#9d93b2', 'center', false);
}

function drawOver() {
  const a = clamp((deadT - 0.8) * 4, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(10,6,18,0.7)'; ctx.fillRect(0, 0, W, H);
  text('ПАДЕНИЕ!', W / 2, 170, 40, '#ff6b5e');
  const m = heightM();
  text(m + ' м', W / 2, 250, 54);
  if (m >= best && m > 0) text('НОВЫЙ РЕКОРД!', W / 2, 284, 18, '#ffd84a');
  else text('рекорд: ' + best + ' м', W / 2, 284, 16, '#cfc6e0');
  coinIcon(W / 2 - 34, 324);
  text('+' + coinsRun, W / 2 - 22, 330, 18, '#ffd84a', 'left');
  text('отскоков: ' + kicks, W / 2, 364, 14, '#cfc6e0', 'center', false);
  if (deadT > 1.2) {
    ctx.globalAlpha = a * (0.55 + Math.sin(time * 5) * 0.45);
    text('НАЖМИ, ЧТОБЫ ПРОДОЛЖИТЬ', W / 2, H - 140, 18);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  const z = zoneColors();
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 14);
  drawBackground(z);
  drawHeightMarks();
  drawGround();
  drawWalls(z);
  drawEnts();
  if (state !== 'over' || p.y - camY < H + 50) drawHero();
  drawParts();
  // виньетка
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.restore();
  drawHUD();
  if (state === 'menu') drawMenu();
  if (state === 'shop') drawShop();
  if (state === 'over') drawOver();
}

// ---------- Цикл ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  // фиксированные подшаги для стабильной физики
  const steps = Math.ceil(dt / (1 / 120));
  for (let i = 0; i < steps; i++) update(dt / steps);
  draw();
  requestAnimationFrame(frame);
}
reset();
window.__game = { get state() { return state; }, get p() { return p; }, tap, heightM };
requestAnimationFrame(frame);
})();
</script>
</body>
