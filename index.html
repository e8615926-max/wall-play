// надстрочные и подстрочные знаки (из NFD-разложения): строки над буквой (y=-2) или под ней (y=7)
const MARKS = {
  '́': { y: -2, r: ['...#.', '..#..'] }, '̀': { y: -2, r: ['.#...', '..#..'] },
  '̂': { y: -2, r: ['..#..', '.#.#.'] }, '̃': { y: -2, r: ['.#..#', '#.##.'] },
  '̈': { y: -2, r: ['.#.#.', '.....'] }, '̇': { y: -2, r: ['..#..', '.....'] },
  '̆': { y: -2, r: ['#...#', '.###.'] }, '̌': { y: -2, r: ['.#.#.', '..#..'] },
  '̊': { y: -2, r: ['..#..', '.#.#.'] },
  '̧': { y: 7, r: ['..#..', '.##..'] }, '̨': { y: 7, r: ['...#.', '....#'] },
};
const GLYPHS = {};
for (const k in GLYPH_SRC) GLYPHS[k] = GLYPH_SRC[k].split('|');
function glyph(ch) { if (GLYPH_ALIAS[ch]) ch = GLYPH_ALIAS[ch]; return GLYPHS[ch] || GLYPHS['?']; }
const textCache = new Map();
function textCanvas(s, k, color, outline) {
  const key = s + '|' + k + '|' + color + '|' + outline;
  let c = textCache.get(key);
  if (c) return c;
  if (textCache.size > 500) textCache.clear();
  const cells = [];
  for (const ch of s.normalize('NFD')) {
    if (MARKS[ch]) { if (cells.length) cells[cells.length - 1].m.push(MARKS[ch]); continue; }
    cells.push({ g: glyph(ch), m: [] });
  }
  const o = outline ? k : 0, top = 2 * k, bot = 2 * k;
  c = document.createElement('canvas');
  c.width = Math.max(1, cells.length * 6 * k - k + o * 2);
  c.height = top + 7 * k + bot + o * 3;
  const g = c.getContext('2d');
  const pass = (col, grow) => {
    g.fillStyle = col;
    const px = (x, y) => { if (grow) g.fillRect(x - k, y - k, k * 3, k * 4); else g.fillRect(x, y, k, k); };
    cells.forEach((cell, i) => {
      const x0 = o + i * 6 * k, y0 = o + top;
      for (let r = 0; r < 7; r++) for (let q = 0; q < 5; q++) if (cell.g[r][q] === '#') px(x0 + q * k, y0 + r * k);
      for (const m of cell.m) for (let r = 0; r < 2; r++) for (let q = 0; q < 5; q++) if (m.r[r][q] === '#') px(x0 + q * k, y0 + (m.y + r) * k);
    });
  };
  if (outline) pass(outline, true);
  pass(color, false);
  textCache.set(key, c);
  return c;
}
// y — нижняя линия букв; если не влезает — шрифт уменьшается
function text(s, x, y, k, color = '#fff', align = 'center', outline = OL, maxW = W - 12) {
  const str = String(s).toUpperCase();
  let c = textCanvas(str, k, color, outline);
  if (c.width > maxW && k > 1) return text(s, x, y, k - 1, color, align, outline, maxW);
  const dx = align === 'center' ? x - c.width / 2 : align === 'right' ? x - c.width : x;
  ctx.drawImage(c, Math.round(dx), Math.round(y - c.height + 2 * k));
  return c.width;
}

let ac = null, master = null, musicGain = null, sfxBus = null, noiseBuf = null;
function applyVolumes() {
  if (!ac) return;
  master.gain.value = muted ? 0 : 1;
  musicGain.gain.value = SET.music ? 0.55 : 0;
  sfxBus.gain.value = SET.sfx ? 1 : 0;
}
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.connect(master);
      sfxBus = ac.createGain(); sfxBus.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      applyVolumes();
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function note(f0, f1, t, dur, type, vol, dest) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxBus);
  o.start(t); o.stop(t + dur + 0.02);
}
function tone(f0, f1, dur, type = 'square', vol = 0.08, delay = 0) {
  if (!audio()) return;
  note(f0, f1, ac.currentTime + delay, dur, type, vol);
}
function noiseAt(t, dur, vol, dest, hp, lp) {
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = noiseBuf;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = s;
  if (hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; node.connect(f); node = f; }
  if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; node.connect(f); node = f; }
  node.connect(g); g.connect(dest || sfxBus);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function noise(dur, vol, hp, lp, delay = 0) { if (audio()) noiseAt(ac.currentTime + delay, dur, vol, sfxBus, hp, lp); }

const heightM = () => Math.max(0, Math.floor((-PH / 2 - minY) / PX_PER_M));

// ---------- Генерация: столбы вразброс, без тупиков ----------
function kindFor(m, d, mode, prev, zi) {
  const z = ZONES[zi];
  const o = { log: 3 };
  const k = prev.kind === 'log' ? 1 : 0.4;   // после особого столба — передышка
  if (m > 20) o.thorn = (0.7 + d) * k;
  if (m > 30 && mode === 'cross' && prev.kind !== 'jelly') o.jelly = 0.6;
  if (m > 35) o.honey = 0.5;
  if (m > 40) o.crumble = (0.6 + d * 0.5) * k;
  if (m > 55) o.ice = 0.5 * (z.ice || 1) * k;
  if (m > 60) o.spring = 0.45;
  if (m > 70) o.lift = 0.4;
  if (m > 80 && mode === 'cross') o.rotor = (0.7 + d) * k;
  if (m > 90 && mode === 'cross') o.electric = (0.5 + d * 0.6) * k;
  if (m > 100) o.blink = (0.5 + d * 0.5) * k;
  if (m > 110 && mode === 'cross') o.portal = 0.35;
  if (m > 120 && mode === 'cross') o.move = (0.6 + d * 0.5) * k;
  return pick(o);
}

function overlapsPole(x, y0, y1, minDx, except) {
  return poles.some(q => q !== except && Math.abs(q.baseX - x) < minDx && q.y0 < y1 + 30 && q.y1 > y0 - 30);
}

// После крутилки игрок может оказаться с любой стороны: ставим два столба — слева и справа
function addRotorPair(r) {
  const f = r.face, g = even(rand(84, 94)), zi = r.zone;
  const y1 = r.y1 - 10;
  const main = makePole(r.cx + f * g, Math.min(y1 - 140, r.y0 - 180), y1, 'log', -f, zi);
  const mirror = makePole(r.cx - f * g, r.y0 - 110, y1, 'log', f, zi);
  poles.push(main, mirror);
  pathPrev = r; path = main;
  for (let i = 0; i < 3; i++) ents.push({ type: 'coin', x: r.cx, y: r.y0 - 50 - i * 22, r: 8, t: i * 0.3 });
}

function addPathPole() {
  const cur = path;
  if (cur.kind === 'rotor' && !cur.paired) { cur.paired = true; addRotorPair(cur); return; }
  const m = -cur.y0 / PX_PER_M, d = diffAt(m), zi = zoneIdxAt(m);
  let len = even(Math.max(84, rand(120, 260) * (1 - 0.35 * d)));
  const dir = cur.face;   // игрок висит на грани face и прыгает в эту же сторону
  const cx = cur.baseX;
  const canStack = cur.kind === 'log' || cur.kind === 'honey' || cur.kind === 'thorn';
  let mode = canStack && Math.random() < 0.22 ? 'stack' : 'cross';
  let x, y1, face;
  if (mode === 'cross') {
    let lo, hi;
    if (dir > 0) { lo = Math.max(cx + 84, 114); hi = Math.min(cx + 204, W - 30); }
    else { lo = Math.max(cx - 204, 30); hi = Math.min(cx - 84, W - 114); }
    y1 = even(cur.y0 + (cur.y1 - cur.y0) * rand(0.25, 0.6));
    // после желе игрок отлетает назад — новый столб выше прошлого
    if (cur.kind === 'jelly' && pathPrev) y1 = Math.min(y1, pathPrev.y0 - 30);
    x = null;
    for (let tries = 0; tries < 8 && hi >= lo; tries++) {
      const cand = even(rand(lo, hi));
      if (!overlapsPole(cand, y1 - len, y1, 40, cur)) { x = cand; break; }
    }
    if (x === null) mode = 'stack'; else face = -dir;
  }
  if (mode === 'stack') { x = cx; y1 = even(cur.y0 - rand(30, 64)); face = cur.face; }
  let kind = kindFor(m, d, mode, cur, zi);
  if (kind === 'rotor' && (x < 124 || x > W - 124)) kind = 'thorn';

function populate(cur, pl, mode, m, d, zi) {
  if (m > 1 && Math.random() < 0.7) {
    if (mode === 'cross') {
      const xa = cur.cx + cur.face * 30, xb = pl.cx - cur.face * 30;
      const yb = clamp(cur.y0 + 30, pl.y0 + 20, pl.y1 - 10);
      for (let i = 0; i < 4; i++) {
        const t = (i + 0.5) / 4;
        ents.push({ type: 'coin', x: lerp(xa, xb, t), y: lerp(cur.y0 + 40, yb, t) - Math.sin(t * Math.PI) * 40, r: 8, t: i * 0.3 });
      }
    } else {
      for (let i = 0; i < 3; i++) ents.push({ type: 'coin', x: cur.cx + cur.face * 44, y: cur.y0 - 10 - i * 24, r: 8, t: i * 0.3 });
    }

  if (m > 40 && Math.random() < 0.05) ents.push({ type: 'shield', x: (cur.cx + pl.cx) / 2, y: pl.y0 - 30, r: 11, t: 0 });
  else if (m > 30 && Math.random() < 0.05) ents.push({ type: 'magnet', x: (cur.cx + pl.cx) / 2, y: pl.y0 - 30, r: 11, t: 0 });
}

function spawnEnemy(type, cur, pl, d, look) {

  if (type === 'bee') ents.push({ type, look: lk, x: rand(40, W - 40), y, baseY: y, r: 9, vx: (Math.random() < 0.5 ? -1 : 1) * (55 + 85 * d), minX: 24, maxX: W - 24, t: rand(0, 6) });

function zoneBlend() {

function colAt(wy) {

function drawBushColumn(b, skyCol) {

  const step = 14, first = Math.floor((off - 40) / step), lastK = Math.ceil((off + H + 40) / step);
  for (let k = first; k <= lastK; k++) {
    const wy = k * step, { c, hw } = colAt(wy), sy = wy - off;
    for (const s of [-1, 1]) { const r = 9 + hash2(k, s + 3) * 7; pell(ctx, c + s * (hw + hash2(k, s) * 6) + s * 2, sy + 3, r + 2, r + 2, bushD); }

  for (let sy = -8; sy <= H + 8; sy += 8) { const { c, hw } = colAt(sy + off); ctx.lineTo(even(c - hw), sy); }

function drawOrb(o, a) {

    ctx.fillStyle = o.col; ctx.globalAlpha = a * 0.18;

    pell(ctx, x - r * 0.35, y - r * 0.35, r * 0.3, r * 0.3, o.col);
  } else if (o.kind === 'moon') {

function drawBackground() {
  const b = zoneBlend();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const top = b.t > 0 ? mix(b.z.sky[0], b.n.sky[0], b.t) : b.z.sky[0];
  const bot = b.t > 0 ? mix(b.z.sky[1], b.n.sky[1], b.t) : b.z.sky[1];

  for (let i = poles.length - 1; i >= 0; i--) {
    const pl = poles[i];
    pl.t += dt;
    if (pl.wob > 0) pl.wob = Math.max(0, pl.wob - dt * 2);
    if (pl.kind === 'move') {
      const nx = pl.baseX + Math.sin(pl.t * pl.spd) * pl.amp, dx = nx - pl.cx;
      pl.cx = nx; pl.x0 = nx - 7; pl.x1 = nx + 7;
      if ((p.state === 'wall' && p.pole === pl) || (p.state === 'ground' && p.stand === pl)) p.x += dx;
    }
    if (pl.kind === 'rotor') {
      if (pl.flipA < 0) {
        const before = Math.ceil(pl.timer);
        pl.timer -= dt;
        if (Math.ceil(pl.timer) !== before && pl.timer > 0 && pl.timer < 3 && onScreen(pl) && state === 'play') sfx.tick();
        if (pl.timer <= 0) { pl.flipA = 0; pl.flipped = false; if (onScreen(pl) && state === 'play') sfx.rotor(); }
      } else {
        pl.flipA += dt / 0.4;
        if (pl.flipA >= 0.5 && !pl.flipped) {
          pl.flipped = true;
          pl.thorn = -pl.thorn;
          // игрок на столбе — его переносит на другую сторону вместе с поворотом
          if (p.state === 'wall' && p.pole === pl && thornHits(pl, p.side)) {
            p.x = 2 * pl.cx - p.x; p.side = -p.side; p.face = -p.face;
            dust(p.x + p.side * PW / 2, p.y, -p.side);
            unlock('rotor');
          }
        }
        if (pl.flipA >= 1) { pl.flipA = -1; pl.timer = ROTOR_PERIOD; }
      }
    }
    if (pl.kind === 'blink') {
      // исчезающий кристалл: 3.2 с есть, 1 с нет
      const was = pl.solid;
      pl.solid = (pl.t % 4.2) < 3.2;
      if (was && !pl.solid) {
        burst(pl.cx, (pl.y0 + pl.y1) / 2, 10, '#c8b0ff', 120, 0.5, 4, 0);
        if (p.pole === pl && p.state === 'wall') { p.state = 'air'; p.vx = 0; p.vy = 0; p.pole = null; }
        if (p.stand === pl && p.state === 'ground') { p.state = 'air'; p.vy = 0; p.stand = null; }
      }
    }
    if (pl.kind === 'electric') {
      // ток: 2.6 с выключен, 0.5 с искрит, 1.1 с бьёт
      const ph = pl.t % 4.2, was = pl.zap;
      pl.zap = ph >= 3.1; pl.warnZ = ph >= 2.6 && ph < 3.1;
      if (pl.zap && !was && onScreen(pl) && state === 'play') sfx.zap();
      if (pl.zap && state === 'play' && p.state === 'wall' && p.pole === pl) die('zap');
      if (pl.warnZ && SET.fx && Math.random() < dt * 20) parts.push({ x: pl.cx + rand(-10, 10), y: rand(pl.y0, pl.y1), vx: rand(-60, 60), vy: rand(-60, 60), life: 0.2, max: 0.2, color: '#fff6a0', size: 2, grav: 0 });
    }
    if (pl.kind === 'crumble' && pl.crT >= 0) {
      pl.crT -= dt;
      if (pl.crT <= 0) {
        for (let y = pl.y0; y < pl.y1; y += 12) burst(pl.cx, y, 2, '#d0a070', 120, 0.9, 6, 900);
        sfx.crack();
        poles.splice(i, 1);
        if (p.pole === pl) { p.pole = null; if (p.state === 'wall') { p.state = 'air'; p.vx = 0; p.vy = 0; } }
        if (p.stand === pl) { p.stand = null; if (p.state === 'ground') { p.state = 'air'; p.vy = 0; } }
        for (const b of birds) if (b.st === 'perch' && Math.abs(b.x - pl.cx) < 10 && Math.abs(b.y - pl.y0) < 4) { b.st = 'fly'; b.vx = 120; b.vy = -100; }

}

function updatePlayer(dt) {
  if (p.inv > 0) p.inv -= dt;
  if (p.magnet > 0) p.magnet -= dt;
  if (p.noGrab > 0) p.noGrab -= dt;
  p.squash *= Math.pow(0.0005, dt);
  const S = solidsNear(p.y - 200, p.y + 200);
  const sk = curSkin();
  if (p.state === 'wall') {
    const kind = p.pole ? p.pole.kind : 'log';
    const ice = kind === 'ice', lift = kind === 'lift';
    if (p.stick > 0) { p.stick -= dt; p.vy = 0; }
    else if (lift) p.vy = -LIFT_SPEED;                        // лифт везёт наверх
    else if (kind === 'honey') p.vy = 0;                      // мёд держит на месте
    else p.vy += ((ice ? ICE_SLIDE : SLIDE) - p.vy) * Math.min(1, dt * (ice ? 2 : 5));
    const hy = moveY(S, p.vy * dt);
    if (hy && hy.dir > 0) p.vy = 0;
    if (thornHits(p.pole, p.side)) { die('thorn'); return; }
    if (kind === 'honey' && SET.fx && Math.random() < dt * 2) parts.push({ x: p.x + p.side * PW / 2, y: p.y + 6, vx: 0, vy: 20, life: 0.8, max: 0.8, color: '#ffb21a', size: 4, grav: 200 });
    const f = faceAt(S, p.side);
    if (!f || f === GROUND) {
      p.state = 'air'; p.vx = 0; p.pole = null;
      p.vy = lift ? -380 : Math.max(0, p.vy);   // с верха лифта — подскок
    } else {
      p.pole = f;
      if (p.vy > 10 && SET.fx && Math.random() < dt * (ice ? 30 : 10))
        parts.push({ x: p.x + p.side * PW / 2, y: p.y + PH / 2 - 4, vx: -p.side * rand(5, 30), vy: rand(-20, 0), life: 0.3, max: 0.3, color: ice ? '#dff4ff' : '#ffffff', size: 2, grav: 0 });
    }
    if (sk.r === 3) spawnTrail(sk, 5, dt);
  } else if (p.state === 'ground') {
    if (!onGround(S)) { p.state = 'air'; p.vx = 0; p.vy = 0; p.stand = null; }
  }
  if (p.state === 'air') {
    let g = G * (ZONES[zoneIdx].grav || 1);
    if (p.holdT > 0) {
      if (held && p.vy < 0) { g *= HOLD_G; p.holdT -= dt; if (SET.fx && Math.random() < dt * 30) parts.push({ x: p.x + rand(-6, 6), y: p.y + PH / 2, vx: 0, vy: 40, life: 0.25, max: 0.25, color: '#fff6a0', size: 4, grav: 0 }); }
      else p.holdT = 0;
    }
    p.vy = Math.min(MAX_FALL, p.vy + g * dt);
    if (p.spin > 0) {
      p.spin -= dt * 2.2;
      p.rot = (1 - Math.max(0, p.spin)) * Math.PI * 2 * p.face;
      if (p.spin <= 0) { p.spin = 0; p.rot = 0; }
    }
    spawnTrail(sk, 40, dt);
    const hx = moveX(S, p.vx * dt);
    if (hx) {
      if (hx.edge) { p.vx = 0; p.face = p.x < W / 2 ? 1 : -1; }
      else if (hx.s === GROUND) p.vx = 0;
      else grab(hx.s, hx.dir);
    }
    if (p.state === 'air') {
      const hy = moveY(S, p.vy * dt);
      if (hy) {
        if (hy.dir > 0) land(hy.s);
        else { p.vy = 30; p.holdT = 0; sfx.bonk(); }
      }
      if (p.state === 'air' && p.vx === 0 && !(p.noGrab > 0)) {
        let f = faceAt(S, -1);
        if (f && f !== GROUND) grab(f, -1);
        else { f = faceAt(S, 1); if (f && f !== GROUND) grab(f, 1); }
      }
    }
  }
  if (state !== 'play') return;
  p.trail.unshift({ x: p.x, y: p.y, rot: p.rot }); if (p.trail.length > 10) p.trail.length = 10;
  if (p.y < minY) minY = p.y;
  if (p.y - PH / 2 > camY + H) die('fall');
}

function updateEnts(dt) {
  const hb = { x0: p.x - PW / 2 + 3, x1: p.x + PW / 2 - 3, y0: p.y - PH / 2 + 4, y1: p.y + PH / 2 - 2 };
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];
    e.t += dt;
    if (e.type === 'bee') {
      e.x += e.vx * dt;
      if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
      if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); }
      e.y = e.baseY + Math.sin(e.t * 4) * 10;
    } else if (e.type === 'spiky') {
      e.x = e.cx + Math.sin(e.t * e.spd) * e.amp;
    } else if (e.type === 'bat') {
      e.x = e.cx + Math.sin(e.t * 1.7) * e.amp; e.y = e.baseY + Math.sin(e.t * 3.4) * 28;
    } else if (e.type === 'snail') {
      if (!poles.includes(e.pole)) { ents.splice(i, 1); continue; }
      e.y += e.vy * dt;
      if (e.y < e.pole.y0 + 10) { e.y = e.pole.y0 + 10; e.vy = Math.abs(e.vy); }
      if (e.y > e.pole.y1 - 10) { e.y = e.pole.y1 - 10; e.vy = -Math.abs(e.vy); }
      e.x = e.side < 0 ? e.pole.x0 - 7 : e.pole.x1 + 7;
    } else if (e.type === 'cone') {
      if (e.st === 'idle' && state === 'play' && p.y < e.triggerY + H * 0.4) { e.st = 'warn'; e.warn = 0.9; sfx.warn(); }
      else if (e.st === 'warn') { e.warn -= dt; if (e.warn <= 0) { e.st = 'fall'; e.y = camY - 30; e.vy = 240; } }

    } else if (e.type === 'hawk') {
      if (e.st === 'idle' && state === 'play' && p.y < e.triggerY + 80) { e.st = 'warn'; e.warn = 1.0; sfx.warn(); }
      else if (e.st === 'warn') { e.y = p.y; e.warn -= dt; if (e.warn <= 0) { e.st = 'fly'; e.x = e.from < 0 ? -30 : W + 30; e.vx = -e.from * 290; } }
      else if (e.st === 'fly') { e.x += e.vx * dt; if (e.x < -60 || e.x > W + 60) { ents.splice(i, 1); continue; } }
    } else if (e.type === 'ghost') {
      if (e.st === 'idle' && state === 'play' && p.y < e.triggerY + H * 0.5) { e.st = 'chase'; e.y = camY - 20; }
      else if (e.st === 'chase') {
        const dx = p.x - e.x, dy = p.y - e.y, dd = Math.hypot(dx, dy) || 1;

      }

    if (state !== 'play') continue;
    if ((e.type === 'cone' && e.st !== 'fall') || (e.type === 'hawk' && e.st !== 'fly') || (e.type === 'ghost' && (e.st !== 'chase' || e.life < 0.6))) continue;
    const cx = clamp(e.x, hb.x0, hb.x1), cy = clamp(e.y, hb.y0, hb.y1);
    if ((e.x - cx) ** 2 + (e.y - cy) ** 2 >= e.r * e.r) continue;

      combo++; comboT = 1.2; coinsRun++;
      if (coinsRun >= 30) unlock('coins30');
      burst(e.x, e.y, 6, '#ffe24a', 120, 0.4, 4, 0);
      sfx.coin(); ents.splice(i, 1);
    } else if (e.type === 'gem') {
      gems++; store.set('gems', gems);
      burst(e.x, e.y, 10, '#7ad8ff', 140, 0.5, 4, 0, 'star');
      sfx.gem(); ents.splice(i, 1);
    } else if (e.type === 'shield' || e.type === 'magnet') {
      if (e.type === 'shield') p.shield = 1; else p.magnet = 8;

}

function updateBirds(dt) {
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.t += dt;
    if (b.st === 'perch') {
      if (Math.random() < dt * 0.5) b.dir = -b.dir;
      if (p && (state === 'play' || state === 'dead') && Math.abs(p.x - b.x) < 80 && Math.abs(p.y - b.y) < 90) {
        b.st = 'fly'; b.vx = (b.x < p.x ? -1 : 1) * rand(90, 150); b.vy = -rand(60, 120); b.dir = Math.sign(b.vx);
        sfx.bird();
      }
      if (b.y > camY + H + 200) birds.splice(i, 1);
    } else {
      b.vy -= 260 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < camY - 60 || b.x < -30 || b.x > W + 30) birds.splice(i, 1);
    }
  }
}

// Погода зоны: листья, снег, пузыри, угольки, песок, звёзды
function spawnWeather(fx, cols) {
  const col = cols[Math.floor(Math.random() * cols.length)];
  const w = { x: rand(0, W), y: camY - 10, vx: rand(-15, 15), vy: rand(30, 60), t: rand(0, 6), col, kind: fx, life: 9 };
  if (fx === 'snow') { w.vy = rand(25, 50); }
  else if (fx === 'bubble') { w.y = camY + H + 10; w.vy = -rand(50, 90); }
  else if (fx === 'ember') { w.y = camY + H + 10; w.vy = -rand(60, 120); w.col = ['#ffd23a', '#ff8a1e', '#ff3a1a'][Math.floor(Math.random() * 3)]; }
  else if (fx === 'sand') { w.x = -10; w.y = camY + rand(0, H); w.vx = rand(150, 230); w.vy = rand(-10, 10); }
  else if (fx === 'star') { w.y = camY + rand(0, H); w.vx = 0; w.vy = 0; w.life = 1.4; }
  else if (fx === 'firefly') { w.y = camY + rand(0, H); w.vx = rand(-20, 20); w.vy = rand(-20, 20); w.life = 3; }
  else if (fx === 'rain') { w.x = rand(0, W + 120); w.vx = -120; w.vy = rand(520, 700); }
  leaves.push(w);
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }
  const z = ZONES[zoneIdxAt(state === 'play' || state === 'dead' || state === 'over' ? heightM() : 0)];
  const rate = z.fx === 'rain' ? 30 : z.fx === 'sand' ? 14 : z.fx === 'star' ? 6 : z.fx === 'bubble' ? 5 : z.fx === 'firefly' ? 4 : 3;
  if (SET.fx && Math.random() < dt * rate) spawnWeather(z.fx, z.leaf);
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.t += dt; l.life -= dt;
    const sway = l.kind === 'sand' || l.kind === 'star' || l.kind === 'rain' ? 0 : l.kind === 'snow' ? 12 : l.kind === 'firefly' ? 15 : 25;
    l.x += (l.vx + Math.sin(l.t * 2) * sway) * dt; l.y += l.vy * dt;
    if (l.life <= 0 || l.y > camY + H + 20 || l.y < camY - 30 || l.x > W + 20) leaves.splice(i, 1);
  }
  if (toasts.length) { toasts[0].t += dt; if (toasts[0].t > 2.8) toasts.shift(); }
}

const LOAD_STEPS = [
  ...ZONES.map((z, i) => () => farTile(i)),
  ...SKINS.map(k => () => heroSprite(k, 'idle', 0, false)),
  () => { for (const n of T('zones')) textCanvas(n, 2, '#ffffff', OL); },
  () => { for (const t of T('tips')) textCanvas(t, 2, '#ffffff', OL); },
];
const LOAD_MIN = 2.4;
const loadProgress = () => Math.min(loadStep / LOAD_STEPS.length, loadT / LOAD_MIN);
function updateLoad(dt) {
  loadT += dt;
  if (loadStep < LOAD_STEPS.length) LOAD_STEPS[loadStep++]();
  if (loadProgress() >= 1 && loadT > LOAD_MIN + 0.3) { state = 'menu'; fadeT = 0.6; }
}

function update(dt) {
  time += dt;
  if (fadeT > 0) fadeT -= dt;
  if (flashT > 0) flashT -= dt;
  if (state === 'load') { updateLoad(dt); return; }
  if (chest) chest.t += dt;
  if (modal) modal.t += dt;
  updateWheel(dt);
  if (state === 'menu' && !dailyShown) { dailyShown = true; if (canClaim()) modal = { kind: 'daily', t: 0 }; }
  blinkT -= dt; if (blinkT < -0.12) blinkT = rand(2, 4);
  if (paused && state === 'play') return;
  updateParts(dt);
  updateBirds(dt);
  updatePoles(dt);
  if (state === 'menu' || state === 'shop' || state === 'ach' || state === 'set') return;
  if (state === 'play') updatePlayer(dt);
  else {
    deadT += dt;
    p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 10;
    if (deadT > 0.9 && state === 'dead') state = 'over';
  }
  if (state === 'play') {
    const target = p.y - H * 0.58;
    if (target < camY) camY += (target - camY) * Math.min(1, dt * 6);
  }
  camR = even(camY);
  const m = heightM();
  const zi = zoneIdxAt(m);
  if (zi !== zoneIdx) {
    zoneIdx = zi; banner = { zi, t: 2.6 }; sfx.zone();
    zonesSeen++; if (zonesSeen >= 5) unlock('zone5');
  }
  if (m >= 100) unlock('m100');
  if (m >= 250) unlock('m250');
  if (m >= 500) unlock('m500');
  if (m >= 1000) unlock('m1000');
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  updateEnts(dt);
  generate();
  if (shake > 0) shake -= dt;
}

// ---------- Отрисовка мира ----------
function poleColors(pl) {
  const z = ZONES[pl.zone];
  switch (pl.kind) {
    case 'ice': return ['#bfe8ff', '#5aa0d8', '#ffffff'];
    case 'crumble': return ['#d0a070', '#7a4a24', '#f0c890'];
    case 'blink': return ['#9a7aff', '#5a3ac0', '#e0d0ff'];
    case 'lift': return ['#a8b0c0', '#5a6078', '#e8eef8'];
    case 'electric': return ['#6a7090', '#2a3048', '#b8c0d8'];
    case 'spring': return ['#c8d0e0', '#6a7090', '#ffffff'];
    case 'portal': case 'exit': return ['#8a3ad0', '#4a1a80', '#d0a0ff'];
    default: return [z.log, z.logD, z.logL];
  }
}
function drawThorns(face, y0, y1, dir) {
  prect(ctx, face - 2, y0, 4, y1 - y0, '#7a1a4a');
  const lens = [2, 6, 10, 6, 2];
  for (let y = y0 + 4; y + 10 <= y1 - 4; y += 10) {
    for (let i = 0; i < 5; i++) prect(ctx, dir > 0 ? face : face - lens[i], y + i * 2, lens[i], 2, i === 2 ? '#ff4a7a' : '#b02a6a');
    prect(ctx, dir > 0 ? face + 8 : face - 10, y + 4, 2, 2, '#ffffff');
  }
}
function drawJelly(pl) {
  const h = pl.y1 - pl.y0, pink = pl.seed % 2 === 1;
  const [base, dk, lt] = pink ? ['#ff6ad0', '#c02a90', '#ffd0f0'] : ['#4ae880', '#18a050', '#c8ffd8'];
  const wob = Math.sin(pl.t * 30) * pl.wob * 4 + Math.sin(pl.t * 3) * 1;
  const w = 16 + wob, x0 = pl.cx - w / 2;
  pell(ctx, pl.cx, pl.y0 + 6, w / 2 + 2, 8, OL); pell(ctx, pl.cx, pl.y1 - 6, w / 2 + 2, 8, OL);
  prect(ctx, x0 - 2, pl.y0 + 6, w + 4, h - 12, OL);
  ctx.globalAlpha = 0.92;
  pell(ctx, pl.cx, pl.y0 + 6, w / 2, 6, base); pell(ctx, pl.cx, pl.y1 - 6, w / 2, 6, base);
  prect(ctx, x0, pl.y0 + 6, w, h - 12, base);
  prect(ctx, x0 + w - 4, pl.y0 + 8, 4, h - 16, dk);
  prect(ctx, x0 + 2, pl.y0 + 6, 2, h - 14, lt);
  for (let k = 0; k < h / 30; k++) {
    const by = pl.y1 - 10 - ((pl.t * 18 + hash2(k, pl.seed) * h) % (h - 20));
    prect(ctx, pl.cx - 2 + (hash2(k, 3) - 0.5) * 6, by, 4, 4, lt);
  }
  ctx.globalAlpha = 1;
  prect(ctx, pl.cx - 4, pl.y0 + 4, 4, 2, '#ffffff');
}
function drawPole(pl) {
  if (pl.kind === 'jelly') { drawJelly(pl); return; }
  if (pl.kind === 'blink') {
    const ph = pl.t % 4.2;
    if (!pl.solid) {
      ctx.globalAlpha = 0.35;
      for (let y = pl.y0; y < pl.y1; y += 8) prect(ctx, pl.x0, y, 14, 2, '#e0d0ff');
      ctx.globalAlpha = 1;
      return;
    }
    if (ph > 2.4 && Math.sin(pl.t * 40) > 0) ctx.globalAlpha = 0.35;
  }
  drawPoleBody(pl);
  ctx.globalAlpha = 1;
}
function drawPoleBody(pl) {
  const [base, dk, lt] = poleColors(pl);
  const h = pl.y1 - pl.y0, cx = pl.cx;
  ctx.save();
  if (pl.flipA >= 0) { const sc = Math.max(0.12, Math.abs(Math.cos(pl.flipA * Math.PI))); ctx.translate(cx, 0); ctx.scale(sc, 1); ctx.translate(-cx, 0); }
  if (pl.crT > 0) ctx.translate(even(Math.sin(time * 70) * 2), 0);

  const x0 = pl.x0;

  prect(ctx, x0 + 10, pl.y0, 4, h, dk);
  prect(ctx, x0 + 2, pl.y0, 2, h, lt);

    prect(ctx, x0 - 2, pl.y0 - 2, 18, 4, '#ff3a3a');

  if (pl.kind === 'electric') {

}

function drawHeightMarks() {

  for (let k = Math.max(1, first); k < first + 5; k++) {
    const y = even(-PH / 2 - k * step);

    ctx.fillStyle = 'rgba(42,20,8,0.45)';

function drawBird(b) {
  const x = b.x, y = b.y, d = b.dir;
  const hop = b.st === 'perch' && Math.sin(b.t * 6) > 0.85 ? 2 : 0;
  const by = y - 8 - hop;
  pell(ctx, x, by, 7, 6, '#1a3a7a');
  pell(ctx, x, by, 5, 4, '#3ab0ff');
  pell(ctx, x + d, by + 1, 3, 2, '#c8ecff');
  pell(ctx, x + d * 4, by - 4, 4, 4, '#1a3a7a');
  pell(ctx, x + d * 4, by - 4, 3, 3, '#3ab0ff');
  prect(ctx, x + d * 5 - (d < 0 ? 2 : 0), by - 6, 2, 2, '#1a1010');
  prect(ctx, x + d * 7 - (d < 0 ? 4 : 0), by - 4, 4, 2, '#ffa020');
  if (b.st === 'fly') {
    const f = Math.sin(b.t * 30) > 0 ? -6 : 2;
    prect(ctx, x - 6, by + f, 10, 2, '#1a3a7a');
  } else {
    prect(ctx, x - d * 6 - (d > 0 ? 2 : 0), by, 4, 2, '#1a3a7a');
    prect(ctx, x - 2, y - 2, 2, 2, '#ffa020'); prect(ctx, x + 2, y - 2, 2, 2, '#ffa020');

}

function heroPose() {
  if (state === 'dead' || state === 'over') return 'fall';
  if (state !== 'play') return 'cling';
  if (p.state === 'wall') return 'cling';
  if (p.state === 'ground') return 'idle';
  if (p.spin > 0) return 'tuck';
  return p.vy < 0 ? 'jump' : 'fall';

  ctx.save(); ctx.translate(even(bx + bw * pr), by - 18); ctx.drawImage(hcv, -32, -36, 64, 64); ctx.restore();
  text(T('loading') + ' ' + Math.floor(pr * 100) + '%', W / 2, 500, 2, '#ffffff');
  text(T('tip'), W / 2, 600, 1, '#ffe24a');
  text(TIPS()[tipIdx % TIPS().length], W / 2, 624, 2, '#ffffff');
}

function draw() {
  if (state === 'load') { drawLoad(); return; }
  ctx.save();
  if (shake > 0) ctx.translate(even(rand(-1, 1) * shake * 14), even(rand(-1, 1) * shake * 14));
  drawBackground();
  ctx.save();
  ctx.translate(0, -camR);
  drawWorld();
  ctx.restore();
  ctx.restore();
  if (flashT > 0) { ctx.globalAlpha = clamp(flashT * 2.5, 0, 0.8); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHUD();
  if (state === 'menu') drawMenu();
  if (state === 'shop') drawShop();
  if (state === 'ach') drawAch();
  if (state === 'set') drawSettings();
  if (state === 'over') drawOver();
  if (modal) drawModal();
  if (chest) drawChest();
  drawToast();
  if (fadeT > 0) { ctx.globalAlpha = clamp(fadeT / 0.6, 0, 1); ctx.fillStyle = '#fff6d8'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ---------- Цикл ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  const steps = Math.ceil(dt / (1 / 120));
  for (let i = 0; i < steps; i++) update(dt / steps);
  draw();
  requestAnimationFrame(frame);
}
reset();
window.__game = { get state() { return state; }, get p() { return p; }, get poles() { return poles; }, press, release, heightM, setLang(l) { lang = l; } };
requestAnimationFrame(frame);

// Офлайн: кэшируем игру, если она открыта с сайта
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
