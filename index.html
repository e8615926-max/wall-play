function resize() {

  const dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  cv.width = Math.floor(W * scale * dpr);
  cv.height = Math.floor(H * scale * dpr);

}

function kindFor(m, d, mode, prev, zi) {

function overlapsPole(x, y0, y1, minDx, except) {

// ---------- Достижения ----------
function unlock(id) {
  if (achieved.includes(id)) return;
  const a = ACH.find(x => x.id === id);
  if (!a) return;
  achieved.push(id); store.set('ach', achieved);
  bank += a.reward; store.set('coins', bank);
  toasts.push({ a, t: 0 });
  sfx.ach();
}

// ---------- Управление ----------
function press() {
  if (state === 'load') { audio(); if (loadReady) finishLoad(); return; }
  audio(); startMusic();
  held = true;
  if (state === 'menu') { state = 'play'; doJump(); return; }
  if (state === 'over') { if (deadT > 1.3) { reset(); state = 'menu'; } return; }
  if (state !== 'play' || paused) return;
  doJump();
}
function release() { held = false; }

function doJump() {
  if (p.state === 'wall' || p.state === 'ground') {
    const dir = p.state === 'wall' ? -p.side : p.face;
    if (p.state === 'wall' && p.pole && p.pole.kind === 'crumble' && p.pole.crT > 0) unlock('crumble');
    p.vx = dir * JVX * (p.state === 'ground' ? 0.8 : 1);
    p.vy = JVY; p.state = 'air'; p.dj = true; p.face = dir; p.holdT = HOLD_MAX;
    p.squash = 1; p.pole = null; p.stand = null;
    dust(p.x - dir * PW / 2, p.y, dir);
    skinSfx('jump');
    if (tutStep === 0) tutStep = 1;
  } else if (p.state === 'air' && p.dj) {
    p.dj = false;
    p.vy = DJVY;
    p.vx = p.vx === 0 ? p.face * JVX : -Math.sign(p.vx) * JVX;  // сальто разворачивает героя
    p.face = Math.sign(p.vx);
    p.spin = 1; p.holdT = HOLD_MAX * 0.6;
    flips++;
    unlock('flip');
    if (flips >= 10) unlock('flips10');
    burst(p.x, p.y + 10, 10, '#ffffff', 110, 0.35, 4, 0);
    skinSfx('flip');
    if (tutStep === 1) { tutStep = 2; tutDone = true; store.set('tut', true); }
  }
}

function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.button !== undefined && e.button !== 0) return;
  if (uiClick(toGame(e))) return;
  press();
});
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('blur', release);
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
    e.preventDefault();
    if (e.repeat) return;
    if (modal) { modal = null; return; }
    if (chest) { if (chest.t > 1.8) chest = null; return; }
    if (state === 'shop' || state === 'ach' || state === 'set') { if (!wheel.spinning) state = 'menu'; return; }
    press();
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
  if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) release(); });
document.addEventListener('visibilitychange', () => {

  else if (ac && musicOn) ac.resume();
});

const BTN = {
  mute:  { x: W - 46, y: 12, w: 34, h: 34 },
  gear:  { x: 12, y: 12, w: 34, h: 34 },
  pause: { x: W - 46, y: 12, w: 34, h: 34 },
  shop:  { x: 24, y: 282, w: 150, h: 40 },
  store: { x: 186, y: 282, w: 150, h: 40 },
  wheel: { x: 24, y: 334, w: 150, h: 40 },
  ach:   { x: 186, y: 334, w: 150, h: 40 },
};
const inRect = (pt, r) => pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
function uiClick(pt) {
  if (state === 'load') { audio(); if (loadReady) finishLoad(); return true; }
  if (chest) { if (chest.t > 1.8) chest = null; return true; }
  if (modal) { modalClick(pt); return true; }
  if (state === 'shop') { shopClick(pt); return true; }
  if (state === 'ach') { state = 'menu'; sfx.click(); return true; }
  if (state === 'set') { setClick(pt); return true; }
  if (state !== 'play' && state !== 'dead' && inRect(pt, BTN.mute)) { audio(); toggleMute(); sfx.click(); return true; }
  if (state === 'play' && inRect(pt, BTN.pause)) { paused = !paused; return true; }
  if (state === 'play' && paused) { paused = false; return true; }
  if (state === 'menu') {
    const open = main => { audio(); startMusic(); state = 'shop'; shopMain = main; sfx.click(); return true; };
    if (inRect(pt, BTN.shop)) return open(0);
    if (inRect(pt, BTN.store)) return open(1);
    if (inRect(pt, BTN.wheel)) return open(2);
    if (inRect(pt, BTN.ach)) { audio(); startMusic(); state = 'ach'; sfx.click(); return true; }
    if (inRect(pt, BTN.gear)) { audio(); startMusic(); state = 'set'; resetArm = -10; sfx.click(); return true; }
  }
  return false;
}

        for (let y = pl.y0; y < pl.y1; y += 12) burst(pl.cx, y, 2, '#d0a070', 120, 0.9, 6, 900);

        if (p.pole === pl) { p.pole = null; if (p.state === 'wall') { p.state = 'air'; p.vx = 0; p.vy = 0; } }

}

function updatePlayer(dt) {
  if (p.inv > 0) p.inv -= dt;
  if (p.magnet > 0) p.magnet -= dt;
  if (p.noGrab > 0) p.noGrab -= dt;
  if (p.shieldPop > 0) p.shieldPop -= dt;
  p.squash *= Math.pow(0.0005, dt);
  const S = solidsNear(p.y - 200, p.y + 200);
  const sk = curSkin();
  if (p.state === 'wall') {
    const kind = p.pole ? p.pole.kind : 'log';
    const ice = kind === 'ice', lift = kind === 'lift';
    if (p.stick > 0) { p.stick -= dt; p.vy = 0; }
    else if (lift) p.vy = -LIFT_SPEED;                        // лифт везёт наверх
    else if (kind === 'honey') p.vy = 0;                      // мёд держит на месте
    else p.vy += ((ice ? ICE_SLIDE : SLIDE) - p.vy) * Math.min(1, dt * (ice ? 2 : 5));
    const hy = moveY(S, p.vy * dt);
    if (hy && hy.dir > 0) p.vy = 0;
    if (thornHits(p.pole, p.side)) { die('thorn'); return; }
    if (kind === 'honey' && SET.fx && Math.random() < dt * 2) parts.push({ x: p.x + p.side * PW / 2, y: p.y + 6, vx: 0, vy: 20, life: 0.8, max: 0.8, color: '#ffb21a', size: 4, grav: 200 });
    const f = faceAt(S, p.side);
    if (!f || f === GROUND) {
      p.state = 'air'; p.vx = 0; p.pole = null;
      p.vy = lift ? -380 : Math.max(0, p.vy);   // с верха лифта — подскок
    } else {
      p.pole = f;
      if (p.vy > 10 && SET.fx && Math.random() < dt * (ice ? 30 : 10))
        parts.push({ x: p.x + p.side * PW / 2, y: p.y + PH / 2 - 4, vx: -p.side * rand(5, 30), vy: rand(-20, 0), life: 0.3, max: 0.3, color: ice ? '#dff4ff' : '#ffffff', size: 2, grav: 0 });
    }
    if (sk.r === 3) spawnTrail(sk, 5, dt);
  } else if (p.state === 'ground') {
    if (!onGround(S)) { p.state = 'air'; p.vx = 0; p.vy = 0; p.stand = null; }
  }
  if (p.state === 'air') {
    let g = G * (ZONES[zoneIdx].grav || 1);
    if (p.holdT > 0) {
      if (held && p.vy < 0) { g *= HOLD_G; p.holdT -= dt; if (SET.fx && Math.random() < dt * 30) parts.push({ x: p.x + rand(-6, 6), y: p.y + PH / 2, vx: 0, vy: 40, life: 0.25, max: 0.25, color: '#fff6a0', size: 4, grav: 0 }); }
      else p.holdT = 0;
    }
    p.vy = Math.min(MAX_FALL, p.vy + g * dt);
    if (p.spin > 0) {
      p.spin -= dt * 2.2;
      p.rot = (1 - Math.max(0, p.spin)) * Math.PI * 2 * p.face;
      if (p.spin <= 0) { p.spin = 0; p.rot = 0; }
    }
    spawnTrail(sk, 40, dt);
    const hx = moveX(S, p.vx * dt);
    if (hx) {
      if (hx.edge) { p.vx = 0; p.face = p.x < W / 2 ? 1 : -1; }
      else if (hx.s === GROUND) p.vx = 0;
      else grab(hx.s, hx.dir);
    }
    if (p.state === 'air') {
      const hy = moveY(S, p.vy * dt);
      if (hy) {
        if (hy.dir > 0) land(hy.s);
        else { p.vy = 30; p.holdT = 0; sfx.bonk(); }
      }
      if (p.state === 'air' && p.vx === 0 && !(p.noGrab > 0)) {
        let f = faceAt(S, -1);
        if (f && f !== GROUND) grab(f, -1);

      }
    }
  }

  if (p.y < minY) minY = p.y;
  if (p.y - PH / 2 > camY + H) die('fall');
}

function updateEnts(dt) {

  for (let i = ents.length - 1; i >= 0; i--) {

      if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }

      else if (e.st === 'fall') { e.vy += 700 * dt; e.y += e.vy * dt; }
    } else if (e.type === 'hawk') {
      if (e.st === 'idle' && state === 'play' && p.y < e.triggerY + 80) { e.st = 'warn'; e.warn = 1.0; sfx.warn(); }
      else if (e.st === 'warn') { e.y = p.y; e.warn -= dt; if (e.warn <= 0) { e.st = 'fly'; e.x = e.from < 0 ? -30 : W + 30; e.vx = -e.from * 290; } }
      else if (e.st === 'fly') { e.x += e.vx * dt; if (e.x < -60 || e.x > W + 60) { ents.splice(i, 1); continue; } }
    } else if (e.type === 'ghost') {

        e.x += (dx / dd * 48 + Math.sin(e.t * 3) * 20) * dt; e.y += (dy / dd * 48) * dt;
        e.life -= dt;
        if (e.life <= 0) { burst(e.x, e.y, 8, '#ffffff', 80, 0.5, 4, 0); ents.splice(i, 1); continue; }
      }
    } else if (e.type === 'meteor') {
      if (e.st === 'idle' && state === 'play' && p.y < e.triggerY + H * 0.4) { e.st = 'warn'; e.warn = 0.9; e.sx = clamp(e.x - e.dir * 150, 20, W - 20); sfx.warn(); }
      else if (e.st === 'warn') { e.warn -= dt; if (e.warn <= 0) { e.st = 'fall'; e.x = e.sx; e.y = camY - 30; e.vx = e.dir * 170; e.vy = 360; } }
      else if (e.st === 'fall') {
        e.vy += 300 * dt; e.x += e.vx * dt; e.y += e.vy * dt;
        if (SET.fx && Math.random() < dt * 30) parts.push({ x: e.x, y: e.y, vx: rand(-20, 20), vy: -30, life: 0.4, max: 0.4, color: e.look === 'hail' ? '#e0f6ff' : e.look === 'comet' ? '#a0e0ff' : Math.random() < 0.5 ? '#ff8a1e' : '#ffd23a', size: 4, grav: 0 });
      }
    } else if (e.type === 'cloud') {
      e.x += e.vx * dt; if (e.x < 50 || e.x > W - 50) { e.vx = -e.vx; e.x = clamp(e.x, 50, W - 50); }
      const ph = (e.t + e.ph) % 3.2, was = e.strike;
      e.charge = ph > 2.1 && ph < 2.8; e.strike = ph >= 2.8;
      if (e.strike && !was && e.y < camY + H && e.y + 270 > camY && state === 'play') sfx.zap();
      if (e.strike && state === 'play' && !(p.inv > 0) && Math.abs(p.x - e.x) < 14 && p.y > e.y && p.y < e.y + 280) die('cloud');
    } else if (e.type === 'piranha') {
      if (e.st === 'idle' && state === 'play' && p.y < e.triggerY + H * 0.3) { e.st = 'jump'; e.y = camY + H + 30; e.x = clamp(p.x + rand(-60, 60), 30, W - 30); e.vy = -Math.sqrt(2 * 900 * H * 0.75); e.vx = rand(-40, 40); tone(300, 900, 0.15, 'sine', 0.05); }
      else if (e.st === 'jump') { e.vy += 900 * dt; e.x += e.vx * dt; e.y += e.vy * dt; if (e.vy > 0 && e.y > camY + H + 60) { ents.splice(i, 1); continue; } }
    } else if (e.type === 'orbit') {
      e.x = e.cx + Math.cos(e.t * e.spd) * e.rad; e.y = e.cy + Math.sin(e.t * e.spd) * e.rad;
    } else if (e.type === 'coin' && p.magnet > 0) {
      const dx = p.x - e.x, dy = p.y - e.y, dd = Math.hypot(dx, dy) || 1;
      if (dd < 150) { e.x += dx / dd * 420 * dt; e.y += dy / dd * 420 * dt; }
    }

    if (state !== 'play') continue;
    if ((e.type === 'cone' && e.st !== 'fall') || (e.type === 'hawk' && e.st !== 'fly') || (e.type === 'ghost' && (e.st !== 'chase' || e.life < 0.6))) continue;
    if ((e.type === 'meteor' && e.st !== 'fall') || (e.type === 'piranha' && e.st !== 'jump') || e.type === 'cloud') continue;
    const cx = clamp(e.x, hb.x0, hb.x1), cy = clamp(e.y, hb.y0, hb.y1);
    if ((e.x - cx) ** 2 + (e.y - cy) ** 2 >= e.r * e.r) continue;
    if (e.type === 'coin') {
      combo++; comboT = 1.2; coinsRun++;
      if (coinsRun >= 30) unlock('coins30');
      burst(e.x, e.y, 6, '#ffe24a', 120, 0.4, 4, 0);
      sfx.coin(); ents.splice(i, 1);
    } else if (e.type === 'gem') {
      gems++; store.set('gems', gems);

    } else if (e.type === 'shield' || e.type === 'magnet') {

    } else if (!(p.inv > 0)) {
      if (e.type === 'bee' || e.type === 'bat' || e.type === 'ghost' || e.type === 'piranha') { burst(e.x, e.y, 10, '#ffffff', 150, 0.5, 4); ents.splice(i, 1); }
      die(e.type);
    }
  }
}

function updateBirds(dt) {
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.t += dt;
    if (b.st === 'perch') {
      if (Math.random() < dt * 0.5) b.dir = -b.dir;
      if (p && (state === 'play' || state === 'dead') && Math.abs(p.x - b.x) < 80 && Math.abs(p.y - b.y) < 90) {
        b.st = 'fly'; b.vx = (b.x < p.x ? -1 : 1) * rand(90, 150); b.vy = -rand(60, 120); b.dir = Math.sign(b.vx);
        sfx.bird();

      if (b.y > camY + H + 200) birds.splice(i, 1);
    } else {
      b.vy -= 260 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < camY - 60 || b.x < -30 || b.x > W + 30) birds.splice(i, 1);
    }
  }
}

function spawnWeather(fx, cols) {

  const w = { x: rand(0, W), y: camY - 10, vx: rand(-15, 15), vy: rand(30, 60), t: rand(0, 6), col, kind: fx, life: 9 };

  else if (fx === 'rain') { w.x = rand(0, W + 120); w.vx = -120; w.vy = rand(520, 700); }

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }
  const z = ZONES[zoneIdxAt(state === 'play' || state === 'dead' || state === 'over' ? heightM() : 0)];
  const rate = z.fx === 'rain' ? 30 : z.fx === 'sand' ? 14 : z.fx === 'star' ? 6 : z.fx === 'bubble' ? 5 : z.fx === 'firefly' ? 4 : 3;
  if (SET.fx && Math.random() < dt * rate) spawnWeather(z.fx, z.leaf);
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.t += dt; l.life -= dt;
    const sway = l.kind === 'sand' || l.kind === 'star' || l.kind === 'rain' ? 0 : l.kind === 'snow' ? 12 : l.kind === 'firefly' ? 15 : 25;
    l.x += (l.vx + Math.sin(l.t * 2) * sway) * dt; l.y += l.vy * dt;
    if (l.life <= 0 || l.y > camY + H + 20 || l.y < camY - 30 || l.x > W + 20) leaves.splice(i, 1);
  }
  if (toasts.length) { toasts[0].t += dt; if (toasts[0].t > 2.8) toasts.shift(); }
}

// красивая надпись ELDAR на загрузке — полупрозрачная, с мягким свечением и бликом
function drawEldar(y) {
  ctx.save();
  ctx.font = 'italic 700 46px Georgia, "Palatino Linotype", "Book Antiqua", "Times New Roman", serif';
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const word = 'ELDAR', gap = 9, ws = [...word].map(ch => ctx.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + gap * (word.length - 1);
  const sweep = ((time * 0.45) % 1.6 - 0.3) * W;
  const g = ctx.createLinearGradient(sweep - 50, 0, sweep + 50, 0);
  g.addColorStop(0, 'rgba(255,255,255,0.62)'); g.addColorStop(0.5, 'rgba(255,255,255,0.98)'); g.addColorStop(1, 'rgba(255,255,255,0.62)');
  let x = W / 2 - total / 2;

    ctx.shadowColor = 'rgba(255,255,255,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = g; ctx.fillText(ch, x, fy);
    ctx.shadowBlur = 0; ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.strokeText(ch, x, fy);
    x += ws[i] + gap;
  });
  // тонкие линии с ромбиками по бокам

  ctx.restore();
}

function update(dt) {
  time += dt;
  if (fadeT > 0) fadeT -= dt;
  if (flashT > 0) flashT -= dt;
  if (state === 'load') { updateLoad(dt); return; }
  if (chest) chest.t += dt;
  if (modal) modal.t += dt;

  if (state === 'menu' && !dailyShown) { dailyShown = true; if (canClaim()) modal = { kind: 'daily', t: 0 }; }
  blinkT -= dt; if (blinkT < -0.12) blinkT = rand(2, 4);
  if (paused && state === 'play') return;
  updateParts(dt);
  updateBirds(dt);
  updatePoles(dt);
  if (state === 'menu' || state === 'shop' || state === 'ach' || state === 'set') return;
  if (state === 'play') updatePlayer(dt);
  else {
    deadT += dt;
    if (p.zapT > 0) {   // героя трясёт током
      p.zapT -= dt;
      if (SET.fx && Math.random() < dt * 40) parts.push({ x: p.x + rand(-20, 20), y: p.y + rand(-30, 20), vx: rand(-90, 90), vy: rand(-90, 90), life: 0.2, max: 0.2, color: Math.random() < 0.5 ? '#fff6a0' : '#7cf0ff', size: 2, grav: 0 });
      if (p.zapT <= 0) { p.vx = (p.x < W / 2 ? 1 : -1) * 100; p.vy = -420; burst(p.x, p.y, 14, '#3a3a4a', 160, 0.8, 6, -100); if (p.vanishLater) p.vanish = true; }
    } else { p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.dk !== 'flat') p.rot += dt * 10; }
    if (deadT > (p.dk === 'zap' ? 2 : 0.9) && state === 'dead') state = 'over';
  }
  if (state === 'play') {
    const target = p.y - H * 0.58;
    if (target < camY) camY += (target - camY) * Math.min(1, dt * 6);
  }
  camR = even(camY);
  const m = heightM();
  const zi = zoneIdxAt(m);
  if (zi !== zoneIdx) {
    zoneIdx = zi; banner = { zi, t: 2.6 }; sfx.zone();
    zonesSeen++; if (zonesSeen >= 5) unlock('zone5');
  }
  if (m >= 100) unlock('m100');

  if (m >= 500) unlock('m500');

  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  updateEnts(dt);
  generate();
  if (shake > 0) shake -= dt;
}

function poleColors(pl) {

function drawBird(b) {
  const x = b.x, y = b.y, d = b.dir;
  const hop = b.st === 'perch' && Math.sin(b.t * 6) > 0.85 ? 2 : 0;
  const by = y - 8 - hop;
  pell(ctx, x, by, 7, 6, '#1a3a7a');
  pell(ctx, x, by, 5, 4, '#3ab0ff');
  pell(ctx, x + d, by + 1, 3, 2, '#c8ecff');
  pell(ctx, x + d * 4, by - 4, 4, 4, '#1a3a7a');
  pell(ctx, x + d * 4, by - 4, 3, 3, '#3ab0ff');
  prect(ctx, x + d * 5 - (d < 0 ? 2 : 0), by - 6, 2, 2, '#1a1010');
  prect(ctx, x + d * 7 - (d < 0 ? 4 : 0), by - 4, 4, 2, '#ffa020');
  if (b.st === 'fly') {
    const f = Math.sin(b.t * 30) > 0 ? -6 : 2;
    prect(ctx, x - 6, by + f, 10, 2, '#1a3a7a');
  } else {
    prect(ctx, x - d * 6 - (d > 0 ? 2 : 0), by, 4, 2, '#1a3a7a');
    prect(ctx, x - 2, y - 2, 2, 2, '#ffa020'); prect(ctx, x + 2, y - 2, 2, 2, '#ffa020');
  }
}

function heroPose() {
  if (state === 'dead' || state === 'over') return 'fall';
  if (state !== 'play') return 'cling';
  if (p.state === 'wall') return 'cling';
  if (p.state === 'ground') return 'idle';
  if (p.spin > 0) return 'tuck';
  return p.vy < 0 ? 'jump' : 'fall';
}

const TIPS = () => T('tips');

function draw() {
  if (state === 'load') { drawLoad(); return; }
  ctx.save();
  if (shake > 0) ctx.translate(even(rand(-1, 1) * shake * 14), even(rand(-1, 1) * shake * 14));
  drawBackground();
  ctx.save();
  ctx.translate(0, -camR);
  drawWorld();
  ctx.restore();
  ctx.restore();
  if (state === 'dead' && p.zapT > 0 && Math.floor(time * 14) % 2) { ctx.globalAlpha = 0.2; ctx.fillStyle = '#3a6aff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (flashT > 0) { ctx.globalAlpha = clamp(flashT * 2.5, 0, 0.8); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHUD();
  if (state === 'menu') drawMenu();
  if (state === 'shop') drawShop();
  if (state === 'ach') drawAch();
  if (state === 'set') drawSettings();
  if (state === 'over') drawOver();
  if (modal) drawModal();
  if (chest) drawChest();
  drawToast();
  if (fadeT > 0) { ctx.globalAlpha = clamp(fadeT / 0.6, 0, 1); ctx.fillStyle = '#fff6d8'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ---------- Цикл ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  const steps = Math.ceil(dt / (1 / 120));
  for (let i = 0; i < steps; i++) update(dt / steps);
  draw();
  requestAnimationFrame(frame);
}
reset();
window.__game = { get state() { return state; }, get p() { return p; }, get poles() { return poles; }, press, release, heightM, setLang(l) { lang = l; } };
requestAnimationFrame(frame);

// Офлайн: кэшируем игру, если она открыта с сайта
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
